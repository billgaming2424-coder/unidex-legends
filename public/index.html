<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UniDex Legends</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            background-color: #030305; color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 6px; width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column; user-select: none; touch-action: manipulation;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
        #stats-bar {
            background: linear-gradient(180deg, #12121c 0%, #08080f 100%);
            border: 1px solid #00ffff55; padding: 4px 8px; margin-bottom: 6px; border-radius: 6px;
            font-size: 11.5px; flex-shrink: 0; display: none; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;
        }
        .stat-highlight { color: #ff00ff; font-weight: bold; }
        .stat-money { color: #ffff00; font-weight: bold; }
        #screen-wrapper { position: relative; flex: 1 1 auto; min-height: 100px; display: flex; width: 100%; margin-bottom: 6px; overflow: hidden; }
        #console {
            flex: 1 1 100%; min-height: 0; background-color: #020204; border: 2px solid #222233;
            padding: 10px; overflow-y: auto; border-radius: 8px; font-size: 13.5px; line-height: 1.4;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #14141e; padding-bottom: 3px; width: 100%; text-align: left; }
        
        #controls {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;
            flex-shrink: 0; width: 100%; max-height: 52vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px;
        }
        @media (min-width: 650px) { #controls { grid-template-columns: repeat(4, 1fr); max-height: 250px; } }
        
        .btn {
            background: #12121c; color: #00ff66; border: 1px solid #00ff6666; padding: 10px 6px;
            font-family: 'Courier New'; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; text-align: center; min-height: 42px; display: flex; align-items: center; justify-content: center;
        }
        .btn-sys { border-color: #00ffff; color: #00ffff; }
        .btn-dlc { border-color: #ff00ff; color: #ff00ff; background: #220022; }
        .btn-back { border-color: #ff3333; color: #ff3333; background: #2b0011; }
        .btn-farm { border-color: #00ff88; color: #00ff88; background: #001f0c; }
        .btn-gear { border-color: #33ccff; color: #33ccff; background: #001122; }
        .btn-map { border-color: #00ffcc; color: #00ffcc; background: #002222; }
        .btn-mine { border-color: #ffaa00; color: #ffaa00; background: #221500; }
        .btn-dex { border-color: #ffff00; color: #ffff00; background: #222200; }
        .btn-spin { border-color: #ffff00; color: #ffff00; background: #333300; }
        .btn-maid { border-color: #ff66ff; color: #ff66ff; background: #220022; }
        .dex-card { background: #08080f; border: 1px solid #222238; border-radius: 6px; padding: 8px; margin: 4px 0; width: 98%; text-align: left; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div id="save-toast" style="position:fixed; bottom:20px; right:20px; background:#002211; border:1px solid #00ff66; color:#00ff66; padding:6px 12px; border-radius:4px; font-size:12px; z-index:9999; display:none;">💾 Game Saved</div>
    <div id="stats-bar">
        <div>🌍 <span id="loc-display">Nexus HQ</span> | Trainer: <span class="stat-highlight" id="player-name-display">Trainer</span></div>
        <div>
            <span onclick="showLivePlayersModal()" style="cursor: pointer; color: #00ff88; background: #002211; border: 1px solid #00ff88; padding: 2px 6px; border-radius: 4px; font-weight: bold;">
                🟢 Online: <span id="global-online-count">1</span>
            </span>
            💰 $<span class="stat-money" id="funds-display">5000</span> | Day <span id="day-display">1</span> | ⚡ <span id="stamina-display">100</span>
        </div>
    </div>
    
    <div id="screen-wrapper">
        <div id="console"></div>
    </div>

    <div id="controls"></div>

<script>
    let socket = null;
    try { socket = io({ transports: ['websocket', 'polling'] }); } catch(e) {}

    let globalActiveTrainers = [];
    let globalChatMessages = [];
    let currentSaveSlot = 1;
    let game = { playerName: "Trainer", funds: 5000, stamina: 100, day: 1, location: "Nexus HQ", inventory: ["Energy Core", "Pokéball"], pokedex: {}, staff: [], dlcUnlocked: false };

    const PORTAL_POOLS = {
        'standard': [{ name: "Astolfo", origin: "Fate", type: "Fairy", id: 9001 }, { name: "Felix Argyle", origin: "Re:Zero", type: "Water", id: 9002 }],
        'femboyHooters': [{ name: "Astolfo (Hooters)", origin: "Femboy Hooters", type: "Fairy", id: 9501 }, { name: "Venti (Server)", origin: "Hooters", type: "Flying", id: 9503 }],
        'bikiniBottom': [{ name: "SpongeBob", origin: "Bikini Bottom", type: "Water", id: 1001 }, { name: "Patrick Star", origin: "Bikini Bottom", type: "Water", id: 1002 }],
        'halloween': [{ name: "Jack Skellington", origin: "Halloween Town", type: "Ghost", id: 2001 }],
        'christmasPortal': [{ name: "Santa Claus", origin: "North Pole", type: "Fairy", id: 7001 }],
        'gothIhop': [{ name: "Goth Raven", origin: "Azarath", type: "Dark", id: 5001 }],
        'maidCafe': [{ name: "Doug", origin: "Archive", type: "Normal", id: 6001 }, { name: "Zelda", origin: "Hyrule", type: "Psychic", id: 6002 }]
    };

    function getSaveKey(slot) { return `unidexSave_slot_${slot}`; }
    function saveGame() {
        localStorage.setItem(getSaveKey(currentSaveSlot), JSON.stringify(game));
        syncTrainerPresence();
        showSaveToast();
    }

    function syncTrainerPresence() {
        if (socket && socket.connected) {
            socket.emit('registerTrainerPresence', {
                playerName: game.playerName || "Trainer",
                location: game.location || "Nexus HQ"
            });
        }
    }

    if (socket) {
        socket.on('globalOnlineUpdate', (data) => {
            const countEl = document.getElementById("global-online-count");
            if (countEl) countEl.innerText = data.totalOnline;
            globalActiveTrainers = data.activePlayers || [];
        });

        socket.on('chatHistory', (history) => { globalChatMessages = history || []; });

        socket.on('receiveGlobalMessage', (msg) => {
            globalChatMessages.push(msg);
            if (globalChatMessages.length > 50) globalChatMessages.shift();
            let chatBox = document.getElementById("global-chat-box");
            if (chatBox) {
                chatBox.innerHTML = globalChatMessages.map(m => `<div style="margin-bottom:4px; text-align:left;"><span style="color:#00ffff;">[${m.time}]</span> <strong>${m.name}:</strong> ${m.text}</div>`).join('');
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    }

    function clearConsole(align="flex-start", bgGradient="#15002b", borderColor="#00ffff") {
        const consoleDiv = document.getElementById("console");
        consoleDiv.innerHTML = "";
        consoleDiv.style.justifyContent = align;
        consoleDiv.style.background = bgGradient;
        consoleDiv.style.borderColor = borderColor;
        consoleDiv.scrollTop = 0;
    }

    function log(msg, colorClass="") {
        const consoleDiv = document.getElementById("console");
        consoleDiv.innerHTML += `<div class="log-entry ${colorClass}">${msg}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function renderButtons(buttons) {
        const controls = document.getElementById("controls");
        controls.innerHTML = "";
        buttons.forEach((b) => {
            let btn = document.createElement("button");
            btn.className = (b.class || "btn");
            btn.innerText = b.text;
            btn.onclick = b.action;
            controls.appendChild(btn);
        });
    }

    function updateUI() {
        document.getElementById("funds-display").innerText = Math.floor(game.funds || 0);
        document.getElementById("stamina-display").innerText = game.stamina || 0;
        document.getElementById("day-display").innerText = game.day || 1;
        document.getElementById("player-name-display").innerText = game.playerName || "Trainer";
        document.getElementById("loc-display").innerText = game.location || "Nexus HQ";
        syncTrainerPresence();
    }

    function showIntroScreen() {
        clearConsole("center", "#050014", "#00ffff");
        document.getElementById("stats-bar").style.display = "none";
        let slotButtons = [];
        for (let i = 1; i <= 3; i++) {
            let rawData = localStorage.getItem(getSaveKey(i));
            let label = `Slot ${i}: Empty (New Game)`;
            let hasData = false;
            if (rawData) {
                try {
                    let parsed = JSON.parse(rawData);
                    if (parsed && parsed.playerName) {
                        label = `▶ Slot ${i}: ${parsed.playerName} (Day ${parsed.day || 1}) - $${Math.floor(parsed.funds || 0)}`;
                        hasData = true;
                    }
                } catch(e) {}
            }
            slotButtons.push({ text: label, class: hasData ? "btn btn-dlc" : "btn btn-sys", action: () => selectSaveSlot(i, hasData) });
        }
        document.getElementById("console").innerHTML = `<h1 style="color: #00ffff; font-size: 24px;">UNIDEX LEGENDS</h1><p style="color: #ffff00; font-size: 12px;">Select Save Slot:</p>`;
        renderButtons(slotButtons);
    }

    function selectSaveSlot(slotNum, hasData) {
        currentSaveSlot = slotNum;
        if (hasData) {
            try { game = JSON.parse(localStorage.getItem(getSaveKey(slotNum))); } catch (err) { game = { playerName: "Trainer", funds: 5000, stamina: 100, day: 1, location: "Nexus HQ", inventory: ["Energy Core"] }; }
        } else {
            game = { playerName: "Trainer", funds: 5000, stamina: 100, day: 1, location: "Nexus HQ", inventory: ["Energy Core", "Pokéball"], staff: [], dlcUnlocked: false };
            saveGame();
        }
        showMainMenu();
    }

    function showLivePlayersModal() {
        clearConsole("center", "#001f3f", "#00ffff");
        let html = `
            <h2 style="color: #00ffff; font-size: 16px;">🌐 ACTIVE MULTIVERSE TRAINERS</h2>
            <p style="color: #aaa; font-size: 12px;">Total Online: <strong>${globalActiveTrainers.length}</strong></p>
            <div style="width: 95%; max-width: 360px; max-height: 160px; overflow-y: auto; margin-bottom: 8px;">
        `;
        globalActiveTrainers.forEach(t => {
            html += `<div class="dex-card" style="font-size: 12px; padding: 6px;"><span>👤 <strong>${t.name}</strong></span> <span style="color:#ffaa00; margin-left:auto;">📍 ${t.location}</span></div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function showGlobalChatScreen() {
        clearConsole("flex-start", "#001a22", "#00ffff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #00ffff; font-size: 15px; margin: 4px 0;">💬 GLOBAL MULTIVERSE CHAT</h2>
            <div id="global-chat-box" style="width:100%; max-width:400px; height:130px; background:#05050a; border:1px solid #00ffff55; border-radius:4px; padding:8px; overflow-y:auto; font-size:12px; margin-bottom:8px;">
                ${globalChatMessages.map(m => `<div style="margin-bottom:4px; text-align:left;"><span style="color:#00ffff;">[${m.time}]</span> <strong>${m.name}:</strong> ${m.text}</div>`).join('') || '<div style="color:#666;">No messages yet. Say hello!</div>'}
            </div>
            <div style="display:flex; gap:6px; width:100%; max-width:400px;">
                <input type="text" id="chat-input-text" placeholder="Type a message..." style="flex:1; background:#111; color:#0f0; border:1px solid #0ff; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px;" />
                <button class="btn btn-sys" style="padding:6px 12px;" onclick="sendGlobalChatMsg()">Send</button>
            </div>
        `;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
        let chatInput = document.getElementById("chat-input-text");
        if (chatInput) {
            chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendGlobalChatMsg(); });
        }
    }

    function sendGlobalChatMsg() {
        let input = document.getElementById("chat-input-text");
        if (!input || !input.value.trim()) return;
        let text = input.value.trim();
        if (socket && socket.connected) {
            socket.emit('sendGlobalMessage', { name: game.playerName || "Trainer", text: text });
        }
        input.value = "";
    }

    function showInventoryMenu() {
        clearConsole("flex-start", "#1a0f00", "#33ccff");
        let html = `<h2 style="color: #33ccff; font-size:16px;">🎒 INVENTORY & ITEMS</h2><p style="font-size:11px; color:#aaa;">Click items to use them:</p>`;
        game.inventory.forEach((item, idx) => {
            let btnLabel = item === "Energy Core" ? `<button class="btn btn-sys" style="padding:2px 6px; font-size:10px;" onclick="useEnergyCore(${idx})">Use (+50 Stm)</button>` : '';
            html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">
                <span>📦 ${item}</span>
                ${btnLabel}
            </div>`;
        });
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function useEnergyCore(idx) {
        if (game.inventory[idx] === "Energy Core") {
            game.inventory.splice(idx, 1);
            game.stamina += 50;
            saveGame(); updateUI();
            log("⚡ Energy Core activated! Gained +50 Stamina!", "color-cyan");
            showInventoryMenu();
        }
    }

    function showLuckyWheelScreen() {
        clearConsole("center", "#333300", "#ffff00");
        document.getElementById("console").innerHTML = `
            <div style="font-size: 40px; margin-bottom: 6px;">🎡</div>
            <h2 style="color: #ffff00; font-size:16px;">🎰 LUCKY WHEEL</h2>
            <p style="color: #aaa; font-size:11.5px;">Spend $100 to spin for cash or gems!</p>
        `;
        renderButtons([
            { text: "🔄 Spin ($100)", class: "btn btn-spin", action: () => {
                if (game.funds >= 100) {
                    game.funds -= 100;
                    let roll = Math.random();
                    if (roll > 0.5) { game.funds += 300; alert("Won $300!"); }
                    else { game.inventory.push("Diamond"); alert("Won a Diamond!"); }
                    saveGame(); updateUI(); showLuckyWheelScreen();
                } else { alert("Not enough funds!"); }
            }},
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showFreePortalsMenu() {
        clearConsole("center", "#4d004d", "#ff00ff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ff00ff; font-size:16px;">🌌 FREE PORTALS</h2>
            <p style="color: #aaa; font-size:11.5px;">Explore dimensions and recruit characters!</p>
        `;
        renderButtons([
            { text: "🌌 Standard Multiverse", class: "btn btn-sys", action: () => triggerPortalCatch('standard') },
            { text: "🦉 Femboy Hooters", class: "btn btn-maid", action: () => triggerPortalCatch('femboyHooters') },
            { text: "🍍 Bikini Bottom", class: "btn btn-farm", action: () => triggerPortalCatch('bikiniBottom') },
            { text: "🎃 Halloween Portal", class: "btn btn-mine", action: () => triggerPortalCatch('halloween') },
            { text: "🎄 Christmas Realm", class: "btn btn-sys", action: () => triggerPortalCatch('christmasPortal') },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function openDLCDispatch() {
        if (game.dlcUnlocked) { showPremiumDLCMenu(); return; }
        clearConsole("center", "#4d004d", "#ff00ff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ff00ff; font-size:16px;">🔒 PREMIUM DLC PORTALS</h2>
            <p style="color: #00ffff; font-size:11.5px;">Enter VIP Passcode (MULTIVERSE):</p>
            <input type="text" id="dlc-passcode" placeholder="Passcode..." style="background:#111; color:#0f0; border:1px solid #0ff; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px; text-align:center; margin-top:6px;" />
        `;
        renderButtons([
            { text: "🔓 Unlock", class: "btn btn-dlc", action: () => {
                let val = document.getElementById("dlc-passcode").value.trim().toUpperCase();
                if (val === "MULTIVERSE") { game.dlcUnlocked = true; saveGame(); showPremiumDLCMenu(); }
                else { alert("Incorrect Passcode!"); }
            }},
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showPremiumDLCMenu() {
        clearConsole("center", "#4d004d", "#ff00ff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ff00ff; font-size:16px;">🌟 PREMIUM SECTORS</h2>
            <p style="color: #aaa; font-size:11.5px;">Unlocked VIP dimensions!</p>
        `;
        renderButtons([
            { text: "🥞 Goth IHOP", class: "btn btn-maid", action: () => triggerPortalCatch('gothIhop') },
            { text: "🏰 Maid Café", class: "btn btn-maid", action: () => triggerPortalCatch('maidCafe') },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function triggerPortalCatch(poolKey) {
        let pool = PORTAL_POOLS[poolKey] || PORTAL_POOLS['standard'];
        let chosen = pool[Math.floor(Math.random() * pool.length)];
        game.staff.push(chosen);
        saveGame();
        alert(`🎉 Captured ${chosen.name} from ${chosen.origin}!`);
        showMainMenu();
    }

    function showMarketMenu() {
        clearConsole("flex-start", "#3d1c00", "#ff8c00");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ffaa00; font-size:16px;">🏪 MARKET DISTRICT</h2>
            <p style="color: #aaa; font-size:11.5px;">Trade ores and buy utilities.</p>
        `;
        renderButtons([
            { text: "💰 Doug's Ores", class: "btn btn-mine", action: () => { game.funds += 300; game.inventory.push("Copper Ore"); saveGame(); updateUI(); alert("Traded with Doug!"); } },
            { text: "🛍️ Don's Store", class: "btn btn-farm", action: () => { if (game.funds >= 150) { game.funds -= 150; game.inventory.push("Potion"); saveGame(); updateUI(); alert("Bought Potion!"); } else { alert("Not enough funds!"); } } },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showOnlineHubMenu() {
        clearConsole("center", "#003366", "#00aaff");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#00ffff; font-size:16px;">🌐 ONLINE HUB</h2>
            <p style="color:#aaa; font-size:11.5px;">Multiplayer lobby and rooms.</p>
        `;
        renderButtons([
            { text: "📡 Connected", class: "btn btn-sys", action: () => alert("Connected to network!") },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showMainMenu() {
        clearConsole("flex-start", "#1a1500", "#ffaa00");
        document.getElementById("stats-bar").style.display = "flex";
        updateUI();
        log(`--- NEXUS HQ (Slot ${currentSaveSlot}) | WELCOME, TRAINER ---`, "color-cyan");
        renderButtons([
            { text: "🗺️ World Map", class: "btn btn-map", action: () => { game.location = "Whispering Forest"; saveGame(); updateUI(); showMainMenu(); } },
            { text: "⛏️ Stardew Mines", class: "btn btn-mine", action: () => { game.location = "Stardew Mines"; saveGame(); updateUI(); showMainMenu(); } },
            { text: "🛍️ Market District", class: "btn btn-farm", action: showMarketMenu },
            { text: "🎰 Lucky Wheel", class: "btn btn-spin", action: showLuckyWheelScreen },
            { text: "💬 Global Chat", class: "btn btn-sys", action: showGlobalChatScreen },
            { text: "🎒 Inventory", class: "btn btn-gear", action: showInventoryMenu },
            { text: "🌌 Free Portals", class: "btn btn-sys", action: showFreePortalsMenu },
            { text: "🔒 Premium DLC", class: "btn btn-dlc", action: openDLCDispatch },
            { text: "🌐 Online Hub", class: "btn btn-sys", action: showOnlineHubMenu },
            { text: "💤 Sleep", action: () => { game.stamina = 100; game.day++; saveGame(); updateUI(); showMainMenu(); } },
            { text: "📁 Switch Slot", class: "btn btn-back", action: showIntroScreen }
        ]);
    }

    window.onload = () => { showIntroScreen(); };
</script>
</body>
</html>
