<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UniDex Legends</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            background-color: #030305; color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 6px; width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column; user-select: none; touch-action: manipulation;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }

        #stats-bar {
            background: linear-gradient(180deg, #12121c 0%, #08080f 100%);
            border: 1px solid #00ffff55;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
            padding: 4px 8px; margin-bottom: 6px; border-radius: 6px;
            font-size: 11.5px; flex-shrink: 0; display: none;
            justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 4px;
        }
        .stat-highlight { color: #ff00ff; font-weight: bold; text-shadow: 0 0 8px #ff00ff88; }
        .stat-money { color: #ffff00; font-weight: bold; text-shadow: 0 0 8px #ffff0088; }
        
        #screen-wrapper {
            position: relative; flex: 1 1 auto; min-height: 120px;
            display: flex; width: 100%; margin-bottom: 6px; overflow: hidden;
        }

        #console {
            flex: 1 1 100%; min-height: 0; background-color: #020204;
            border: 2px solid #222233; padding: 10px; overflow-y: auto;
            border-radius: 8px; font-size: 13.5px; line-height: 1.4;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95), 0 0 20px rgba(0, 255, 100, 0.15);
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center;
            position: relative; -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
        }

        #console::-webkit-scrollbar, #controls::-webkit-scrollbar { width: 8px; height: 8px; }
        #console::-webkit-scrollbar-track, #controls::-webkit-scrollbar-track { background: #080811; border-radius: 4px; }
        #console::-webkit-scrollbar-thumb, #controls::-webkit-scrollbar-thumb { background: #00ffff55; border: 1px solid #00ffff; border-radius: 4px; }

        .touch-scroll-panel {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 6px; z-index: 10; pointer-events: auto;
        }
        .touch-scroll-btn {
            background: rgba(10, 10, 20, 0.85); color: #00ffff; border: 1px solid #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4); border-radius: 50%; width: 32px; height: 32px;
            font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none;
        }
        .touch-scroll-btn:active { background: #00ffff; color: #000; }

        #console::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.015), rgba(0, 0, 255, 0.04));
            z-index: 2; background-size: 100% 3px, 6px 100%; pointer-events: none; opacity: 0.65;
        }

        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #14141e; padding-bottom: 3px; width: 100%; text-align: left; position: relative; z-index: 3; }

        #controls {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;
            flex-shrink: 0; width: 100%; max-height: 45vh; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 4; padding: 2px 2px 8px 2px;
        }
        @media (min-width: 650px) { #controls { grid-template-columns: repeat(4, 1fr); max-height: 250px; } }
        
        .btn {
            background: #12121c; color: #00ff66; border: 1px solid #00ff6666; padding: 8px 4px;
            font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: bold;
            cursor: pointer; border-radius: 4px; text-align: center; transition: all 0.15s ease;
            touch-action: manipulation; min-height: 38px; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover { background: #1c1c2e; box-shadow: 0 0 10px rgba(0, 255, 100, 0.8); outline: 2px solid #00ffff; }
        .btn:active { background-color: #00ff66; color: #000; outline: 2px solid #ff00ff; }
        
        .btn-sys { border-color: #00ffff; color: #00ffff; }
        .btn-dlc { border-color: #ff00ff; color: #ff00ff; }
        .btn-villain { border-color: #ff0055; color: #ff0055; background: #2b0011; }
        .btn-back { border-color: #ff3333; color: #ff3333; }
        .btn-farm { border-color: #00ff88; color: #00ff88; background: #001f0c; }
        .btn-gear { border-color: #33ccff; color: #33ccff; background: #001122; }
        .btn-map { border-color: #00ffcc; color: #00ffcc; background: #002222; }
        .btn-mine { border-color: #ffaa00; color: #ffaa00; background: #221500; }
        .btn-combat { border-color: #ff0033; color: #ff0033; background: #33000a; }
        .btn-start { border-color: #00ffff; color: #00ffff; font-size: 13.5px; grid-column: span 2; background: #002222; }
        .btn-maid { border-color: #ff66ff; color: #ff66ff; background: #220022; }
        .btn-dex { border-color: #ffff00; color: #ffff00; background: #222200; }
        .btn-spin { border-color: #ffff00; color: #ffff00; background: #333300; }
        
        .clickable-portrait { cursor: pointer; border: 3px solid transparent; border-radius: 10px; padding: 4px; background: rgba(0,0,0,0.4); }
        .dex-card { background: #08080f; border: 1px solid #222238; border-radius: 6px; padding: 8px; margin: 4px 0; width: 98%; text-align: left; position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div id="save-toast" style="position: fixed; bottom: 20px; right: 20px; background: #002211; border: 1px solid #00ff66; color: #00ff66; padding: 6px 12px; border-radius: 4px; font-size: 12px; z-index: 9999; display: none;">💾 Game Saved</div>
    <div id="stats-bar">
        <div>🌍 <span id="loc-display">Nexus HQ</span> | Trainer: <span class="stat-highlight" id="player-name-display">Trainer</span></div>
        <div style="display: flex; align-items: center; gap: 6px;">
            💼 <span id="manager-title-display" style="color:#00ffcc; font-weight:bold;">Novice</span> | 💰 $<span class="stat-money" id="funds-display">5000</span> | Day <span id="day-display">1</span> | ⚡ <span id="stamina-display">100</span> | 🌌 <span id="dex-count-display">0/2000</span>
        </div>
    </div>
    
    <div id="screen-wrapper">
        <div id="console"></div>
        <div class="touch-scroll-panel">
            <div class="touch-scroll-btn" onclick="scrollConsole(-140)">▲</div>
            <div class="touch-scroll-btn" onclick="scrollConsole(140)">▼</div>
        </div>
    </div>

    <div id="controls"></div>

<script>
    let socket = null;
    try { socket = io({ transports: ['websocket', 'polling'] }); } catch(e) {}

    let currentSaveSlot = 1;
    let game = {
        h_name: "UniDex Legends", location: "Nexus HQ", funds: 5000,
        day: 1, stamina: 100, playerName: "Trainer", gender: "Boy",
        managerPower: 30, inventory: ["Pokéball", "Energy Core", "Copper Ore", "Diamond"], 
        staff: [], pokedex: {}, dlcUnlocked: false
    };

    function scrollConsole(offset) {
        const consoleDiv = document.getElementById("console");
        if (consoleDiv) consoleDiv.scrollBy({ top: offset, behavior: 'smooth' });
    }

    function clearConsole(align="flex-start", bgGradient="radial-gradient(circle at 50% 30%, #15002b 0%, #05000a 80%)", borderColor="#00ffff") {
        const consoleDiv = document.getElementById("console");
        consoleDiv.innerHTML = "";
        consoleDiv.style.justifyContent = align;
        consoleDiv.style.background = bgGradient;
        consoleDiv.style.borderColor = borderColor;
        consoleDiv.scrollTop = 0;
    }

    function log(msg, colorClass="") {
        const consoleDiv = document.getElementById("console");
        consoleDiv.innerHTML += `<div class="log-entry ${colorClass}">${msg}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function portrait(src, alt, maxHeight = 160) {
        return `<img src="${src}" alt="${alt}" style="max-height: ${maxHeight}px; max-width: 90%; object-fit: contain; margin-bottom: 8px; border-radius: 8px; border: 2px solid #00ffff; background: #0d0d0d;" onerror="this.style.display='none';" />`;
    }

    function updateUI() {
        document.getElementById("funds-display").innerText = Math.floor(game.funds || 0);
        document.getElementById("stamina-display").innerText = game.stamina || 0;
        document.getElementById("day-display").innerText = game.day || 1;
        document.getElementById("player-name-display").innerText = game.playerName || "Trainer";
        document.getElementById("loc-display").innerText = game.location || "Nexus HQ";
        document.getElementById("dex-count-display").innerText = `${Object.keys(game.pokedex || {}).length}/2000`;
    }

    function saveGame() {
        localStorage.setItem(`unidexSave_slot_${currentSaveSlot}`, JSON.stringify(game));
        let toast = document.getElementById("save-toast");
        if (toast) {
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2000);
        }
    }

    function renderButtons(buttons) {
        const controls = document.getElementById("controls");
        controls.innerHTML = "";
        buttons.forEach((b) => {
            let btn = document.createElement("button");
            btn.className = (b.class || "btn");
            btn.innerText = b.text;
            btn.onclick = b.action;
            controls.appendChild(btn);
        });
    }

    function showIntroScreen() {
        clearConsole("center", "radial-gradient(circle at 50% 30%, #050014 0%, #000 85%)", "#00ffff");
        document.getElementById("stats-bar").style.display = "none";

        let slotButtons = [];
        for (let i = 1; i <= 3; i++) {
            let rawData = localStorage.getItem(`unidexSave_slot_${i}`);
            let label = `Slot ${i}: Empty (New Game)`;
            let hasData = false;
            if (rawData) {
                try {
                    let parsed = JSON.parse(rawData);
                    if (parsed && parsed.playerName) {
                        label = `▶ Slot ${i}: ${parsed.playerName} (Day ${parsed.day || 1}) - $${Math.floor(parsed.funds || 0)}`;
                        hasData = true;
                    }
                } catch(e) {}
            }
            slotButtons.push({ text: label, class: hasData ? "btn btn-dlc" : "btn btn-sys", action: () => selectSaveSlot(i, hasData) });
        }

        document.getElementById("console").innerHTML = `
            <h1 style="color: #00ffff; text-shadow: 0 0 15px #00ffff; margin-bottom: 5px; font-size: 24px;">UNIDEX LEGENDS</h1>
            <p style="color: #ffff00; font-size: 12px; max-width: 380px;">Select a timeline save slot to continue your franchise!</p>
        `;
        renderButtons(slotButtons);
    }

    function selectSaveSlot(slotNum, hasData) {
        currentSaveSlot = slotNum;
        if (hasData) {
            try {
                game = Object.assign({
                    h_name: "UniDex Legends", location: "Nexus HQ", funds: 5000,
                    day: 1, stamina: 100, playerName: "Trainer", gender: "Boy",
                    managerPower: 30, inventory: ["Pokéball", "Energy Core"], staff: [], pokedex: {}, dlcUnlocked: false
                }, JSON.parse(localStorage.getItem(`unidexSave_slot_${slotNum}`)));
            } catch (err) { game = { playerName: "Trainer", funds: 5000, stamina: 100, day: 1, location: "Nexus HQ", inventory: ["Energy Core"], staff: [], pokedex: {}, dlcUnlocked: false }; }
            showMainMenu();
        } else {
            game = { playerName: "Trainer", funds: 5000, stamina: 100, day: 1, location: "Nexus HQ", inventory: ["Energy Core", "Pokéball"], staff: [], pokedex: {}, dlcUnlocked: false };
            saveGame();
            showMainMenu();
        }
    }

    function showMainMenu() {
        clearConsole("flex-start", "radial-gradient(circle at 50% 20%, #1a1500 0%, #080702 85%)", "#ffaa00");
        document.getElementById("stats-bar").style.display = "flex";
        updateUI();
        log(`--- NEXUS HQ (Slot ${currentSaveSlot}) | WELCOME, TRAINER ${game.playerName.toUpperCase()} ---`, "color-cyan");
        renderButtons([
            { text: "🗺️ World Map", class: "btn btn-map", action: () => { game.location = "Whispering Forest"; saveGame(); updateUI(); alert("Arrived in Whispering Forest!"); showMainMenu(); } },
            { text: "⛏️ Stardew Mines", class: "btn btn-mine", action: () => { game.location = "Stardew Mines"; saveGame(); updateUI(); alert("Entered Stardew Mines!"); showMainMenu(); } },
            { text: "🛍️ Market District", class: "btn btn-farm", action: showMarketMenu },
            { text: "🎰 Lucky Wheel", class: "btn btn-spin", action: showLuckyWheelScreen },
            { text: "🎒 Inventory", class: "btn btn-gear", action: showInventoryMenu },
            { text: "🌌 Free Portals", class: "btn btn-sys", action: showPortalsMenu },
            { text: "🔒 Premium DLC", class: "btn btn-dlc", action: showDLCMenu },
            { text: "💤 Sleep (Next Day)", action: () => { game.stamina = 100; game.day++; saveGame(); updateUI(); alert("Rested for the night! Stamina restored to 100."); showMainMenu(); } },
            { text: "📁 Switch Slot", class: "btn btn-back", action: showIntroScreen }
        ]);
    }

    function showInventoryMenu() {
        clearConsole("flex-start", "radial-gradient(ellipse at 50% 20%, #1a0f00 0%, #080400 80%)", "#33ccff");
        let html = `<h2 style="color: #33ccff; font-size:16px;">🎒 INVENTORY & ITEMS</h2><p style="font-size:11px; color:#aaa;">Click items to use them:</p>`;
        game.inventory.forEach((item, idx) => {
            let useBtn = item === "Energy Core" ? `<button class="btn btn-sys" style="padding:2px 6px; font-size:10px; min-height:24px;" onclick="useEnergyCore(${idx})">Use (+50 Stm)</button>` : '';
            html += `<div class="dex-card" style="font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                <span>📦 ${item}</span>
                ${useBtn}
            </div>`;
        });
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function useEnergyCore(idx) {
        if (game.inventory[idx] === "Energy Core") {
            game.inventory.splice(idx, 1);
            game.stamina += 50;
            saveGame(); updateUI();
            log("⚡ Energy Core activated! Gained +50 Stamina!", "color-cyan");
            showInventoryMenu();
        }
    }

    function showMarketMenu() {
        clearConsole("flex-start", "radial-gradient(circle at 50% 30%, #3d1c00 0%, #140a00 75%)", "#ffaa00");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ffaa00; font-size:16px;">🏪 MARKET DISTRICT</h2>
            <p style="color: #aaa; font-size:11.5px;">Trade minerals and buy goods.</p>
        `;
        renderButtons([
            { text: "💰 Doug's Ores", class: "btn btn-mine", action: () => { game.funds += 300; game.inventory.push("Copper Ore"); saveGame(); updateUI(); alert("Sold ores to Doug for $300!"); showMarketMenu(); } },
            { text: "🛍️ Don's Store", class: "btn btn-farm", action: () => { if(game.funds >= 150) { game.funds -= 150; game.inventory.push("Potion"); saveGame(); updateUI(); alert("Bought Potion from Don!"); } else { alert("Not enough funds!"); } showMarketMenu(); } },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showLuckyWheelScreen() {
        clearConsole("center", "radial-gradient(circle at 50% 30%, #333300 0%, #080800 85%)", "#ffff00");
        document.getElementById("console").innerHTML = `
            <div style="font-size: 40px; margin-bottom: 6px;">🎡</div>
            <h2 style="color: #ffff00; font-size:16px;">🎰 LUCKY WHEEL</h2>
            <p style="color: #aaa; font-size:11.5px;">Spin for rewards! (Cost: $100)</p>
        `;
        renderButtons([
            { text: "🔄 Spin ($100)", class: "btn btn-spin", action: () => {
                if (game.funds >= 100) {
                    game.funds -= 100;
                    if (Math.random() > 0.5) { game.funds += 400; alert("Jackpot! Won $400!"); }
                    else { game.inventory.push("Diamond"); alert("Won a rare Diamond!"); }
                    saveGame(); updateUI(); showLuckyWheelScreen();
                } else { alert("Not enough funds to spin!"); }
            }},
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showPortalsMenu() {
        clearConsole("center", "radial-gradient(circle at 50% 50%, #4d004d 0%, #1a001a 80%)", "#ff00ff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ff00ff; font-size:16px;">🌌 FREE PORTALS</h2>
            <p style="color: #aaa; font-size:11.5px;">Open dimensions to recruit characters!</p>
        `;
        renderButtons([
            { text: "🎀 Astolfo Portal", class: "btn btn-maid", action: () => { game.staff.push({ name: "Astolfo", origin: "Fate" }); saveGame(); alert("Recruited Astolfo!"); showMainMenu(); } },
            { text: "🖤 Felix Portal", class: "btn btn-maid", action: () => { game.staff.push({ name: "Felix Argyle", origin: "Re:Zero" }); saveGame(); alert("Recruited Felix!"); showMainMenu(); } },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showDLCMenu() {
        if (game.dlcUnlocked) { showPremiumSectors(); return; }
        clearConsole("center", "radial-gradient(circle at 50% 50%, #4d004d 0%, #1a001a 80%)", "#ff00ff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ff00ff; font-size:16px;">🔒 PREMIUM DLC PORTALS</h2>
            <p style="color: #00ffff; font-size:11.5px;">Enter Passcode (MULTIVERSE):</p>
            <input type="text" id="dlc-code" placeholder="Passcode..." style="background:#111; color:#0f0; border:1px solid #0ff; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px; text-align:center; margin-top:6px;" />
        `;
        renderButtons([
            { text: "🔓 Unlock", class: "btn btn-dlc", action: () => {
                let val = document.getElementById("dlc-code").value.trim().toUpperCase();
                if (val === "MULTIVERSE") { game.dlcUnlocked = true; saveGame(); showPremiumSectors(); }
                else { alert("Incorrect Passcode!"); }
            }},
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showPremiumSectors() {
        clearConsole("center", "radial-gradient(circle at 50% 50%, #4d004d 0%, #1a001a 80%)", "#ff00ff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ff00ff; font-size:16px;">🌟 PREMIUM SECTORS</h2>
            <p style="color: #aaa; font-size:11.5px;">VIP dimensions unlocked!</p>
        `;
        renderButtons([
            { text: "🥞 Goth IHOP Portal", class: "btn btn-maid", action: () => { game.staff.push({ name: "Goth Raven", origin: "DC" }); saveGame(); alert("Recruited Goth Raven!"); showMainMenu(); } },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    window.onload = () => { showIntroScreen(); };
</script>
</body>
</html>
