<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UniMon Legends</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            background-color: #030305; color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 6px;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Adapts cleanly to mobile browser URL bars */
            overflow: hidden; display: flex; flex-direction: column;
            user-select: none;
            touch-action: manipulation;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }

        /* Top HUD Bar */
        #stats-bar {
            background: linear-gradient(180deg, #12121c 0%, #08080f 100%);
            border: 1px solid #00ffff55;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
            padding: 4px 8px; margin-bottom: 6px; border-radius: 6px;
            font-size: 11.5px; flex-shrink: 0; display: none;
            justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 4px;
        }
        .stat-highlight { color: #ff00ff; font-weight: bold; text-shadow: 0 0 8px #ff00ff88; }
        .stat-money { color: #ffff00; font-weight: bold; text-shadow: 0 0 8px #ffff0088; }
        
        /* Main Interactive Console Wrapper */
        #screen-wrapper {
            position: relative;
            flex: 1 1 auto;
            min-height: 120px;
            display: flex;
            width: 100%;
            margin-bottom: 6px;
            overflow: hidden;
        }

        #console {
            flex: 1 1 100%; min-height: 0; background-color: #020204;
            border: 2px solid #222233;
            padding: 10px; overflow-y: auto;
            border-radius: 8px; font-size: 13.5px; line-height: 1.4;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95), 0 0 20px rgba(0, 255, 100, 0.15);
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center;
            position: relative;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* Visible Neon Scrollbars */
        #console::-webkit-scrollbar, #controls::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        #console::-webkit-scrollbar-track, #controls::-webkit-scrollbar-track {
            background: #080811;
            border-radius: 4px;
        }
        #console::-webkit-scrollbar-thumb, #controls::-webkit-scrollbar-thumb {
            background: #00ffff55;
            border: 1px solid #00ffff;
            border-radius: 4px;
        }

        /* On-Screen Mobile Touch Scroll Nudge Buttons */
        .touch-scroll-panel {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            pointer-events: auto;
        }
        .touch-scroll-btn {
            background: rgba(10, 10, 20, 0.85);
            color: #00ffff;
            border: 1px solid #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .touch-scroll-btn:active {
            background: #00ffff;
            color: #000;
        }

        /* CRT Scanline Overlay */
        #console::after {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.015), rgba(0, 255, 0, 0.04));
            z-index: 2; background-size: 100% 3px, 6px 100%; pointer-events: none; opacity: 0.65;
        }

        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #14141e; padding-bottom: 3px; width: 100%; text-align: left; position: relative; z-index: 3; }

        @keyframes travelSlide {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(8px); }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .travel-animation { animation: travelSlide 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; }

        @keyframes desertSandstorm {
            0% { background-position: 0 0; filter: sepia(0.8) brightness(1.1); transform: translateX(-4px); }
            50% { background-position: 100px 50px; filter: sepia(1) brightness(1.3); transform: translateX(4px); }
            100% { background-position: 0 0; filter: sepia(0.8) brightness(1.1); transform: translateX(-4px); }
        }
        .desert-scene { animation: desertSandstorm 2s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes volcanoEruption {
            0% { box-shadow: inset 0 0 30px rgba(255,50,0,0.3); transform: scale(1); }
            50% { box-shadow: inset 0 0 60px rgba(255,0,0,0.7); transform: scale(1.01); }
            100% { box-shadow: inset 0 0 30px rgba(255,50,0,0.3); transform: scale(1); }
        }
        .volcano-scene { animation: volcanoEruption 2s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes mineRumble {
            0% { transform: translate(0, 0); filter: brightness(0.9); }
            20% { transform: translate(-4px, 3px); filter: brightness(1.2) hue-rotate(15deg); }
            40% { transform: translate(4px, -2px); filter: brightness(0.85); }
            60% { transform: translate(-3px, -4px); filter: brightness(1.15); }
            80% { transform: translate(4px, 4px); filter: brightness(0.9); }
            100% { transform: translate(0, 0); filter: brightness(1); }
        }
        .mining-animation { animation: mineRumble 0.25s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes restNightSequence {
            0% { background: #000; opacity: 0; transform: scale(0.95); }
            30% { background: #050515; opacity: 1; transform: scale(1); }
            70% { background: #02020a; opacity: 1; transform: scale(1.02); }
            100% { background: #000; opacity: 0; transform: scale(1.05); }
        }
        .rest-scene { animation: restNightSequence 4s ease-in-out forwards; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }
        .zzz-1 { animation: zFloat 1.5s infinite ease-in; display: inline-block; font-size: 20px; color: #00ffff; }
        .zzz-2 { animation: zFloat 1.5s infinite ease-in 0.5s; display: inline-block; font-size: 26px; color: #ff00ff; }
        .zzz-3 { animation: zFloat 1.5s infinite ease-in 1s; display: inline-block; font-size: 32px; color: #ffff00; }
        @keyframes zFloat { 0% { transform: translateY(0px) translateX(0px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-30px) translateX(15px); opacity: 0; } }

        @keyframes saveToastFade { 0% { opacity: 0; transform: translateY(10px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
        #save-toast { position: fixed; bottom: 20px; right: 20px; background: #002211; border: 1px solid #00ff66; color: #00ff66; padding: 6px 12px; border-radius: 4px; font-size: 12px; z-index: 9999; display: none; box-shadow: 0 0 10px rgba(0,255,100,0.4); pointer-events: none; }

        #join-toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
        .join-toast-entry { background: #001a0d; border: 1px solid #00ff88; color: #00ff88; padding: 6px 12px; border-radius: 4px; font-size: 12px; box-shadow: 0 0 10px rgba(0,255,136,0.4); white-space: nowrap; animation: joinToastIn 0.25s ease-out; }
        @keyframes joinToastIn { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes joinToastOut { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(20px); } }

        /* --- Animated Title Screen --- */
        .title-stage { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .title-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .title-particle {
            position: absolute; bottom: -10px; left: 50%; width: 3px; height: 3px; border-radius: 50%;
            background: #00ffff; box-shadow: 0 0 6px 2px rgba(0,255,255,0.8);
            animation: titleParticleFloat linear infinite; opacity: 0;
        }
        @keyframes titleParticleFloat {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 0.9; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(-230px) translateX(var(--drift, 12px)); opacity: 0; }
        }
        .title-particle:nth-child(1)  { left: 8%;  animation-duration: 5.5s; animation-delay: 0s;    --drift: 12px;  background:#00ffff; }
        .title-particle:nth-child(2)  { left: 18%; animation-duration: 7s;   animation-delay: 1.1s;  --drift: -18px; background:#ff66ff; }
        .title-particle:nth-child(3)  { left: 28%; animation-duration: 6.2s; animation-delay: 2.3s;  --drift: 10px;  background:#00ff88; }
        .title-particle:nth-child(4)  { left: 40%; animation-duration: 8s;   animation-delay: 0.6s;  --drift: -8px;  background:#00ffff; }
        .title-particle:nth-child(5)  { left: 52%; animation-duration: 5.8s; animation-delay: 3s;    --drift: 16px;  background:#ff66ff; }
        .title-particle:nth-child(6)  { left: 63%; animation-duration: 6.8s; animation-delay: 1.8s;  --drift: -14px; background:#00ff88; }
        .title-particle:nth-child(7)  { left: 74%; animation-duration: 7.4s; animation-delay: 0.3s;  --drift: 20px;  background:#00ffff; }
        .title-particle:nth-child(8)  { left: 84%; animation-duration: 5.2s; animation-delay: 2.6s;  --drift: -10px; background:#ff66ff; }
        .title-particle:nth-child(9)  { left: 92%; animation-duration: 6.5s; animation-delay: 1.3s;  --drift: 6px;   background:#00ff88; }
        .title-particle:nth-child(10) { left: 48%; animation-duration: 9s;   animation-delay: 4s;    --drift: -22px; background:#00ffff; }

        .title-logo-wrap {
            position: relative; z-index: 2; margin-bottom: 4px;
            animation: logoReveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) both, logoGlowPulse 2.6s ease-in-out 1.1s infinite;
        }
        .title-logo-wrap svg { width: 100%; max-width: 360px; height: auto; display: block; }
        @keyframes logoReveal {
            0%   { opacity: 0; transform: scale(0.72) translateY(10px); filter: brightness(2.2) blur(6px); }
            60%  { opacity: 1; transform: scale(1.05) translateY(0);   filter: brightness(1.3) blur(0); }
            100% { opacity: 1; transform: scale(1) translateY(0);      filter: brightness(1) blur(0); }
        }
        @keyframes logoGlowPulse {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(0,255,255,0.55)) drop-shadow(0 0 22px rgba(255,102,255,0.35)); }
            50%      { filter: drop-shadow(0 0 18px rgba(0,255,255,0.85)) drop-shadow(0 0 34px rgba(255,102,255,0.55)); }
        }

        .title-tagline {
            opacity: 0; animation: fadeUpIn 0.8s ease-out 0.9s forwards;
            color: #ffff00; font-size: 12.5px; max-width: 400px; margin-top: 4px; position: relative; z-index: 2;
        }
        @keyframes fadeUpIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .title-menu-btn { opacity: 0; animation: menuBtnRise 0.5s ease-out forwards; }
        .title-menu-btn:nth-of-type(1) { animation-delay: 1.15s; }
        .title-menu-btn:nth-of-type(2) { animation-delay: 1.28s; }
        .title-menu-btn:nth-of-type(3) { animation-delay: 1.41s; }
        .title-menu-btn:nth-of-type(4) { animation-delay: 1.54s; }
        .title-menu-btn:nth-of-type(5) { animation-delay: 1.67s; }
        @keyframes menuBtnRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes wheelSpinAnim {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(1080deg) scale(1.1); filter: hue-rotate(90deg); }
            100% { transform: rotate(2160deg) scale(1); filter: hue-rotate(0deg); }
        }
        .wheel-spinning { animation: wheelSpinAnim 2.2s cubic-bezier(0.15, 0.85, 0.35, 1.05) forwards; }

        @keyframes ballToss {
            0% { transform: translateY(60px) scale(0.4) rotate(0deg); opacity: 0; }
            40% { transform: translateY(-20px) scale(1.1) rotate(360deg); opacity: 1; }
            100% { transform: translateY(0px) scale(1) rotate(720deg); opacity: 1; }
        }
        @keyframes ballWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-28deg) scale(1.05); }
            30% { transform: rotate(28deg) scale(1.05); }
            45% { transform: rotate(-18deg) scale(1.02); }
            60% { transform: rotate(18deg) scale(1.02); }
            75% { transform: rotate(-8deg) scale(1); }
            85% { transform: rotate(8deg) scale(1); }
        }
        .pokeball-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; margin: 10px 0; }
        .pokeball-sprite { width: 60px; height: 60px; border-radius: 50%; position: relative; box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.4); border: 3px solid #111; overflow: hidden; animation: ballToss 0.6s ease-out forwards, ballWobble 1.2s ease-in-out 0.6s 2; }
        .ball-top { width: 100%; height: 50%; background: #ff1a1a; }
        .ball-bottom { width: 100%; height: 50%; background: #ffffff; }
        .ball-center-band { position: absolute; top: 46%; left: 0; width: 100%; height: 8%; background: #111; z-index: 4; }
        .ball-center-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: #ffffff; border: 2px solid #111; z-index: 5; box-shadow: 0 0 4px #fff; }

        /* Responsive Action Button Grid */
        #controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            flex-shrink: 0;
            width: 100%;
            max-height: 42vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            z-index: 4;
            padding: 2px 2px 8px 2px;
        }
        @media (min-width: 650px) { #controls { grid-template-columns: repeat(4, 1fr); max-height: 250px; } }
        
        .btn {
            background: #12121c; color: #00ff66; border: 1px solid #00ff6666;
            padding: 8px 4px;
            font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: bold;
            cursor: pointer; border-radius: 4px; text-align: center; transition: all 0.15s ease;
            touch-action: manipulation; min-height: 38px; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover, .btn.gamepad-focused { background: #1c1c2e; box-shadow: 0 0 10px rgba(0, 255, 100, 0.8); outline: 2px solid #00ffff; }
        .btn:active, .btn.selected { background-color: #00ff66; color: #000; outline: 2px solid #ff00ff; }
        
        .btn-sys { border-color: #00ffff; color: #00ffff; }
        .btn-dlc { border-color: #ff00ff; color: #ff00ff; }
        .btn-villain { border-color: #ff0055; color: #ff0055; background: #2b0011; }
        .btn-back { border-color: #ff3333; color: #ff3333; }
        .btn-farm { border-color: #00ff88; color: #00ff88; background: #001f0c; }
        .btn-gear { border-color: #33ccff; color: #33ccff; background: #001122; }
        .btn-map { border-color: #00ffcc; color: #00ffcc; background: #002222; }
        .btn-mine { border-color: #ffaa00; color: #ffaa00; background: #221500; }
        .btn-combat { border-color: #ff0033; color: #ff0033; background: #33000a; }
        .btn-start { border-color: #00ffff; color: #00ffff; font-size: 13.5px; grid-column: span 2; background: #002222; }
        .btn-maid { border-color: #ff66ff; color: #ff66ff; background: #220022; }
        .btn-dex { border-color: #ffff00; color: #ffff00; background: #222200; }
        .btn-cyber { border-color: #ff9900; color: #ff9900; background: #2a1500; }
        .btn-waffle { border-color: #ffcc66; color: #ffcc66; background: #2a1c00; }
        .btn-goth { border-color: #aa00ff; color: #aa00ff; background: #1a0022; }
        .btn-bikini { border-color: #ffcc00; color: #ffcc00; background: #221800; }
        .btn-halloween { border-color: #ff6600; color: #ff6600; background: #1a0d00; }
        .btn-hooters { border-color: #ff5500; color: #ff9955; background: #331100; }
        .btn-spin { border-color: #ffff00; color: #ffff00; background: #333300; }
        .btn-raid { border-color: #ff0055; color: #ffffff; background: #4a001a; font-weight: bold; }
        
        .clickable-portrait { cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease; border: 3px solid transparent; border-radius: 10px; padding: 4px; background: rgba(0,0,0,0.4); }
        .clickable-portrait:hover { transform: scale(1.05); border-color: #00ffff; box-shadow: 0 0 12px rgba(0,255,255,0.4); }
        .dex-card { background: #08080f; border: 1px solid #222238; border-radius: 6px; padding: 8px; margin: 4px 0; width: 98%; text-align: left; position: relative; z-index: 3; box-shadow: 0 2px 6px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 10px; }
        .dex-caught-badge { margin-left: auto; width: 16px; height: 16px; flex-shrink: 0; filter: drop-shadow(0 0 2px rgba(255,60,60,0.6)); }
    </style>
</head>
<body>
    <div id="save-toast">💾 Game Saved</div>
    <div id="join-toast-container"></div>
    <div id="stats-bar">
        <div>🌍 <span id="loc-display">Nexus HQ</span> | Trainer: <span class="stat-highlight" id="player-name-display">Trainer</span></div>
        <div style="display: flex; align-items: center; gap: 6px;">
            <span onclick="showLivePlayersModal()" style="cursor: pointer; color: #00ff88; background: #002211; border: 1px solid #00ff88; padding: 2px 6px; border-radius: 4px; font-weight: bold;" title="Click to view online players">
                🟢 Online: <span id="global-online-count">1</span>
            </span>
            💼 <span id="manager-title-display" style="color:#00ffcc; font-weight:bold;">Novice</span> | 💰 $<span class="stat-money" id="funds-display">5000</span> | Day <span id="day-display">1</span> | ⚡ <span id="stamina-display">100</span> | 🌌 <span id="dex-count-display">0/2000</span>
            <input type="range" id="master-volume" min="0" max="1" step="0.05" value="0.35" oninput="updateMasterVolume(this.value)" style="width: 55px; cursor: pointer;" title="Master Volume">
            <button onclick="toggleAudioMute()" style="background:#111; color:#00ffff; border:1px solid #00ffff; border-radius:3px; padding:2px 5px; font-size:10px; cursor:pointer;" id="audio-toggle-btn">🔊</button>
            <button onclick="toggleFullScreen()" style="background:#111; color:#00ffcc; border:1px solid #00ffcc; border-radius:3px; padding:2px 5px; font-size:10px; cursor:pointer;" title="Toggle Fullscreen">⛶</button>
        </div>
    </div>
    
    <div id="screen-wrapper">
        <div id="console"></div>
        <div class="touch-scroll-panel">
            <div class="touch-scroll-btn" onclick="scrollConsole(-140)" title="Scroll Up">▲</div>
            <div class="touch-scroll-btn" onclick="scrollConsole(140)" title="Scroll Down">▼</div>
        </div>
    </div>

    <div id="controls"></div>

<script>
    let socket = null;
    try { socket = io({ transports: ['websocket', 'polling'] }); } catch(e) {}

    let REAL_CHARACTERS_DB = [];
    let currentSaveSlot = 1;

    // Small inline Poké Ball icon shown next to UniDex entries the player has captured.
    const POKEBALL_SVG = `<svg class="dex-caught-badge" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" title="Captured">
        <circle cx="16" cy="16" r="14" fill="#fff" stroke="#111" stroke-width="2"/>
        <path d="M2 16a14 14 0 0 1 28 0z" fill="#ff3b3b" stroke="#111" stroke-width="2"/>
        <rect x="2" y="14.5" width="28" height="3" fill="#111"/>
        <circle cx="16" cy="16" r="5" fill="#fff" stroke="#111" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="2" fill="#fff" stroke="#111" stroke-width="1.5"/>
    </svg>`;
    let currentRoomId = null;
    let onlineRoomPlayers = [];
    let globalActiveTrainers = [];
    let currentTradePartners = [];
    let currentIncomingChoiceList = [];
    let pendingOutgoingTrade = null; // { targetId, targetName, kind: 'item'|'character'|'cash', item?, character?, staffUid?, cash? }
    let incomingTradeOffer = null;   // { senderId, senderName, kind: 'item'|'character'|'cash', item?, character?, cash? }
    let currentRaidBossState = null; // synced from the server: { name, hp, maxHp, level, reward, key }
    let raidScreenActive = false;
    let roomChatLog = [];
    let chatScreenActive = false;
    let globalMarketListings = [];
    let currentPvPBattle = null;     // { battleId, oppId, oppName, myHp, oppHp, myMax, oppMax, isMyTurn, championName, championPower }
    let incomingPvPChallenge = null; // { challengerId, challengerName, champion }
    let pendingPvPTarget = null;     // { id, name } - who we just challenged, waiting on their answer
    
    let masterVolume = 0.35;
    let isAudioMuted = false;
    let lastActiveTrack = 'intro';
    let gamepadBtnIndex = 0;

    function scrollConsole(offset) {
        const consoleDiv = document.getElementById("console");
        if (consoleDiv) {
            consoleDiv.scrollBy({ top: offset, behavior: 'smooth' });
        }
    }

    function syncTrainerPresence() {
        if (socket && socket.connected) {
            let lead = (game.staff && game.staff.length > 0) ? getChampion() : null;
            socket.emit('registerTrainerPresence', {
                playerName: game.playerName || "Trainer",
                location: game.location || "Nexus HQ",
                funds: game.funds || 0,
                champion: lead ? lead.name : "Partner",
                power: lead ? (lead.power || 25) : 25,
                saveSlot: currentSaveSlot
            });
        }

    let currentTrackName = null;

    function playBGM(trackKey) {
        lastActiveTrack = trackKey;
        if (isAudioMuted) return;
        if (currentTrackName === trackKey) return;
        stopAllMusic();
        let track = AUDIO_TRACKS[trackKey] || AUDIO_TRACKS.intro;
        if (track) { 
            track.loop = true; 
            track.volume = masterVolume; 
            track.play().catch(() => {}); 
            currentTrackName = trackKey; 
        }
    }

    function playStarterCry(starterName) {
        if (isAudioMuted) return;
        stopAllMusic();
        let pool = PORTAL_CHAR_POOLS.standard;
        let charObj = pool.find(c => c.name === starterName);
        if (charObj && charObj.cry) {
            charObj.cry.volume = masterVolume;
            charObj.cry.currentTime = 0;
            charObj.cry.play().catch(() => {});
        }
    }

    function stopStarterCries() {
        let pool = PORTAL_CHAR_POOLS.standard || [];
        pool.forEach(c => { try { if (c.cry) { c.cry.pause(); c.cry.currentTime = 0; } } catch (e) {} });
    }

    function stopAllMusic() {
        Object.values(AUDIO_TRACKS).forEach(t => { try { t.pause(); t.currentTime = 0; } catch (e) {} });
        currentTrackName = null;
    }

    function updateMasterVolume(val) {

    }

    // --- GAMEPAD ENGINE ---
    function updateGamepadFocus() {
        const btns = Array.from(document.querySelectorAll("#controls .btn"));
        if (!btns.length) return;
        gamepadBtnIndex = Math.max(0, Math.min(gamepadBtnIndex, btns.length - 1));
        btns.forEach((b, idx) => {
            if (idx === gamepadBtnIndex) b.classList.add("gamepad-focused");
            else b.classList.remove("gamepad-focused");
        });
    }

    let gpLastNav = 0;
    function pollGamepads() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const now = Date.now();
        for (let i = 0; i < gamepads.length; i++) {
            let gp = gamepads[i];
            if (gp) {
                let dpadUp = gp.buttons[12] && gp.buttons[12].pressed;
                let dpadDown = gp.buttons[13] && gp.buttons[13].pressed;
                let dpadLeft = gp.buttons[14] && gp.buttons[14].pressed;
                let dpadRight = gp.buttons[15] && gp.buttons[15].pressed;
                let stickY = gp.axes[1] || 0;
                let stickX = gp.axes[0] || 0;

                const btns = Array.from(document.querySelectorAll("#controls .btn"));
                if (btns.length && (now - gpLastNav > 180)) {
                    if (dpadRight || stickX > 0.5) {
                        gamepadBtnIndex = (gamepadBtnIndex + 1) % btns.length;
                        gpLastNav = now;
                        updateGamepadFocus();
                    } else if (dpadLeft || stickX < -0.5) {
                        gamepadBtnIndex = (gamepadBtnIndex - 1 + btns.length) % btns.length;
                        gpLastNav = now;
                        updateGamepadFocus();
                    } else if (dpadDown || stickY > 0.5) {
                        gamepadBtnIndex = Math.min(gamepadBtnIndex + 2, btns.length - 1);
                        gpLastNav = now;
                        updateGamepadFocus();
                    } else if (dpadUp || stickY < -0.5) {
                        gamepadBtnIndex = Math.max(gamepadBtnIndex - 2, 0);
                        gpLastNav = now;
                        updateGamepadFocus();
                    }
                }

                if (gp.buttons[0] && gp.buttons[0].pressed) {
                    if (!window._gpA_pressed) {
                        window._gpA_pressed = true;
                        if (btns[gamepadBtnIndex]) btns[gamepadBtnIndex].click();
                    }
                } else { window._gpA_pressed = false; }

                if (gp.buttons[1] && gp.buttons[1].pressed) {
                    if (!window._gpB_pressed) {
                        window._gpB_pressed = true;
                        let backBtn = document.querySelector(".btn-back");
                        if (backBtn) backBtn.click();
                    }
                } else { window._gpB_pressed = false; }
            }
        }
        requestAnimationFrame(pollGamepads);
    }
    requestAnimationFrame(pollGamepads);

        let existingIds = new Set(REAL_CHARACTERS_DB.map(c => c.id));

    };
    const TYPE_ICON_LIST = Object.keys(TYPE_ICON_THEME);

    function svgTypeIconMarkup(type) {
        let theme = TYPE_ICON_THEME[type] || TYPE_ICON_THEME.Normal;
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <defs><radialGradient id="tg" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="${theme.bg}"/>
                <stop offset="100%" stop-color="${theme.bg2}"/>
            </radialGradient></defs>
            <circle cx="32" cy="32" r="30" fill="url(#tg)" stroke="#000" stroke-opacity="0.3" stroke-width="2"/>
            ${theme.glyph}
        </svg>`;
    }

    let _typeIconUriCache = {};
    function typeIconDataUri(type) {
        if (!_typeIconUriCache[type]) {
            _typeIconUriCache[type] = 'data:image/svg+xml,' + encodeURIComponent(svgTypeIconMarkup(type));
        }
        return _typeIconUriCache[type];
    }

    // Deterministic (not random) so the same character always gets the same badge.
    function hashTypeForName(name) {
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return TYPE_ICON_LIST[h % TYPE_ICON_LIST.length];
    }

    let _typeByNameIndex = null;
    let _typeByNameIndexDbSize = -1;
    function buildTypeByNameIndex() {
        let idx = {};
        (REAL_CHARACTERS_DB || []).forEach(c => { if (c.type && c.name) idx[c.name.toLowerCase()] = c.type; });
        Object.values(PORTAL_CHAR_POOLS || {}).forEach(pool => {
            pool.forEach(c => { if (c.type && c.name) idx[c.name.toLowerCase()] = c.type; });
        });
        return idx;
    }

    function resolveCharacterType(name) {
        if (!name) return 'Normal';
        // REAL_CHARACTERS_DB loads async, so rebuild the index once it actually has data.
        if (!_typeByNameIndex || _typeByNameIndexDbSize !== REAL_CHARACTERS_DB.length) {
            _typeByNameIndex = buildTypeByNameIndex();
            _typeByNameIndexDbSize = REAL_CHARACTERS_DB.length;
        }
        return _typeByNameIndex[String(name).toLowerCase()] || hashTypeForName(String(name));
    }

    // Wired into onerror for every catchable-character <img> - swaps a missing/broken
    // photo for that character's type badge instead of leaving a blank box.
    function applyTypeIconFallback(imgEl, name) {
        imgEl.onerror = null;
        imgEl.src = typeIconDataUri(resolveCharacterType(name));
        imgEl.style.objectFit = 'cover';
        imgEl.style.background = '#111';
    }

    function escAttr(str) {
        return String(str == null ? '' : str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // Same visual treatment as portrait(), but falls back to the type badge on error
    // instead of hiding the image - use this for anything caught in the UniDex.
    function characterPortrait(name, maxHeight = 190) {
        let src = getCharacterPortrait(name);
        return `<img src="${src}" alt="${name}" style="max-height: ${maxHeight}px; max-width: 90%; object-fit: contain; margin-bottom: 8px; border-radius: 8px; border: 2px solid #00ffff; background: #0d0d0d; box-shadow: 0 0 15px rgba(0,255,255,0.3);" onerror="applyTypeIconFallback(this, '${escAttr(name)}')" />`;
    }

        stopStarterCries();

        game.staff = []; game.partyUids = []; game.championUid = null;

        recordDex(dexId, false);
        saveGame();
        showMainMenu();

    function recordDex(id, isShiny = false) {
        if (!game.pokedex) game.pokedex = {};
        let key = String(id);
        if (!game.pokedex[key]) game.pokedex[key] = { discovered: true, shiny: isShiny, count: 1 };
        else { game.pokedex[key].count++; if (isShiny) game.pokedex[key].shiny = true; }
        checkAchievements();
    }

    // --- CHAMPION & ACTIVE PARTY (max 6, Pokémon-style) ---
    const MAX_PARTY_SIZE = 6;

    function generateUid() {
        return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // Backfills uids on older saves, keeps game.partyUids/game.championUid pointing at
    // real roster members, and auto-populates the party from the roster the very first
    // time a save from before the party system existed gets loaded.
    function ensurePartySystem() {
        if (!game.staff) game.staff = [];
        game.staff.forEach(s => { if (!s.uid) s.uid = generateUid(); });
        if (!Array.isArray(game.partyUids)) game.partyUids = [];
        game.partyUids = game.partyUids.filter(uid => game.staff.some(s => s.uid === uid));
        if (game.partyUids.length === 0 && game.staff.length > 0) {
            game.partyUids = game.staff.slice(0, MAX_PARTY_SIZE).map(s => s.uid);
        }
        if (!game.championUid || !game.partyUids.includes(game.championUid)) {
            game.championUid = game.partyUids[0] || null;
        }
    }

    function getActiveParty() {
        ensurePartySystem();
        return game.partyUids.map(uid => game.staff.find(s => s.uid === uid)).filter(Boolean);
    }

    function getReserve() {
        ensurePartySystem();
        return game.staff.filter(s => !game.partyUids.includes(s.uid));
    }

    function getChampion() {
        ensurePartySystem();
        if (game.championUid) {
            let c = game.staff.find(s => s.uid === game.championUid);
            if (c) return c;
        }
        let party = getActiveParty();

    // --- AETHERIA BLACKJACK (21 vs the dealer) ---
    const CARD_RANKS = [
        { rank: 'A', value: 11 }, { rank: '2', value: 2 }, { rank: '3', value: 3 }, { rank: '4', value: 4 },
        { rank: '5', value: 5 }, { rank: '6', value: 6 }, { rank: '7', value: 7 }, { rank: '8', value: 8 },
        { rank: '9', value: 9 }, { rank: '10', value: 10 }, { rank: 'J', value: 10 }, { rank: 'Q', value: 10 }, { rank: 'K', value: 10 }
    ];
    const CARD_SUITS = ['♠️', '♥️', '♦️', '♣️'];

    function drawCard() {
        let r = CARD_RANKS[Math.floor(Math.random() * CARD_RANKS.length)];
        let s = CARD_SUITS[Math.floor(Math.random() * CARD_SUITS.length)];
        return { rank: r.rank, value: r.value, suit: s };
    }

    function handTotal(cards) {
        let total = cards.reduce((sum, c) => sum + c.value, 0);
        let aces = cards.filter(c => c.rank === 'A').length;
        while (total > 21 && aces > 0) { total -= 10; aces--; }
        return total;
    }

    function cardLabel(c) { return `${c.rank}${c.suit}`; }

    let blackjackState = null; // { bet, playerCards, dealerCards }

    function showBlackjackScreen(message = "") {
        playBGM('shop');

            ${message ? `<p style="font-size:12px; margin-top:6px;">${message}</p>` : ''}
        `;

    function startBlackjackHand(amount) {
        if (amount <= 0 || game.funds < amount) {
            showBlackjackScreen(`<span style="color:#ff6666;">❌ Not enough funds for that bet!</span>`);
            return;
        }
        game.funds -= amount;
        blackjackState = { bet: amount, playerCards: [drawCard(), drawCard()], dealerCards: [drawCard(), drawCard()] };
        updateUI(); saveGame();

        if (handTotal(blackjackState.playerCards) === 21) {
            standBlackjack(); // natural blackjack - auto-resolve against the dealer's hand
        } else {
            renderBlackjackTable();
        }
    }

    function renderBlackjackTable(revealDealer = false, message = "") {
        clearConsole("center", "radial-gradient(circle at 50% 30%, #002211 0%, #000805 85%)", "#00ff66");
        let b = blackjackState;
        let playerTotal = handTotal(b.playerCards);
        let dealerShown = revealDealer ? b.dealerCards : [b.dealerCards[0]];
        let dealerTotal = revealDealer ? handTotal(b.dealerCards) : '?';
        document.getElementById("console").innerHTML = `
            <h2 style="color:#00ff66; font-size:18px;">🃏 BLACKJACK TABLE</h2>
            <p style="color:#ff6666; font-size:13px;">Dealer: ${dealerShown.map(cardLabel).join(' ')}${revealDealer ? '' : ' 🂠'} (${dealerTotal})</p>
            <p style="color:#00ffff; font-size:13px;">You: ${b.playerCards.map(cardLabel).join(' ')} (${playerTotal})</p>
            <p style="color:#ffd700; font-size:12px;">💵 Bet: $${b.bet}</p>
            ${message ? `<p style="font-size:12px; margin-top:6px;">${message}</p>` : ''}
        `;
        if (!revealDealer) {
            renderButtons([
                { text: "🃏 Hit", class: "btn btn-combat", action: hitBlackjack },
                { text: "✋ Stand", class: "btn btn-start", action: standBlackjack }
            ]);
        } else {
            renderButtons([
                { text: "🔁 Play Again", class: "btn btn-combat", action: () => showBlackjackScreen() },
                { text: "⬅ Back to Casino", class: "btn btn-back", action: showCasinoMenu }
            ]);
        }
    }

    function hitBlackjack() {
        if (!blackjackState) { showBlackjackScreen(); return; }
        blackjackState.playerCards.push(drawCard());
        if (handTotal(blackjackState.playerCards) > 21) {
            finishBlackjackHand(`<strong style="color:#ff6666;">💥 BUST! You went over 21 and lost $${blackjackState.bet}.</strong>`);
        } else {
            renderBlackjackTable(false);
        }
    }

    function standBlackjack() {
        if (!blackjackState) { showBlackjackScreen(); return; }
        let b = blackjackState;
        while (handTotal(b.dealerCards) < 17) {
            b.dealerCards.push(drawCard());
        }
        let playerTotal = handTotal(b.playerCards);
        let dealerTotal = handTotal(b.dealerCards);

        if (playerTotal > 21) {
            finishBlackjackHand(`<strong style="color:#ff6666;">💥 BUST! You lost $${b.bet}.</strong>`);
        } else if (dealerTotal > 21 || playerTotal > dealerTotal) {
            let isNaturalBlackjack = b.playerCards.length === 2 && playerTotal === 21;
            let payout = isNaturalBlackjack ? Math.floor(b.bet * 2.5) : b.bet * 2;
            game.funds += payout;
            finishBlackjackHand(`<strong style="color:#55ff99;">🎉 ${isNaturalBlackjack ? 'BLACKJACK! ' : ''}You win $${payout}!</strong>`);
        } else if (playerTotal === dealerTotal) {
            game.funds += b.bet;
            finishBlackjackHand(`<strong style="color:#ffd700;">🤝 Push! Your bet was returned.</strong>`);
        } else {
            finishBlackjackHand(`<strong style="color:#ff6666;">💥 Dealer wins. You lost $${b.bet}.</strong>`);
        }
    }

    function finishBlackjackHand(message) {
        updateUI(); saveGame();
        renderBlackjackTable(true, message);
        blackjackState = null;
    }

        let totalWeight = WHEEL_PRIZES.reduce((sum, p) => sum + p.weight, 0);

            if (roll < prize.weight) return prize;
            roll -= prize.weight;
        }
        return WHEEL_PRIZES[0];
    }

    // --- STAFF ROSTER & INTERACTIONS ---
    function staffCardHtml(s, extraButtonsHtml) {
        let isChampion = game.championUid && s.uid === game.championUid;
        let costumeDef = s.costume ? getCostumeDef(s.costume) : null;
        return `
            <div class="dex-card" style="display:flex; justify-content:space-between; align-items:center; ${isChampion ? 'border-color:#ffd700; box-shadow:0 0 8px rgba(255,215,0,0.35);' : ''}">
                <div style="display:flex; align-items:center; gap:8px;">
                    <img src="${getCharacterPortrait(s.name)}" style="width:34px;height:34px;object-fit:contain;border-radius:6px;border:1px solid #a020f0;" onerror="applyTypeIconFallback(this, '${escAttr(s.name)}')"/>
                    <div style="font-size:12px;">
                        <strong>${isChampion ? '👑 ' : ''}${s.name}${costumeDef ? ` ${costumeDef.emoji}` : ''}</strong><br>
                        <span style="font-size:10.5px;color:#aaa;">Origin: ${s.origin || 'Unknown'} | Power: ${s.power || 0}${costumeDef ? ` | 🎭 ${costumeDef.name}` : ''}</span>
                    </div>
                </div>
                <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;">
                    ${extraButtonsHtml}
                    <button class="btn btn-maid" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="interactWithStaff('${s.uid}')">💬 Talk</button>
                    <button class="btn btn-back" style="padding:3px 8px; font-size:11px; min-height:28px; border-color:#ff3333; color:#ff6666;" onclick="confirmReleaseStaff('${s.uid}')">🗑️ Release</button>
                </div>
            </div>
        `;
    }

    function showStaffMenu() {
        playBGM('staff');
        clearConsole("flex-start", "radial-gradient(circle at 50% 25%, #2b005c 0%, #0c001a 80%)", "#a020f0");
        ensurePartySystem();
        let party = getActiveParty();
        let reserve = getReserve();
        let html = `<h2 style="color:#a020f0; font-size:18px;">⚔️ STAFF ROSTER & INTERACTIONS</h2><div style="width:100%;">`;

        if (!game.staff.length) {
            html += `<p style="color:#aaa; font-size:12px;">No staff recruited yet.</p>`;
        } else {
            html += `<p style="color:#ffd700; font-size:11.5px; margin:6px 0 3px 0;">⭐ ACTIVE PARTY (${party.length}/${MAX_PARTY_SIZE})</p>`;
            party.forEach((s) => {
                let isChampion = game.championUid === s.uid;
                let extra = `
                    ${!isChampion ? `<button class="btn btn-start" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="setChampion('${s.uid}')">👑 Champion</button>` : ''}
                    ${party.length > 1 ? `<button class="btn btn-sys" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="benchPartyMember('${s.uid}')">➖ Bench</button>` : ''}
                `;
                html += staffCardHtml(s, extra);
            });

            html += `<p style="color:#66ccff; font-size:11.5px; margin:10px 0 3px 0;">📦 RESERVE (PC BOX) (${reserve.length})</p>`;
            if (!reserve.length) {
                html += `<p style="color:#888; font-size:11.5px;">Nobody in reserve right now.</p>`;
            } else {
                reserve.forEach((s) => {
                    let extra = `<button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="addToParty('${s.uid}')">➕ Add to Party</button>`;
                    html += staffCardHtml(s, extra);
                });
            }
        }
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function setChampion(uid) {
        let member = game.staff.find(s => s.uid === uid);
        if (!member) return;
        // Champion must be an active party member - promoting from reserve pulls them in
        // first (swapping out the current champion if the party's already full).
        if (!game.partyUids.includes(uid)) {
            if (game.partyUids.length >= MAX_PARTY_SIZE) {
                game.partyUids[0] = uid;
            } else {
                game.partyUids.push(uid);
            }
        }
        game.championUid = uid;
        saveGame(); updateUI();
        showStaffMenu();
    }

    function benchPartyMember(uid) {
        if (game.partyUids.length <= 1) {
            alert("You need at least one active party member!");
            return;
        }
        game.partyUids = game.partyUids.filter(u => u !== uid);
        if (game.championUid === uid) game.championUid = game.partyUids[0] || null;
        saveGame(); updateUI();
        showStaffMenu();
    }

    function addToParty(uid) {
        if (!game.staff.some(s => s.uid === uid)) return;
        if (game.partyUids.includes(uid)) { showStaffMenu(); return; }
        if (game.partyUids.length >= MAX_PARTY_SIZE) {
            showPartySwapPicker(uid);
            return;
        }
        game.partyUids.push(uid);
        if (!game.championUid) game.championUid = uid;
        saveGame(); updateUI();
        showStaffMenu();
    }

    // Party's full (6/6) - let the player pick who gets benched to make room.
    function showPartySwapPicker(incomingUid) {
        let incoming = game.staff.find(s => s.uid === incomingUid);
        if (!incoming) { showStaffMenu(); return; }
        playBGM('staff');
        clearConsole("flex-start", "radial-gradient(circle at 50% 25%, #2b005c 0%, #0c001a 80%)", "#a020f0");
        let html = `<h2 style="color:#a020f0; font-size:16px;">Party's full! Bench someone to make room for ${incoming.name}:</h2><div style="width:100%;">`;
        getActiveParty().forEach((s) => {
            html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center;">
                <span>${game.championUid === s.uid ? '👑 ' : ''}${s.name} (Pwr ${s.power || 0})</span>
                <button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="swapIntoParty('${incomingUid}', '${s.uid}')">Swap In ${incoming.name}</button>
            </div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Cancel", class: "btn btn-back", action: showStaffMenu }]);
    }

    function swapIntoParty(incomingUid, outgoingUid) {
        let idx = game.partyUids.indexOf(outgoingUid);
        if (idx === -1) { showStaffMenu(); return; }
        game.partyUids[idx] = incomingUid;
        if (game.championUid === outgoingUid) game.championUid = incomingUid;
        saveGame(); updateUI();
        showStaffMenu();
    }

    // Lets a player release a staff member they've caught (typically an extra copy of
    // someone they already have) back into the multiverse, freeing up the roster.
    function confirmReleaseStaff(uid) {
        let member = game.staff.find(s => s.uid === uid);
        if (!member) return;
        if (game.staff.length <= 1) {
            alert("You need at least one team member! Recruit another before releasing this one.");
            return;
        }
        playBGM('staff');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #2b005c 0%, #0c001a 80%)", "#ff3333");
        document.getElementById("console").innerHTML = `
            ${characterPortrait(member.name, 160)}
            <p style="color: #ffff00; font-size: 13px; line-height: 1.45; max-width: 400px;">
                👴 <strong>[Professor Bill]:</strong> "You want to release <strong>${member.name}</strong> back into the multiverse? This can't be undone!"
            </p>
        `;
        renderButtons([
            { text: "✔ Yes, release them", class: "btn btn-back", action: () => releaseStaffMember(uid) },
            { text: "❌ Nevermind", class: "btn btn-start", action: showStaffMenu }
        ]);
    }

    function releaseStaffMember(uid) {
        let idx = game.staff.findIndex(s => s.uid === uid);
        if (idx === -1) { showStaffMenu(); return; }
        let member = game.staff[idx];
        game.staff.splice(idx, 1);
        game.partyUids = game.partyUids.filter(u => u !== uid);
        if (game.championUid === uid) game.championUid = null;

        // Releasing removes them from your active roster, but keeps the UniDex entry
        // discovered (just like a real Pokédex) - only the extra "count" goes down.
        if (member.dexId != null && game.pokedex && game.pokedex[String(member.dexId)]) {
            let entry = game.pokedex[String(member.dexId)];
            entry.count = Math.max(0, (entry.count || 1) - 1);
        }

        game.funds += 50;
        saveGame(); updateUI();
        alert(`👋 Released ${member.name} back into the multiverse. (+$50)`);
        showStaffMenu();
    }

    function interactWithStaff(uid) {
        let member = game.staff.find(s => s.uid === uid);
        if (!member) return;
        playBGM('staff');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #2b005c 0%, #0c001a 80%)", "#a020f0");
        document.getElementById("console").innerHTML = `
            ${characterPortrait(member.name, 160)}
            <h3 style="color:#ff66ff; font-size:16px;">💬 Chat with ${member.name}</h3>
            <p style="color:#ffff00; font-size:12.5px; max-width:380px; line-height:1.4;">
                "Hey trainer ${game.playerName}! Thanks for having me along across timelines in Aetheria. Let's keep pushing our limits!"
            </p>
        `;
        renderButtons([
            { text: "💖 Give Gift ($100)", class: "btn btn-start", action: () => {
                if (game.funds >= 100) {
                    game.funds -= 100;
                    member.power = (member.power || 20) + 5;
                    saveGame(); updateUI();
                    alert(`${member.name} smiles warmly! Power increased by +5!`);
                } else { alert("Not enough funds for a gift!"); }
                showStaffMenu();
            }},
            { text: "⬅ Back to Roster", class: "btn btn-back", action: showStaffMenu }
        ]);
    }

    // --- COSTUMES (cosmetic-only outfits, dropped by holiday portals) ---
    const COSTUME_CATALOG = {
        halloween: { id: 'costume_halloween_vampire', poolKey: 'halloween', name: 'Vampire Cape', emoji: '🧛' },
        christmasPortal: { id: 'costume_christmas_santa', poolKey: 'christmasPortal', name: 'Santa Suit', emoji: '🎅' },
        valentinePortal: { id: 'costume_valentine_cupid', poolKey: 'valentinePortal', name: 'Cupid Wings', emoji: '💘' },
        paddysPortal: { id: 'costume_paddys_leprechaun', poolKey: 'paddysPortal', name: 'Leprechaun Suit', emoji: '☘️' },
        summerPortal: { id: 'costume_summer_beachwear', poolKey: 'summerPortal', name: 'Beach Wear', emoji: '🏖️' }
    };
    const COSTUME_DROP_CHANCE = 0.3;

    function getCostumeDef(id) {
        return Object.values(COSTUME_CATALOG).find(c => c.id === id) || null;
    }

    function grantCostume(costumeDef) {
        if (!game.unlockedCostumes) game.unlockedCostumes = [];
        let alreadyOwned = game.unlockedCostumes.includes(costumeDef.id);
        if (!alreadyOwned) game.unlockedCostumes.push(costumeDef.id);
        updateUI(); saveGame();

        clearConsole("center", "radial-gradient(circle at 50% 50%, #4d004d 0%, #1a001a 80%)", "#ff00ff");
        document.getElementById("console").innerHTML = `
            <div style="font-size:50px; margin-bottom:8px;">${costumeDef.emoji}</div>
            <h2 style="color:#ff00ff; font-size:18px;">🎭 COSTUME FOUND!</h2>
            <p style="color:#00ffff; font-size:14px; max-width:360px;">${alreadyOwned ? `You found another ${costumeDef.name}, but you already own one.` : `You unlocked the <strong>${costumeDef.name}</strong> costume!`}</p>
            <p style="color:#aaa; font-size:11px;">Head to the 🎭 Costumes menu to equip it on any team member.</p>
        `;
        renderButtons([
            { text: "🎭 Go to Costumes", class: "btn btn-maid", action: showCostumesMenu },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);

    function showCostumesMenu() {
        playBGM('staff');
        clearConsole("flex-start", "radial-gradient(circle at 50% 25%, #4d004d 0%, #0c001a 80%)", "#ff66ff");
        if (!game.unlockedCostumes) game.unlockedCostumes = [];
        let html = `<h2 style="color:#ff66ff; font-size:18px;">🎭 COSTUME WARDROBE</h2>`;

        if (!game.unlockedCostumes.length) {
            html += `<p style="color:#aaa; font-size:12px; max-width:360px;">You haven't found any costumes yet! Holiday portals (🌌 Free Portals - Halloween, Christmas, Valentine's, Saint Paddy's, and Summer) all have a chance to drop one instead of a wild encounter.</p>`;
            document.getElementById("console").innerHTML = html;
            renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
            return;
        }

        html += `<p style="color:#aaa; font-size:12px;">Pick a team member to change their costume (purely cosmetic - no stat changes):</p><div style="width:100%;">`;
        if (!game.staff.length) {
            html += `<p style="color:#aaa; font-size:12px;">No staff recruited yet.</p>`;

            game.staff.forEach((s) => {
                let equipped = s.costume ? getCostumeDef(s.costume) : null;

                        <div style="display:flex; align-items:center; gap:8px;">

                            <div style="font-size:12px;">
                                <strong>${s.name}</strong><br>
                                <span style="font-size:10.5px;color:#aaa;">${equipped ? `${equipped.emoji} Wearing: ${equipped.name}` : 'No costume equipped'}</span>
                            </div>
                        </div>
                        <button class="btn btn-maid" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="showCostumePickerForMember('${s.uid}')">🎭 Change</button>
                    </div>
                `;
            });
        }
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function showCostumePickerForMember(uid) {
        let member = game.staff.find(s => s.uid === uid);
        if (!member) { showCostumesMenu(); return; }
        playBGM('staff');
        clearConsole("center", "radial-gradient(circle at 50% 25%, #4d004d 0%, #0c001a 80%)", "#ff66ff");
        document.getElementById("console").innerHTML = `
            ${characterPortrait(member.name, 140)}
            <h2 style="color:#ff66ff; font-size:16px;">🎭 Costumes for ${member.name}</h2>
            <p style="color:#aaa; font-size:11.5px;">Purely cosmetic - no stat changes.</p>
        `;
        let buttons = (game.unlockedCostumes || []).map(id => {
            let def = getCostumeDef(id);
            if (!def) return null;
            let isEquipped = member.costume === id;
            return { text: `${def.emoji} ${def.name}${isEquipped ? ' (Equipped)' : ''}`, class: isEquipped ? "btn btn-start" : "btn btn-maid", action: () => equipCostume(uid, id) };
        }).filter(Boolean);

        if (member.costume) {
            buttons.push({ text: "❌ Remove Costume", class: "btn btn-back", action: () => equipCostume(uid, null) });
        }
        buttons.push({ text: "⬅ Back to Wardrobe", class: "btn btn-back", action: showCostumesMenu });
        renderButtons(buttons);
    }

    function equipCostume(uid, costumeId) {
        let member = game.staff.find(s => s.uid === uid);
        if (!member) { showCostumesMenu(); return; }
        member.costume = costumeId || null;
        saveGame(); updateUI();
        showCostumePickerForMember(uid);
    }

        renderButtons([
            { text: "🌌 Standard Multiverse", class: "btn btn-sys", action: () => triggerPortalTheme("standard", 'hq') },
            { text: "🦉 Femboy Hooters", class: "btn btn-hooters", action: () => triggerPortalTheme("femboyHooters", 'staff') },
            { text: "🍍 Bikini Bottom", class: "btn btn-bikini", action: () => triggerPortalTheme("bikiniBottom", 'shop') },
            { text: "🎃 Halloween Portal", class: "btn btn-halloween", action: () => triggerPortalTheme("halloween", 'halloween') },

    function triggerPortalTheme(poolKey, musicKey) {
        playBGM(musicKey || 'rift');
        let costumeDef = COSTUME_CATALOG[poolKey];
        if (costumeDef && Math.random() < COSTUME_DROP_CHANCE) {
            grantCostume(costumeDef);
            return;
        }
        let pool = PORTAL_CHAR_POOLS[poolKey] || PORTAL_CHAR_POOLS.standard;

    function sendTradeOffer(partnerIdx, kind, payload) {
        let partner = currentTradePartners[partnerIdx];
        if (!partner || !socket) return;
        let offerPayload;
        if (kind === 'item') {
            pendingOutgoingTrade = { targetId: partner.id, targetName: partner.name, kind, item: payload };
            offerPayload = { item: payload };
        } else if (kind === 'cash') {
            pendingOutgoingTrade = { targetId: partner.id, targetName: partner.name, kind, cash: payload };
            offerPayload = { cash: payload };
        } else {
            let member = game.staff.find(s => s.uid === payload);
            if (!member) return;
            if (game.staff.length <= 1) { alert("You need at least one team member!"); return; }
            pendingOutgoingTrade = { targetId: partner.id, targetName: partner.name, kind, character: member, staffUid: payload };
            offerPayload = { character: member };
        }
        socket.emit('offerTrade', { roomId: currentRoomId, targetId: partner.id, kind, payload: offerPayload, senderName: game.playerName });
        showTradeWaitingScreen();
    }

    function finalizeIncomingCashTrade() {
        let input = document.getElementById("incoming-cash-input");
        let amount = input ? parseInt(input.value, 10) : NaN;
        if (!amount || amount <= 0) return;
        if (amount > (game.funds || 0)) { alert("You don't have that much cash!"); return; }
        finalizeIncomingTrade('cash', amount);
    }

    function finalizeIncomingTrade(kind, choiceValue) {
        if (!incomingTradeOffer || !socket) return;
        let o = incomingTradeOffer;
        // o is flattened (kind + item/cash/character live directly on it) - rebuild the
        // {kind, payload} shape the generic trade pipeline (and applyReceivedTrade) expect.
        let receivedPayload = { item: o.item, cash: o.cash, character: o.character };
        let received = { kind: o.kind, payload: receivedPayload };
        let give, receiveMessage;

        if (kind === 'item') {
            let myItem = currentIncomingChoiceList[choiceValue];
            if (!myItem) return;
            let idx = game.inventory.indexOf(myItem);
            if (idx !== -1) game.inventory.splice(idx, 1);
            give = { kind: 'item', payload: { item: myItem } };
            applyReceivedTrade(received.kind, received.payload);
            receiveMessage = `You gave your ${myItem} and received ${tradeOfferSummary(o)} from ${o.senderName}!`;
        } else if (kind === 'cash') {
            game.funds -= choiceValue;
            give = { kind: 'cash', payload: { cash: choiceValue } };
            applyReceivedTrade(received.kind, received.payload);
            receiveMessage = `You gave $${choiceValue} and received ${tradeOfferSummary(o)} from ${o.senderName}!`;
        } else {
            if ((game.staff || []).length <= 1) { alert("You need at least one team member!"); return; }
            let myCharacter = game.staff.find(s => s.uid === choiceValue);
            if (!myCharacter) return;
            let idx = game.staff.findIndex(s => s.uid === choiceValue);
            game.staff.splice(idx, 1);
            game.partyUids = game.partyUids.filter(u => u !== choiceValue);
            if (game.championUid === choiceValue) game.championUid = null;
            give = { kind: 'character', payload: { character: myCharacter } };
            applyReceivedTrade(received.kind, received.payload);
            receiveMessage = `You gave ${myCharacter.name} and received ${tradeOfferSummary(o)} from ${o.senderName}!`;
        }

        socket.emit('acceptTrade', { targetId: o.senderId, senderName: game.playerName, offererName: o.senderName, give, receive: received });
        saveGame(); updateUI();
        finishTradeUI(receiveMessage);
        incomingTradeOffer = null;
    }

    // Applies whatever we just received in a trade (item, character, or cash) to our save.
    function applyReceivedTrade(kind, payload) {
        if (kind === 'item') {
            game.inventory.push(payload.item);
        } else if (kind === 'cash') {
            game.funds = (game.funds || 0) + payload.cash;
        } else if (kind === 'character') {
            let { uid, ...restOfCharacter } = payload.character;
            addStaffMember(restOfCharacter);
            if (payload.character.dexId != null) recordDex(payload.character.dexId, false);
        }
    }

    function executeRaidStrike() {
        if (!socket || !socket.connected) { alert("Not connected to the server - can't reach the raid boss right now."); return; }
        let lead = getChampion();
        let dmg = (lead.power || 35) + Math.floor(Math.random() * 20);
        socket.emit('attackRaidBoss', { damage: dmg, trainerName: game.playerName, championName: lead.name });
    }

    if (socket) {
        socket.on('roomUpdate', ({ roomId, players }) => { onlineRoomPlayers = players; if (currentRoomId === roomId && !chatScreenActive) renderActiveLobbyView(); });

        socket.on('assignedRandomRoom', (roomId) => {
            if (!roomId) return;
            currentRoomId = roomId;
            socket.emit('joinRoom', { roomId: currentRoomId, player: { name: game.playerName, staff: game.staff, power: game.managerPower } });
            roomChatLog = [];
            renderActiveLobbyView();
        });

        socket.on('receiveRoomMessage', (entry) => {
            roomChatLog.push(entry);
            if (roomChatLog.length > 50) roomChatLog.shift();
            if (chatScreenActive) renderRoomChatScreen();
        });

        socket.on('raidBossUpdate', (boss) => {
            currentRaidBossState = boss;
            if (raidScreenActive) renderRaidBossScreen();
        });

        socket.on('raidBossHit', (data) => {
            if (currentRaidBossState) {
                currentRaidBossState.hp = data.bossHp;
                currentRaidBossState.maxHp = data.bossMaxHp;
            }
            if (raidScreenActive) {
                let hpEl = document.getElementById("raid-boss-hp");
                if (hpEl) hpEl.innerText = `${data.bossHp} / ${data.bossMaxHp}`;
                let logEl = document.getElementById("raid-combat-log");
                if (logEl) logEl.innerHTML = `<span style="color:#00ffff;">${data.log}</span>`;
            }
            if (data.isDefeated && raidScreenActive) {
                raidScreenActive = false;
                setTimeout(() => {
                    game.funds += (data.reward || 0);
                    updateUI(); saveGame();
                    clearConsole("center", "radial-gradient(circle, #003300, #000)", "#00ff88");
                    document.getElementById("console").innerHTML = `
                        <h2 style="color:#00ff88; font-size:18px;">🏆 RAID BOSS DEFEATED!</h2>
                        <p style="color:#fff; font-size:12px;">${data.slayer} landed the final blow! Everyone who joined the fight claims $${data.reward}!</p>
                    `;
                    renderButtons([{ text: "✔ Return to Lobby", class: "btn btn-start", action: renderActiveLobbyView }]);
                }, 900);
            }
        });

        // --- Generalized trade protocol: item / character / cash all flow through the
        // same offerTrade -> receiveTradeOffer -> acceptTrade -> tradeCompleted pipeline.
        socket.on('receiveTradeOffer', (data) => {
            incomingTradeOffer = { senderId: data.senderId, senderName: data.senderName, kind: data.kind, ...data.payload };
            showIncomingTradeOffer();
        });

        socket.on('tradeCompleted', (data) => {
            if (!pendingOutgoingTrade) return;
            applyReceivedTrade(data.received.kind, data.received.payload);
            saveGame(); updateUI();
            finishTradeUI(`You gave your ${tradeOfferSummary(pendingOutgoingTrade)} and received ${tradeOfferSummary({ kind: data.received.kind, ...data.received.payload })} from ${data.partnerName}!`);
            pendingOutgoingTrade = null;
        });

        socket.on('tradeOfferDeclined', (data) => {
            if (pendingOutgoingTrade) {
                alert(`${data.declinerName || "The trainer"} declined your trade offer.`);
                pendingOutgoingTrade = null;
                renderActiveLobbyView();
            }
        });

        // --- Global player market ---
        socket.on('marketUpdate', (listings) => {
            globalMarketListings = listings || [];
        });

        socket.on('itemPurchasedSuccess', (listing) => {
            game.funds -= listing.price;
            game.inventory.push(listing.item);
            saveGame(); updateUI();
            showGlobalMarketScreen(`<span style="color:#55ff99;">✔ Bought ${listing.item} for $${listing.price}!</span>`);
        });

        socket.on('itemSoldNotification', (data) => {
            game.funds += data.price;
            saveGame(); updateUI();
            alert(`💰 ${data.buyer} bought your ${data.item} for $${data.price}!`);
        });

        socket.on('marketListingCancelled', (listing) => {
            game.inventory.push(listing.item);
            saveGame(); updateUI();
            showGlobalMarketScreen(`<span style="color:#66ccff;">Listing cancelled — ${listing.item} returned to your bag.</span>`);
        });

        // --- Live online PvP duels ---
        socket.on('pvpChallengeReceived', (data) => {
            incomingPvPChallenge = { challengerId: data.challengerId, challengerName: data.challengerName, champion: data.champion };
            showIncomingPvPChallenge();
        });

        socket.on('pvpChallengeDeclined', (data) => {
            if (pendingPvPTarget) {
                alert(`${data.declinerName || "The trainer"} declined your duel challenge.`);
                pendingPvPTarget = null;
                renderActiveLobbyView();
            }
        });

        socket.on('startLivePvP', (data) => {
            let mySide = socket.id === data.p1Id ? 1 : 2;
            let champion = getChampion();
            let oppName = mySide === 1
                ? (incomingPvPChallenge ? incomingPvPChallenge.challengerName : (pendingPvPTarget ? pendingPvPTarget.name : "Opponent"))
                : (data.challengerName || (pendingPvPTarget ? pendingPvPTarget.name : "Opponent"));
            currentPvPBattle = {
                battleId: data.battleId,
                mySide: mySide,
                oppName: oppName,
                championName: champion.name,
                championPower: champion.power || 35,
                myHp: mySide === 1 ? data.p1Max : data.p2Max,
                myMax: mySide === 1 ? data.p1Max : data.p2Max,
                oppHp: mySide === 1 ? data.p2Max : data.p1Max,
                oppMax: mySide === 1 ? data.p2Max : data.p1Max,
                isMyTurn: data.turn ? (data.turn === socket.id) : (mySide === 1)
            };
            pendingPvPTarget = null;
            incomingPvPChallenge = null;
            playBGM('battle');
            renderLivePvPScreen();
        });

        socket.on('pvpRoundUpdate', (data) => {
            let b = currentPvPBattle;
            if (!b || data.battleId !== b.battleId) return;
            b.myHp = b.mySide === 1 ? data.p1Hp : data.p2Hp;
            b.oppHp = b.mySide === 1 ? data.p2Hp : data.p1Hp;
            b.isMyTurn = data.turn === socket.id;
            renderLivePvPScreen(data.lastActionLog);
            if (data.isOver) {
                let won = data.winnerId === socket.id;
                setTimeout(() => {
                    clearConsole("center", won ? "radial-gradient(circle,#003300,#000)" : "radial-gradient(circle,#330000,#000)", won ? "#00ff88" : "#ff3333");
                    if (won) game.funds += 1500;
                    saveGame(); updateUI();
                    document.getElementById("console").innerHTML = `
                        <h2 style="font-size:18px;">${won ? '🏆 DUEL WON!' : '💀 DUEL LOST'}</h2>
                        <p style="font-size:12px;">${won ? 'Earned $1500!' : 'Better luck next time, trainer.'}</p>
                    `;
                    renderButtons([{ text: "✔ Return to Lobby", class: "btn btn-start", action: renderActiveLobbyView }]);
                    currentPvPBattle = null;
                }, 1200);
            }
        });
    }
