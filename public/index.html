<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UniDex Legends</title>
  <style>
    :root {
      --bg-color: #050508;
      --border-cyan: #00f3ff;
      --border-gold: #ffb700;
      --border-green: #00ff66;
      --border-pink: #ff00ff;
      --border-red: #ff3344;
      --border-blue: #0088ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow: hidden;
    }

    .crt-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px; z-index: 10; pointer-events: none;
    }

    .hud-bar {
      display: flex; justify-content: space-between;
      border: 1px solid var(--border-cyan); padding: 8px 12px;
      border-radius: 4px; margin-bottom: 8px; font-weight: bold;
      background: #000; color: #fff; z-index: 20;
    }

    .terminal-container {
      flex: 1; border: 2px solid var(--border-gold); border-radius: 8px;
      padding: 12px; background: #000; margin-bottom: 8px;
      overflow-y: auto; z-index: 20; display: flex; flex-direction: column;
    }

    #terminal-log { flex: 1; overflow-y: auto; margin-bottom: 8px; }
    #terminal-log p { margin-bottom: 4px; line-height: 1.3; }

    .scroll-controls { display: flex; gap: 8px; justify-content: flex-end; }
    .scroll-btn { padding: 2px 10px; background: #222; color: #fff; border: 1px solid #555; cursor: pointer; }

    .button-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      z-index: 20; padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 768px) {
      .button-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .btn {
      background: #0a0a12; border: 1px solid #333; color: #fff;
      padding: 10px; font-size: 12px; font-family: inherit; font-weight: bold;
      cursor: pointer; border-radius: 4px; display: flex; align-items: center;
      justify-content: center; gap: 6px; transition: all 0.15s ease;
    }
    .btn:hover { filter: brightness(1.3); }
    .btn:active { transform: scale(0.98); }

    .btn-cyan { border-color: var(--border-cyan); color: var(--border-cyan); }
    .btn-gold { border-color: var(--border-gold); color: var(--border-gold); }
    .btn-green { border-color: var(--border-green); color: var(--border-green); }
    .btn-pink { border-color: var(--border-pink); color: var(--border-pink); }
    .btn-blue { border-color: var(--border-blue); color: var(--border-blue); }
    .btn-red { border-color: var(--border-red); color: var(--border-red); }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 30; align-items: center; justify-content: center;
    }
    .modal-content {
      background: #000; border: 2px solid var(--border-cyan); padding: 20px;
      border-radius: 8px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="crt-overlay"></div>

  <!-- HUD -->
  <div class="hud-bar">
    <span>🌐 Players: <span id="hud-online">1</span></span>
    <span>⚡ Stamina: <span id="hud-stamina">100</span>/100</span>
    <span>💰 Cash: $<span id="hud-cash">100</span></span>
    <span>💎 Gems: <span id="hud-gems">0</span></span>
  </div>

  <!-- Terminal Display -->
  <div class="terminal-container">
    <div id="terminal-log">
      <p>> Initializing UniDex Legends Engine...</p>
      <p>> Select a Save Slot to load or create data.</p>
    </div>
    <div class="scroll-controls">
      <button class="scroll-btn" onclick="scrollTerm(-50)">▲</button>
      <button class="scroll-btn" onclick="scrollTerm(50)">▼</button>
    </div>
  </div>

  <!-- Main Grid Controls -->
  <div class="button-grid">
    <button class="btn btn-cyan" onclick="handleNav('map')">🗺️ World Map</button>
    <button class="btn btn-gold" onclick="handleNav('mines')">⛏️ Stardew Mines</button>
    <button class="btn btn-green" onclick="handleNav('market')">🛍️ Market District</button>
    <button class="btn btn-gold" onclick="handleNav('wheel')">🎰 Lucky Wheel</button>

    <button class="btn btn-cyan" onclick="handleNav('chat')">💬 Global Chat</button>
    <button class="btn btn-blue" onclick="handleNav('inventory')">🎒 Inventory</button>
    <button class="btn btn-cyan" onclick="handleNav('portals')">🌀 Free Portals</button>
    <button class="btn btn-pink" onclick="handleNav('dlc')">🔒 Premium DLC</button>

    <button class="btn btn-cyan" onclick="handleNav('hub')">🌐 Online Hub</button>
    <button class="btn btn-green" onclick="handleNav('sleep')">💤 Sleep</button>
    <button class="btn btn-red" onclick="handleNav('slots')">📁 Switch Slot</button>
    <button class="btn btn-blue" onclick="toggleAudio()">🔊 Audio On/Off</button>
  </div>

  <!-- General Purpose Modal -->
  <div class="modal" id="game-modal">
    <div class="modal-content" id="modal-body"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --- GAME ENGINE STATE ---
    let gameState = {
      slot: 1,
      stamina: 100,
      cash: 100,
      gems: 0,
      staff: 0,
      day: 1,
      unidex: [],
      inventory: { copper: 0, diamond: 0, pokeballs: 5, energyCores: 2 }
    };

    let audioEnabled = true;
    let socket;

    // --- AUDIO SYSTEM ---
    function playSound(file) {
      if (!audioEnabled) return;
      const audio = new Audio(`/music/${file}`);
      audio.play().catch(() => {});
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      logToTerminal(`Audio ${audioEnabled ? 'Enabled' : 'Muted'}`);
    }

    // --- TERMINAL UTILS ---
    function logToTerminal(msg) {
      const log = document.getElementById('terminal-log');
      const p = document.createElement('p');
      p.textContent = `> ${msg}`;
      log.appendChild(p);
      log.parentElement.scrollTop = log.parentElement.scrollHeight;
    }

    function scrollTerm(val) {
      const term = document.getElementById('terminal-log');
      term.scrollTop += val;
    }

    // --- SOCKET NETWORKING ---
    try {
      socket = io();
      socket.on('playerCount', count => {
        document.getElementById('hud-online').textContent = count;
      });
    } catch(e) {
      console.log('Socket offline - running standalone.');
    }

    // --- UPDATE HUD ---
    function updateHUD() {
      document.getElementById('hud-stamina').textContent = gameState.stamina;
      document.getElementById('hud-cash').textContent = gameState.cash;
      document.getElementById('hud-gems').textContent = gameState.gems;
    }

    // --- CORE BUTTON CONTROLLER ---
    function handleNav(action) {
      playSound('click.mp3');

      switch(action) {
        case 'slots': showSaveSlots(); break;
        case 'sleep': triggerRestCycle(); break;
        case 'mines': runMinesAction(); break;
        case 'market': openMarket(); break;
        case 'wheel': spinLuckyWheel(); break;
        case 'inventory': openInventory(); break;
        case 'portals': openPortals(false); break;
        case 'dlc': checkDLCAccess(); break;
        case 'chat': openChatModal(); break;
        case 'hub': openHubModal(); break;
        case 'map': logToTerminal("World Map: Navigating Midnoria Sectors..."); break;
      }
      updateHUD();
    }

    // --- SAVE SLOTS SYSTEM ---
    function showSaveSlots() {
      showModal(`
        <h3>Select Save Slot</h3><br>
        <button class="btn btn-cyan" onclick="loadSlot(1)">Slot 1 (Active)</button><br>
        <button class="btn btn-cyan" onclick="loadSlot(2)">Slot 2</button><br>
        <button class="btn btn-cyan" onclick="loadSlot(3)">Slot 3</button><br>
        <button class="btn btn-red" onclick="closeModal()">Close</button>
      `);
    }

    function loadSlot(id) {
      gameState.slot = id;
      logToTerminal(`Loaded Save Slot #${id}`);
      closeModal();
    }

    // --- STAMINA & REST CYCLE ---
    function triggerRestCycle() {
      gameState.day++;
      gameState.stamina = 100;
      const passiveIncome = gameState.staff * 25;
      gameState.cash += passiveIncome;
      logToTerminal(`Day ${gameState.day} started! Stamina restored to 100. Staff generated $${passiveIncome}.`);
    }

    // --- STARDEW MINES ---
    function runMinesAction() {
      if (gameState.stamina < 10) {
        logToTerminal("Too exhausted to mine! Sleep to restore stamina.");
        return;
      }
      gameState.stamina -= 10;
      const roll = Math.random();
      if (roll > 0.8) {
        gameState.inventory.diamond++;
        logToTerminal("Mines: Found a Rare Diamond! 💎");
      } else if (roll > 0.3) {
        gameState.inventory.copper++;
        logToTerminal("Mines: Mined +1 Copper Ore. ⛏️");
      } else {
        logToTerminal("Mines: Fought off a Cave Monster! (-10 Stamina)");
      }
    }

    // --- MARKET DISTRICT ---
    function openMarket() {
      showModal(`
        <h3>Midnoria Market District</h3><br>
        <p><strong>Doug:</strong> Minerals & Ores</p>
        <button class="btn btn-gold" onclick="sellOre()">Sell All Copper (+$${gameState.inventory.copper * 15})</button><br>
        <p><strong>Don:</strong> General Store</p>
        <button class="btn btn-green" onclick="buyItem('pokeballs', 20)">Buy Pokéball ($20)</button><br>
        <p><strong>Fr3xi0us:</strong> Black Market</p>
        <button class="btn btn-pink" onclick="buyItem('energyCores', 50)">Buy Energy Core ($50)</button><br>
        <button class="btn btn-red" onclick="closeModal()">Exit Market</button>
      `);
    }

    function sellOre() {
      gameState.cash += gameState.inventory.copper * 15;
      gameState.inventory.copper = 0;
      logToTerminal("Doug traded all your copper for cash!");
      closeModal();
      updateHUD();
    }

    function buyItem(item, cost) {
      if (gameState.cash >= cost) {
        gameState.cash -= cost;
        gameState.inventory[item]++;
        logToTerminal(`Bought 1 ${item}!`);
        closeModal();
        updateHUD();
      } else {
        logToTerminal("Not enough cash!");
      }
    }

    // --- LUCKY WHEEL ---
    function spinLuckyWheel() {
      if (gameState.cash < 25) {
        logToTerminal("Spinning costs $25!");
        return;
      }
      gameState.cash -= 25;
      const prizes = ['Cash +$50', 'Gems +5', 'Pokéball +2', 'Stamina +30'];
      const won = prizes[Math.floor(Math.random() * prizes.length)];
      
      if (won.includes('Cash')) gameState.cash += 50;
      if (won.includes('Gems')) gameState.gems += 5;
      if (won.includes('Pokéball')) gameState.inventory.pokeballs += 2;
      if (won.includes('Stamina')) gameState.stamina = Math.min(100, gameState.stamina + 30);

      logToTerminal(`Lucky Wheel landed on: ${won}!`);
    }

    // --- INVENTORY & USABLE ITEMS ---
    function openInventory() {
      showModal(`
        <h3>Backpack & Storage</h3><br>
        <p>Copper Ore: ${gameState.inventory.copper}</p>
        <p>Diamonds: ${gameState.inventory.diamond}</p>
        <p>Pokéballs: ${gameState.inventory.pokeballs}</p>
        <p>Energy Cores: ${gameState.inventory.energyCores}</p><br>
        <button class="btn btn-blue" onclick="useEnergyCore()">Use Energy Core (+50 Stamina)</button><br>
        <button class="btn btn-red" onclick="closeModal()">Close</button>
      `);
    }

    function useEnergyCore() {
      if (gameState.inventory.energyCores > 0) {
        gameState.inventory.energyCores--;
        gameState.stamina = Math.min(100, gameState.stamina + 50);
        logToTerminal("Used Energy Core! +50 Stamina restored.");
        closeModal();
        updateHUD();
      } else {
        logToTerminal("No Energy Cores in inventory!");
      }
    }

    // --- PORTALS & UNIDEX CAPTURE ---
    function openPortals(isDLC) {
      const pools = isDLC ? 
        ['Void Titan Raid', 'High-Tier Sector'] : 
        ['Standard', 'Femboy Hooters', 'Bikini Bottom', 'Halloween', 'Christmas', 'Goth IHOP', 'Maid Café'];
      
      let html = `<h3>${isDLC ? 'Premium DLC Portals' : 'Free Sector Portals'}</h3><br>`;
      pools.forEach(p => {
        html += `<button class="btn btn-cyan" onclick="encounterMonster('${p}')">${p} Portal</button><br>`;
      });
      html += `<button class="btn btn-red" onclick="closeModal()">Close</button>`;
      showModal(html);
    }

    function checkDLCAccess() {
      const pass = prompt("Enter Passcode:");
      if (pass && pass.toUpperCase() === 'MULTIVERSE') {
        openPortals(true);
      } else {
        logToTerminal("Invalid DLC Passcode!");
      }
    }

    function encounterMonster(portalName) {
      closeModal();
      const id = Math.floor(Math.random() * 2000) + 1;
      logToTerminal(`Portal [${portalName}]: Encountered UniDex #${id}! Throwing Pokéball...`);
      
      if (gameState.inventory.pokeballs > 0) {
        gameState.inventory.pokeballs--;
        gameState.unidex.push(id);
        logToTerminal(`Success! UniDex #${id} registered into your collection.`);
      } else {
        logToTerminal("No Pokéballs left! Entity fled.");
      }
    }

    // --- MULTIPLAYER CHAT & LOBBIES ---
    function openChatModal() {
      showModal(`
        <h3>Multiverse Global Chat</h3><br>
        <input type="text" id="chat-msg" style="width:100%; padding:8px; margin-bottom:8px;" placeholder="Type message...">
        <button class="btn btn-green" onclick="sendChat()">Send Message</button><br>
        <button class="btn btn-red" onclick="closeModal()">Close</button>
      `);
    }

    function sendChat() {
      const input = document.getElementById('chat-msg');
      if (input.value && socket) {
        socket.emit('chatMsg', input.value);
        logToTerminal(`Global Chat: ${input.value}`);
        closeModal();
      }
    }

    function openHubModal() {
      showModal(`
        <h3>Online Multiplayer Hub</h3><br>
        <button class="btn btn-gold" onclick="logToTerminal('Joined Void Titan Raid Lobby!')">Co-op Raid Boss Lobby</button><br>
        <button class="btn btn-pink" onclick="logToTerminal('Searching for PvP Duel opponent...')">PvP Duel Arena</button><br>
        <button class="btn btn-red" onclick="closeModal()">Close</button>
      `);
    }

    // --- MODAL HELPERS ---
    function showModal(content) {
      document.getElementById('modal-body').innerHTML = content;
      document.getElementById('game-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('game-modal').style.display = 'none';
    }
  </script>
</body>
</html>
