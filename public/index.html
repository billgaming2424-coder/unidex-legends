<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UniDex Legends</title>
  <style>
    :root {
      --bg-color: #050508;
      --border-cyan: #00f3ff;
      --border-gold: #ffb700;
      --border-green: #00ff66;
      --border-pink: #ff00ff;
      --border-red: #ff3344;
      --border-blue: #0088ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      height: 100dvh; display: flex; flex-direction: column;
      padding: 10px; overflow: hidden;
    }

    /* --- FIXED CSS ANIMATIONS --- */
    @keyframes scanlines {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    .crt-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px; z-index: 10; pointer-events: none;
      animation: scanlines 10s linear infinite; /* Scanline movement */
    }

    .hud-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
      border: 1px solid var(--border-cyan); padding: 8px 12px;
      border-radius: 4px; margin-bottom: 8px; font-weight: bold;
      background: #000; color: #fff; z-index: 20;
    }

    .audio-controls {
      display: flex; align-items: center; gap: 8px;
    }
    .audio-controls input[type="range"] { width: 80px; }

    .terminal-container {
      flex: 1; border: 2px solid var(--border-gold); border-radius: 8px;
      padding: 12px; background: #000; margin-bottom: 8px;
      overflow-y: auto; z-index: 20; display: flex; flex-direction: column;
    }

    #terminal-log { flex: 1; overflow-y: auto; margin-bottom: 8px; }
    #terminal-log p { margin-bottom: 4px; line-height: 1.3; animation: pulse 0.1s ease-in-out; }

    .button-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      z-index: 20; padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 768px) {
      .button-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .btn {
      background: #0a0a12; border: 1px solid #333; color: #fff;
      padding: 10px; font-size: 12px; font-family: inherit; font-weight: bold;
      cursor: pointer; border-radius: 4px; display: flex; align-items: center;
      justify-content: center; gap: 6px; transition: all 0.15s ease;
    }
    .btn:hover { filter: brightness(1.3); }
    .btn:active { transform: scale(0.98); }

    .btn-cyan { border-color: var(--border-cyan); color: var(--border-cyan); }
    .btn-gold { border-color: var(--border-gold); color: var(--border-gold); }
    .btn-green { border-color: var(--border-green); color: var(--border-green); }
    .btn-pink { border-color: var(--border-pink); color: var(--border-pink); }
    .btn-blue { border-color: var(--border-blue); color: var(--border-blue); }
    .btn-red { border-color: var(--border-red); color: var(--border-red); }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 30; align-items: center; justify-content: center;
    }
    .modal-content {
      background: #000; border: 2px solid var(--border-cyan); padding: 20px;
      border-radius: 8px; max-width: 500px; width: 90%; text-align: center;
    }
  </style>
</head>
<body>
  <div class="crt-overlay"></div>

  <!-- HUD with Added Volume Slider -->
  <div class="hud-bar">
    <span>🌐 Online: <span id="hud-online">1</span></span>
    <span>⚡ Stamina: <span id="hud-stamina">100</span>/100</span>
    <span>💰 Cash: $<span id="hud-cash">100</span></span>
    
    <div class="audio-controls">
      <button class="btn btn-blue" style="padding: 4px 8px;" onclick="toggleAudio()">🔊 Toggle</button>
      <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)">
    </div>
  </div>

  <div class="terminal-container">
    <div id="terminal-log">
      <p>> System booting... CRT Scanlines active.</p>
    </div>
  </div>

  <!-- Main Grid Controls with Added Fullscreen Button -->
  <div class="button-grid">
    <button class="btn btn-cyan" onclick="handleNav('map')">🗺️ World Map</button>
    <button class="btn btn-gold" onclick="handleNav('mines')">⛏️ Stardew Mines</button>
    <button class="btn btn-green" onclick="handleNav('market')">🛍️ Market District</button>
    <button class="btn btn-gold" onclick="handleNav('wheel')">🎰 Lucky Wheel</button>

    <button class="btn btn-cyan" onclick="handleNav('chat')">💬 Global Chat</button>
    <button class="btn btn-blue" onclick="handleNav('inventory')">🎒 Inventory</button>
    <button class="btn btn-cyan" onclick="handleNav('portals')">🌀 Free Portals</button>
    <button class="btn btn-pink" onclick="handleNav('dlc')">🔒 Premium DLC</button>

    <button class="btn btn-cyan" onclick="handleNav('hub')">🌐 Online Hub</button>
    <button class="btn btn-green" onclick="handleNav('sleep')">💤 Sleep</button>
    <button class="btn btn-red" onclick="handleNav('slots')">📁 Switch Slot</button>
    <button class="btn btn-blue" onclick="toggleFullscreen()">🔲 Fullscreen</button>
  </div>

  <!-- Modal -->
  <div class="modal" id="game-modal">
    <div class="modal-content" id="modal-body"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --- STATE & AUDIO VARIABLES ---
    let gameState = { stamina: 100, cash: 100, inventory: { copper: 0, pokeballs: 5 } };
    
    let audioEnabled = true;
    let globalVolume = 0.5;
    let currentBGM = new Audio();
    currentBGM.loop = true;

    // --- REPAIRED AUDIO ENGINE & VOLUME SLIDER ---
    function changeVolume(val) {
      globalVolume = val;
      currentBGM.volume = val;
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      if (audioEnabled) {
        currentBGM.play().catch(()=>{});
        logToTerminal("Audio Enabled.");
      } else {
        currentBGM.pause();
        logToTerminal("Audio Muted.");
      }
    }

    // Pass 'isSong' as true to loop it as background music
    function playSound(file, isSong = false) {
      if (!audioEnabled) return;
      
      if (isSong) {
        if (currentBGM.src.includes(file)) return; // Don't restart if already playing
        currentBGM.src = `/music/${file}`;
        currentBGM.volume = globalVolume;
        currentBGM.play().catch(()=>{});
      } else {
        const sfx = new Audio(`/music/${file}`);
        sfx.volume = globalVolume;
        sfx.play().catch(()=>{});
      }
    }

    // --- NEW FULLSCREEN FUNCTION ---
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          logToTerminal(`Fullscreen error: ${err.message}`);
        });
        logToTerminal("Entered Fullscreen Mode.");
      } else {
        document.exitFullscreen();
        logToTerminal("Exited Fullscreen Mode.");
      }
    }

    // --- UTILS ---
    function logToTerminal(msg) {
      const log = document.getElementById('terminal-log');
      const p = document.createElement('p');
      p.textContent = `> ${msg}`;
      log.appendChild(p);
      log.parentElement.scrollTop = log.parentElement.scrollHeight;
    }

    // --- NAVIGATION LOGIC ---
    function handleNav(action) {
      // General UI click sound (assumes you have a general ui sound or we just use default)
      playSound('trade.mp3'); // Using an existing file from your screenshot for UI clicks

      switch(action) {
        case 'market': 
          playSound('doug shop.mp3', true); 
          logToTerminal("Entering Market District...");
          break;
        case 'mines':
          playSound('battle.mp3', true);
          logToTerminal("Entering Stardew Mines!");
          break;
        case 'hub':
          playSound('dlc hub.mp3', true);
          logToTerminal("Connecting to Hub...");
          break;
        case 'sleep':
          playSound('sleep.mp3');
          gameState.stamina = 100;
          document.getElementById('hud-stamina').textContent = '100';
          logToTerminal("Rested up. Stamina restored.");
          break;
        case 'map':
          playSound('intro.mp3', true);
          logToTerminal("Viewing World Map...");
          break;
        default:
          logToTerminal(`Action triggered: ${action}`);
      }
    }
  </script>
</body>
</html>
