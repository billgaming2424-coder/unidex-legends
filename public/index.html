<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UniDex Legends</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            background-color: #030305; color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 6px; width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column; user-select: none; touch-action: manipulation;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
        #stats-bar {
            background: linear-gradient(180deg, #12121c 0%, #08080f 100%);
            border: 1px solid #00ffff55; padding: 4px 8px; margin-bottom: 6px; border-radius: 6px;
            font-size: 11.5px; flex-shrink: 0; display: none; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;
        }
        .stat-highlight { color: #ff00ff; font-weight: bold; }
        .stat-money { color: #ffff00; font-weight: bold; }
        #screen-wrapper { position: relative; flex: 1 1 auto; min-height: 100px; display: flex; width: 100%; margin-bottom: 6px; overflow: hidden; }
        #console {
            flex: 1 1 100%; min-height: 0; background-color: #020204; border: 2px solid #222233;
            padding: 10px; overflow-y: auto; border-radius: 8px; font-size: 13.5px; line-height: 1.4;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #14141e; padding-bottom: 3px; width: 100%; text-align: left; }
        
        #controls {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;
            flex-shrink: 0; width: 100%; max-height: 48vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px;
        }
        @media (min-width: 650px) { #controls { grid-template-columns: repeat(4, 1fr); max-height: 250px; } }
        
        .btn {
            background: #12121c; color: #00ff66; border: 1px solid #00ff6666; padding: 10px 6px;
            font-family: 'Courier New'; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; text-align: center; min-height: 40px; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover { background: #1c1c2e; outline: 2px solid #00ffff; }
        .btn-sys { border-color: #00ffff; color: #00ffff; }
        .btn-dlc { border-color: #ff00ff; color: #ff00ff; background: #220022; }
        .btn-back { border-color: #ff3333; color: #ff3333; background: #2b0011; }
        .btn-farm { border-color: #00ff88; color: #00ff88; background: #001f0c; }
        .btn-gear { border-color: #33ccff; color: #33ccff; background: #001122; }
        .btn-map { border-color: #00ffcc; color: #00ffcc; background: #002222; }
        .btn-mine { border-color: #ffaa00; color: #ffaa00; background: #221500; }
        .btn-combat { border-color: #ff0033; color: #ff0033; background: #33000a; }
        .btn-spin { border-color: #ffff00; color: #ffff00; background: #333300; }
        .btn-maid { border-color: #ff66ff; color: #ff66ff; background: #220022; }
        .dex-card { background: #08080f; border: 1px solid #222238; border-radius: 6px; padding: 8px; margin: 4px 0; width: 98%; text-align: left; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div id="save-toast" style="position:fixed; bottom:20px; right:20px; background:#002211; border:1px solid #00ff66; color:#00ff66; padding:6px 12px; border-radius:4px; font-size:12px; z-index:9999; display:none;">💾 Game Saved</div>
    <div id="stats-bar">
        <div>🌍 <span id="loc-display">Nexus HQ</span> | Trainer: <span class="stat-highlight" id="player-name-display">Trainer</span></div>
        <div style="display: flex; align-items: center; gap: 6px;">
            <span onclick="showLivePlayersModal()" style="cursor: pointer; color: #00ff88; background: #002211; border: 1px solid #00ff88; padding: 2px 6px; border-radius: 4px; font-weight: bold;" title="Click to view online players">
                🟢 Online: <span id="global-online-count">1</span>
            </span>
            <span onclick="showLeaderboardModal()" style="cursor: pointer; color: #ffff00; background: #222200; border: 1px solid #ffff00; padding: 2px 6px; border-radius: 4px; font-weight: bold;" title="Click to view Leaderboard">
                🏆 Top Rank
            </span>
            ⭐ Champion: <span id="active-champ-display" style="color:#00ffff; font-weight:bold;">Astolfo</span> |
            💰 $<span class="stat-money" id="funds-display">5000</span> | Day <span id="day-display">1</span> | ⚡ <span id="stamina-display">100</span>
        </div>
    </div>
    
    <div id="screen-wrapper">
        <div id="console"></div>
    </div>

    <div id="controls"></div>

<script>
    let socket = null;
    try { socket = io({ transports: ['websocket', 'polling'] }); } catch(e) {}

    let globalActiveTrainers = [];
    let globalLeaderboard = [];
    let globalChatMessages = [];
    let roomChatMessages = [];
    let currentSaveSlot = 1;
    let currentRoomId = null;
    let onlineRoomPlayers = [];
    let activePvPSession = null;
    let singlePlayerCombatSession = null;

    let game = {
        playerName: "Trainer", funds: 5000, stamina: 100, day: 1, location: "Nexus HQ",
        activeChampionIndex: 0,
        inventory: ["Energy Core", "Pokéball", "Copper Ore", "Diamond", "Healing Potion"],
        staff: [
            { name: "Astolfo", origin: "Fate", power: 30, maxHp: 120, hp: 120 },
            { name: "Felix Argyle", origin: "Re:Zero", power: 28, maxHp: 110, hp: 110 }
        ],
        pokedex: {}, dlcUnlocked: false
    };

    function getActiveChampion() {
        if (!game.staff || game.staff.length === 0) {
            game.staff = [{ name: "Starter Partner", origin: "Midnoria", power: 25, maxHp: 100, hp: 100 }];
        }
        if (game.activeChampionIndex >= game.staff.length) game.activeChampionIndex = 0;
        return game.staff[game.activeChampionIndex];
    }

    function getSaveKey(slot) { return `unidexSave_slot_${slot}`; }
    function saveGame() {
        localStorage.setItem(getSaveKey(currentSaveSlot), JSON.stringify(game));
        syncTrainerPresence();
        showSaveToast();
    }

    function showSaveToast() {
        let toast = document.getElementById("save-toast");
        if (toast) { toast.style.display = "block"; setTimeout(() => { toast.style.display = "none"; }, 2000); }
    }

    function syncTrainerPresence() {
        if (socket && socket.connected) {
            const champ = getActiveChampion();
            socket.emit('registerTrainerPresence', {
                playerName: game.playerName || "Trainer",
                location: game.location || "Nexus HQ",
                funds: game.funds || 0,
                champion: champ.name,
                power: champ.power || 25
            });
            if (currentRoomId) {
                socket.emit('joinRoom', {
                    roomId: currentRoomId,
                    player: { name: game.playerName, location: game.location, champion: champ.name, power: champ.power }
                });
            }
        }
    }

    if (socket) {
        socket.on('globalOnlineUpdate', (data) => {
            const countEl = document.getElementById("global-online-count");
            if (countEl) countEl.innerText = data.totalOnline;
            globalActiveTrainers = data.activePlayers || [];
            globalLeaderboard = data.leaderboard || [];
        });

        socket.on('chatHistory', (history) => { globalChatMessages = history || []; });
        socket.on('receiveGlobalMessage', (msg) => {
            globalChatMessages.push(msg);
            if (globalChatMessages.length > 50) globalChatMessages.shift();
            refreshChatBoxes();
        });

        socket.on('receiveRoomMessage', (msg) => {
            roomChatMessages.push(msg);
            refreshChatBoxes();
        });

        socket.on('assignedRandomRoom', (assignedRoom) => {
            currentRoomId = assignedRoom;
            const champ = getActiveChampion();
            socket.emit('joinRoom', {
                roomId: currentRoomId,
                player: { name: game.playerName, location: game.location, champion: champ.name, power: champ.power }
            });
            renderActiveLobbyView();
        });

        socket.on('roomUpdate', ({ roomId, players }) => {
            onlineRoomPlayers = players || [];
            if (currentRoomId === roomId) renderActiveLobbyView();
        });

        // Item Trade Listener
        socket.on('receiveTradeOffer', ({ senderId, senderName, item }) => {
            if (confirm(`🤝 [ITEM TRADE OFFER]: ${senderName} offered 1x [${item}]! Trade an item back?`)) {
                let tradeItem = prompt(`Enter item name from bag to give ${senderName}:\nAvailable: ${game.inventory.join(', ')}`, game.inventory[0] || "Copper Ore");
                if (tradeItem && game.inventory.includes(tradeItem)) {
                    let idx = game.inventory.indexOf(tradeItem);
                    game.inventory.splice(idx, 1);
                    game.inventory.push(item);
                    saveGame(); updateUI();
                    socket.emit('acceptTradeOffer', { targetId: senderId, targetItem: item, myItem: tradeItem, senderName: game.playerName });
                    alert(`✅ Item Trade Completed! Sent [${tradeItem}] and got [${item}]!`);
                } else {
                    alert("❌ Trade cancelled or item not found!");
                }
            }
        });

        socket.on('tradeCompleted', ({ receivedItem, partnerName }) => {
            game.inventory.push(receivedItem);
            saveGame(); updateUI();
            alert(`🎉 Trade Success! Received item [${receivedItem}] from ${partnerName}!`);
            showInventoryMenu();
        });

        // Character / Companion Trade Listener
        socket.on('receiveCharacterTradeOffer', ({ senderId, senderName, character }) => {
            if (confirm(`🎭 [CHARACTER TRADE OFFER]: ${senderName} offered companion [${character.name} (Origin: ${character.origin})]! Trade one of your characters back?`)) {
                if (game.staff.length <= 1) {
                    alert("❌ You cannot trade your only companion! Recruit more from Portals first.");
                    return;
                }
                let charNames = game.staff.map((c, i) => `${i + 1}. ${c.name}`).join('\n');
                let selection = prompt(`Enter the number of the character you want to send to ${senderName}:\n${charNames}`);
                let selectIdx = parseInt(selection) - 1;

                if (!isNaN(selectIdx) && game.staff[selectIdx]) {
                    let mySentChar = game.staff.splice(selectIdx, 1)[0];
                    game.staff.push(character);
                    if (game.activeChampionIndex >= game.staff.length) game.activeChampionIndex = 0;
                    saveGame(); updateUI();
                    socket.emit('acceptCharacterTradeOffer', { targetId: senderId, targetCharacter: character, myCharacter: mySentChar, senderName: game.playerName });
                    alert(`🎉 Character Trade Completed! Sent [${mySentChar.name}] and received [${character.name}]!`);
                    showChampionSelectMenu();
                } else {
                    alert("❌ Invalid character selection. Trade cancelled.");
                }
            }
        });

        socket.on('characterTradeCompleted', ({ receivedCharacter, partnerName }) => {
            game.staff.push(receivedCharacter);
            saveGame(); updateUI();
            alert(`🎉 Character Trade Success! Recruited [${receivedCharacter.name}] from ${partnerName}!`);
            showChampionSelectMenu();
        });

        socket.on('pvpChallengeReceived', ({ challengerId, challengerName, champion }) => {
            if (confirm(`⚔️ [LIVE PVP CHALLENGE]: Trainer ${challengerName} with champion [${champion}] challenged you to a duel! Accept?`)) {
                const myChamp = getActiveChampion();
                socket.emit('acceptPvP', { challengerId, accepterName: game.playerName, champion: myChamp.name });
            }
        });

        socket.on('startLivePvP', (data) => {
            activePvPSession = {
                battleId: data.battleId,
                p1Id: data.p1Id,
                p2Id: data.p2Id,
                turn: data.p1Id,
                p1Hp: data.p1Max,
                p2Hp: data.p2Max,
                p1Max: data.p1Max,
                p2Max: data.p2Max,
                log: "⚔️ Live match started! Make your move!"
            };
            renderLivePvPScreen();
        });

        socket.on('pvpRoundUpdate', (data) => {
            if (!activePvPSession) return;
            activePvPSession.turn = data.turn;
            activePvPSession.p1Hp = data.p1Hp;
            activePvPSession.p2Hp = data.p2Hp;
            activePvPSession.log = data.lastActionLog;

            if (data.isOver) {
                if (socket.id === data.winnerId) {
                    game.funds += 1000;
                    saveGame(); updateUI();
                    alert("🏆 VICTORY! You won the live PvP duel and claimed $1000!");
                } else {
                    alert("💀 DEFEAT! Your champion was knocked out in the duel!");
                }
                activePvPSession = null;
                renderActiveLobbyView();
            } else {
                renderLivePvPScreen();
            }
        });
    }

    function refreshChatBoxes() {
        let globalBox = document.getElementById("global-chat-box");
        if (globalBox) {
            globalBox.innerHTML = globalChatMessages.map(m => `<div style="margin-bottom:3px;"><span style="color:#00ffff;">[${m.time}]</span> <strong>${m.name}:</strong> ${m.text}</div>`).join('');
            globalBox.scrollTop = globalBox.scrollHeight;
        }
        let roomBox = document.getElementById("room-chat-box");
        if (roomBox) {
            roomBox.innerHTML = roomChatMessages.map(m => `<div style="margin-bottom:3px;"><span style="color:#ffaa00;">[${m.time}]</span> <strong>${m.name}:</strong> ${m.text}</div>`).join('');
            roomBox.scrollTop = roomBox.scrollHeight;
        }
    }

    function clearConsole(align="flex-start", bgGradient="#15002b", borderColor="#00ffff") {
        const consoleDiv = document.getElementById("console");
        consoleDiv.innerHTML = "";
        consoleDiv.style.justifyContent = align;
        consoleDiv.style.background = bgGradient;
        consoleDiv.style.borderColor = borderColor;
        consoleDiv.scrollTop = 0;
    }

    function log(msg, colorClass="") {
        const consoleDiv = document.getElementById("console");
        consoleDiv.innerHTML += `<div class="log-entry ${colorClass}">${msg}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function renderButtons(buttons) {
        const controls = document.getElementById("controls");
        controls.innerHTML = "";
        buttons.forEach((b) => {
            let btn = document.createElement("button");
            btn.className = (b.class || "btn");
            btn.innerText = b.text;
            btn.onclick = b.action;
            controls.appendChild(btn);
        });
    }

    function updateUI() {
        document.getElementById("funds-display").innerText = Math.floor(game.funds || 0);
        document.getElementById("stamina-display").innerText = game.stamina || 0;
        document.getElementById("day-display").innerText = game.day || 1;
        document.getElementById("player-name-display").innerText = game.playerName || "Trainer";
        document.getElementById("loc-display").innerText = game.location || "Nexus HQ";
        const champ = getActiveChampion();
        document.getElementById("active-champ-display").innerText = champ.name;
        syncTrainerPresence();
    }

    function showIntroScreen() {
        clearConsole("center", "#050014", "#00ffff");
        document.getElementById("stats-bar").style.display = "none";
        let slotButtons = [];
        for (let i = 1; i <= 3; i++) {
            let rawData = localStorage.getItem(getSaveKey(i));
            let label = `Slot ${i}: Empty (New Game)`;
            let hasData = false;
            if (rawData) {
                try {
                    let parsed = JSON.parse(rawData);
                    if (parsed && parsed.playerName) {
                        label = `▶ Slot ${i}: ${parsed.playerName} (Day ${parsed.day || 1}) - $${Math.floor(parsed.funds || 0)}`;
                        hasData = true;
                    }
                } catch(e) {}
            }
            slotButtons.push({ text: label, class: hasData ? "btn btn-dlc" : "btn btn-sys", action: () => selectSaveSlot(i, hasData) });
        }
        document.getElementById("console").innerHTML = `<h1 style="color: #00ffff; font-size: 24px;">UNIDEX LEGENDS</h1><p style="color: #ffff00; font-size: 12px;">Select Save Slot:</p>`;
        renderButtons(slotButtons);
    }

    function selectSaveSlot(slotNum, hasData) {
        currentSaveSlot = slotNum;
        if (hasData) {
            try { game = JSON.parse(localStorage.getItem(getSaveKey(slotNum))); } catch (err) {}
        } else {
            game = {
                playerName: "Trainer", funds: 5000, stamina: 100, day: 1, location: "Nexus HQ",
                activeChampionIndex: 0,
                inventory: ["Energy Core", "Pokéball", "Copper Ore", "Diamond"],
                staff: [{ name: "Astolfo", origin: "Fate", power: 30, maxHp: 120, hp: 120 }],
                pokedex: {}, dlcUnlocked: false
            };
            saveGame();
        }
        showMainMenu();
    }

    function showLivePlayersModal() {
        clearConsole("center", "#001f3f", "#00ffff");
        let html = `
            <h2 style="color: #00ffff; font-size: 16px;">🌐 ACTIVE MULTIVERSE TRAINERS</h2>
            <p style="color: #aaa; font-size: 12px;">Total Connected Online: <strong>${globalActiveTrainers.length}</strong></p>
            <div style="width: 95%; max-width: 360px; max-height: 160px; overflow-y: auto; margin-bottom: 8px;">
        `;
        globalActiveTrainers.forEach(t => {
            html += `
                <div class="dex-card" style="font-size: 12px; padding: 6px; display:flex; justify-content:space-between;">
                    <span>👤 <strong>${t.name}</strong> (${t.champion || 'Partner'})</span>
                    <span style="color:#ffaa00;">📍 ${t.location}</span>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function showLeaderboardModal() {
        clearConsole("center", "#1a1500", "#ffff00");
        let html = `
            <h2 style="color: #ffff00; font-size: 16px;">🏆 GLOBAL TRAINER LEADERBOARD</h2>
            <p style="color: #aaa; font-size: 12px;">Ranked by Wealth & Champion Power:</p>
            <div style="width: 95%; max-width: 380px; max-height: 160px; overflow-y: auto; margin-bottom: 8px;">
        `;
        if (!globalLeaderboard.length) {
            html += `<p style="color:#aaa;">No online data yet.</p>`;
        } else {
            globalLeaderboard.forEach((user, idx) => {
                let badge = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx + 1}`;
                html += `
                    <div class="dex-card" style="font-size: 12px; padding: 6px; display:flex; justify-content:space-between; border-color:#ffff0055;">
                        <span><strong>${badge} ${user.name}</strong> (⭐ ${user.champion || 'Partner'})</span>
                        <span style="color:#00ff66;">💰 $${Math.floor(user.funds || 0)}</span>
                    </div>
                `;
            });
        }
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function showChampionSelectMenu() {
        clearConsole("flex-start", "#100028", "#ff00ff");
        let html = `
            <h2 style="color:#ff66ff; font-size:16px;">⭐ COMPANIONS & ACTIVE CHAMPION</h2>
            <p style="color:#aaa; font-size:11.5px;">Designate who fights for you in battles, PvP duels, and multiplayer rooms:</p>
            <div style="width:100%; max-width:380px;">
        `;
        game.staff.forEach((member, idx) => {
            let isActive = idx === game.activeChampionIndex;
            html += `
                <div class="dex-card" style="display:flex; justify-content:space-between; align-items:center; border-color:${isActive ? '#00ffff' : '#333'}; background:${isActive ? '#001a22' : '#08080f'};">
                    <div>
                        <strong style="color:${isActive ? '#00ffff' : '#fff'};">${member.name}</strong> ${isActive ? '<span style="color:#00ff66;">[ACTIVE]</span>' : ''}<br>
                        <span style="color:#aaa; font-size:11px;">Origin: ${member.origin || 'Multiverse'} | ⚡ Power: ${member.power || 25}</span>
                    </div>
                    ${!isActive ? `<button class="btn btn-sys" style="padding:4px 8px; font-size:10px; min-height:28px;" onclick="setActiveChampion(${idx})">Set Active</button>` : ''}
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function setActiveChampion(idx) {
        game.activeChampionIndex = idx;
        saveGame(); updateUI();
        alert(`⭐ Active Champion switched to ${game.staff[idx].name}!`);
        showChampionSelectMenu();
    }

    function showOnlineHubMenu() {
        clearConsole("center", "#003366", "#00aaff");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#00ffff; font-size:16px;">🌐 ONLINE MULTIPLAYER HUB</h2>
            <p style="color:#aaa; font-size:11.5px;">Connect with friends to trade items/characters, duel in live PvP, or chat in private rooms!</p>
            <div style="margin: 8px 0;">
                <input type="text" id="room-code-input" value="${currentRoomId || 'MIDNORIA'}" style="background:#111; color:#0ff; border:1px solid #0ff; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px; text-align:center; width:160px;" />
            </div>
        `;
        renderButtons([
            { text: "🚪 Join / Create Room", class: "btn btn-sys", action: () => {
                currentRoomId = document.getElementById("room-code-input").value.trim().toUpperCase() || "MIDNORIA";
                const champ = getActiveChampion();
                if (socket) socket.emit('joinRoom', { roomId: currentRoomId, player: { name: game.playerName, location: game.location, champion: champ.name, power: champ.power } });
                renderActiveLobbyView();
            }},
            { text: "🎲 Join Random Room", class: "btn btn-dlc", action: () => {
                const champ = getActiveChampion();
                if (socket) socket.emit('joinRandomRoom', { player: { name: game.playerName, location: game.location, champion: champ.name, power: champ.power } });
            }},
            { text: "🏆 Leaderboard", class: "btn btn-spin", action: showLeaderboardModal },
            { text: "💬 Global Chat", class: "btn btn-sys", action: showGlobalChatScreen },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function renderActiveLobbyView() {
        clearConsole("flex-start", "#002244", "#00aaff");
        let html = `
            <h2 style="color:#00ffff; font-size:16px; margin-bottom:2px;">📡 ROOM: ${currentRoomId}</h2>
            <p style="color:#aaa; font-size:11px; margin-top:2px;">Connected Trainers: ${onlineRoomPlayers.length || 1}</p>
            <div style="width:100%; max-width:380px; max-height:140px; overflow-y:auto; margin-bottom:6px;">
        `;
        if (!onlineRoomPlayers.length) {
            html += `<div class="dex-card" style="font-size:12px; padding:6px;">👤 ${game.playerName} (You) - Host</div>`;
        } else {
            onlineRoomPlayers.forEach(p => {
                let isMe = p.id === socket.id || p.name === game.playerName;
                html += `
                    <div class="dex-card" style="font-size:12px; padding:6px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>👤 ${p.name}</strong> ${isMe ? '<span style="color:#ffaa00;">(You)</span>' : ''}<br>
                            <span style="color:#00ffff; font-size:10.5px;">⭐ Champ: ${p.champion || 'Partner'}</span>
                        </div>
                        ${!isMe ? `
                            <div style="display:flex; flex-direction:column; gap:3px;">
                                <button class="btn btn-combat" style="padding:2px 4px; font-size:9.5px; min-height:20px;" onclick="sendPvPRequest('${p.id}', '${p.name}')">⚔️ Duel</button>
                                <button class="btn btn-mine" style="padding:2px 4px; font-size:9.5px; min-height:20px;" onclick="initiateItemTrade('${p.id}', '${p.name}')">📦 Trade Item</button>
                                <button class="btn btn-maid" style="padding:2px 4px; font-size:9.5px; min-height:20px;" onclick="initiateCharacterTrade('${p.id}', '${p.name}')">🎭 Trade Hero</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([
            { text: "💬 Room Chat", class: "btn btn-sys", action: showRoomChatScreen },
            { text: "⭐ Set Champion", class: "btn btn-maid", action: showChampionSelectMenu },
            { text: "🚪 Leave Room", class: "btn btn-back", action: showOnlineHubMenu }
        ]);
    }

    function sendPvPRequest(targetId, targetName) {
        const champ = getActiveChampion();
        if (socket) {
            socket.emit('requestPvP', { roomId: currentRoomId, targetId, challengerName: game.playerName, champion: champ.name });
            alert(`⚔️ PvP challenge sent to ${targetName}! Waiting for response...`);
        }
    }

    function initiateItemTrade(targetId, targetName) {
        let itemToTrade = prompt(`Select an item from your bag to offer to ${targetName}:\nAvailable: ${game.inventory.join(', ')}`, game.inventory[0]);
        if (itemToTrade && game.inventory.includes(itemToTrade)) {
            let idx = game.inventory.indexOf(itemToTrade);
            game.inventory.splice(idx, 1);
            saveGame(); updateUI();
            if (socket) {
                socket.emit('offerTradeItem', { roomId: currentRoomId, targetId, item: itemToTrade, senderName: game.playerName });
                alert(`🤝 Offered 1x [${itemToTrade}] to ${targetName}!`);
            }
        } else {
            alert("❌ Invalid item or item not in backpack!");
        }
    }

    function initiateCharacterTrade(targetId, targetName) {
        if (game.staff.length <= 1) {
            alert("❌ You only have 1 companion! Recruit more characters from Portals before trading.");
            return;
        }
        let listStr = game.staff.map((c, i) => `${i + 1}. ${c.name} (${c.origin})`).join('\n');
        let sel = prompt(`Select the number of the character you want to trade with ${targetName}:\n${listStr}`);
        let idx = parseInt(sel) - 1;

        if (!isNaN(idx) && game.staff[idx]) {
            let chosenChar = game.staff.splice(idx, 1)[0];
            if (game.activeChampionIndex >= game.staff.length) game.activeChampionIndex = 0;
            saveGame(); updateUI();
            if (socket) {
                socket.emit('offerTradeCharacter', { roomId: currentRoomId, targetId, character: chosenChar, senderName: game.playerName });
                alert(`🎭 Offered [${chosenChar.name}] to ${targetName}! Waiting for their response...`);
            }
        } else {
            alert("❌ Invalid selection or cancelled.");
        }
    }

    function renderLivePvPScreen() {
        const s = activePvPSession;
        if (!s) return;
        clearConsole("center", "#2b000f", "#ff0055");
        const isMyTurn = socket.id === s.turn;
        const champ = getActiveChampion();

        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0055; font-size:16px;">⚔️ LIVE MULTIPLAYER DUEL</h2>
            <div style="display:flex; justify-content:space-around; width:100%; margin: 6px 0;">
                <div class="dex-card" style="width:48%; display:block; border-color:#00ff66; text-align:center;">
                    <strong style="color:#00ffff;">${champ.name} (You)</strong><br>
                    ❤️ HP: <span style="color:#33ff33;">${socket.id === s.p1Id ? s.p1Hp : s.p2Hp} / 120</span>
                </div>
                <div class="dex-card" style="width:48%; display:block; border-color:#ff0055; text-align:center;">
                    <strong style="color:#ff0055;">Opponent</strong><br>
                    ❤️ HP: <span style="color:#ff3333;">${socket.id === s.p1Id ? s.p2Hp : s.p1Hp} / 120</span>
                </div>
            </div>
            <p style="color:#ffff00; font-size:12px;">${s.log}</p>
            <p style="color:${isMyTurn ? '#00ff88' : '#aaa'}; font-weight:bold; font-size:12px;">${isMyTurn ? '▶ YOUR TURN! Choose an action:' : '⏳ Opponent is deciding their move...'}</p>
        `;

        if (isMyTurn) {
            renderButtons([
                { text: "⚔️ Strike", class: "btn btn-combat", action: () => executePvPAction("strike") },
                { text: "🛡️ Guard (-50% DMG)", class: "btn btn-sys", action: () => executePvPAction("guard") },
                { text: "⚡ Special Attack (15 Stm)", class: "btn btn-dlc", action: () => executePvPAction("special") }
            ]);
        } else {
            renderButtons([]);
        }
    }

    function executePvPAction(actionType) {
        if (!activePvPSession) return;
        if (actionType === "special") {
            if (game.stamina < 15) { alert("❌ Not enough stamina for special move!"); return; }
            game.stamina -= 15;
            saveGame(); updateUI();
        }
        const champ = getActiveChampion();
        if (socket) {
            socket.emit('executeLivePvPAction', {
                battleId: activePvPSession.battleId,
                actionType: actionType,
                power: champ.power || 25,
                championName: champ.name
            });
        }
    }

    function startSinglePlayerCombat(mobName, mobHp, mobDmg, reward) {
        const champ = getActiveChampion();
        singlePlayerCombatSession = {
            enemyName: mobName,
            enemyHp: mobHp,
            enemyMaxHp: mobHp,
            enemyDmg: mobDmg,
            reward: reward,
            champHp: champ.maxHp || 100,
            champMaxHp: champ.maxHp || 100,
            guarding: false,
            log: `Battle started against ${mobName}!`
        };
        renderSinglePlayerCombat();
    }

    function renderSinglePlayerCombat() {
        const c = singlePlayerCombatSession;
        const champ = getActiveChampion();
        clearConsole("center", "#20000a", "#ff0033");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0033; font-size:16px;">⚔️ BATTLE vs ${c.enemyName.toUpperCase()}</h2>
            <div style="display:flex; justify-content:space-around; width:100%; margin: 6px 0;">
                <div class="dex-card" style="width:48%; display:block; border-color:#00ff66; text-align:center;">
                    <strong style="color:#00ffff;">${champ.name}</strong><br>
                    ❤️ <span style="color:#33ff33;">${c.champHp} / ${c.champMaxHp}</span>
                </div>
                <div class="dex-card" style="width:48%; display:block; border-color:#ff0055; text-align:center;">
                    <strong style="color:#ff0055;">${c.enemyName}</strong><br>
                    ❤️ <span style="color:#ff3333;">${c.enemyHp} / ${c.enemyMaxHp}</span>
                </div>
            </div>
            <p style="color:#ffff00; font-size:12px;">${c.log}</p>
        `;
        renderButtons([
            { text: "⚔️ Strike", class: "btn btn-combat", action: () => executeSinglePlayerAction("strike") },
            { text: "🛡️ Guard", class: "btn btn-sys", action: () => executeSinglePlayerAction("guard") },
            { text: "⚡ Special (10 Stm)", class: "btn btn-dlc", action: () => executeSinglePlayerAction("special") },
            { text: "🏃 Flee", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function executeSinglePlayerAction(type) {
        const c = singlePlayerCombatSession;
        const champ = getActiveChampion();
        if (type === "special") {
            if (game.stamina < 10) { alert("Not enough stamina!"); return; }
            game.stamina -= 10;
            saveGame(); updateUI();
        }

        if (type === "guard") {
            c.guarding = true;
            c.log = `${champ.name} prepares to block incoming damage!`;
        } else {
            let mult = type === "special" ? 1.8 : 1.0;
            let dmg = Math.floor((champ.power || 25) * mult + Math.random() * 8);
            c.enemyHp = Math.max(0, c.enemyHp - dmg);
            c.log = `${champ.name} hit ${c.enemyName} for ${dmg} damage!`;
        }

        if (c.enemyHp <= 0) {
            game.funds += c.reward;
            saveGame(); updateUI();
            alert(`🎉 Won battle! Earned $${c.reward}!`);
            showMainMenu();
            return;
        }

        setTimeout(() => {
            let enemyHit = c.enemyDmg;
            if (c.guarding) { enemyHit = Math.floor(enemyHit * 0.5); c.guarding = false; }
            c.champHp = Math.max(0, c.champHp - enemyHit);
            c.log += ` ${c.enemyName} retaliated for ${enemyHit} damage!`;
            if (c.champHp <= 0) {
                alert("💀 Champion was knocked out! Returning to HQ...");
                showMainMenu();
            } else {
                renderSinglePlayerCombat();
            }
        }, 600);
    }

    function showGlobalChatScreen() {
        clearConsole("flex-start", "#001a22", "#00ffff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #00ffff; font-size: 15px; margin: 4px 0;">💬 GLOBAL MULTIVERSE CHAT</h2>
            <div id="global-chat-box" style="width:100%; max-width:400px; height:130px; background:#05050a; border:1px solid #00ffff55; border-radius:4px; padding:8px; overflow-y:auto; font-size:12px; margin-bottom:8px;"></div>
            <div style="display:flex; gap:6px; width:100%; max-width:400px;">
                <input type="text" id="chat-input-text" placeholder="Type a message..." style="flex:1; background:#111; color:#0f0; border:1px solid #0ff; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px;" />
                <button class="btn btn-sys" style="padding:6px 12px;" onclick="sendGlobalChatMsg()">Send</button>
            </div>
        `;
        refreshChatBoxes();
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function sendGlobalChatMsg() {
        let input = document.getElementById("chat-input-text");
        if (!input || !input.value.trim()) return;
        if (socket && socket.connected) {
            socket.emit('sendGlobalMessage', { name: game.playerName || "Trainer", text: input.value.trim() });
        }
        input.value = "";
    }

    function showRoomChatScreen() {
        clearConsole("flex-start", "#002022", "#ffaa00");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ffaa00; font-size: 15px; margin: 4px 0;">💬 ROOM CHAT [${currentRoomId}]</h2>
            <div id="room-chat-box" style="width:100%; max-width:400px; height:130px; background:#05050a; border:1px solid #ffaa0055; border-radius:4px; padding:8px; overflow-y:auto; font-size:12px; margin-bottom:8px;"></div>
            <div style="display:flex; gap:6px; width:100%; max-width:400px;">
                <input type="text" id="room-chat-input" placeholder="Room message..." style="flex:1; background:#111; color:#ffaa00; border:1px solid #ffaa00; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px;" />
                <button class="btn btn-mine" style="padding:6px 12px;" onclick="sendRoomChatMsg()">Send</button>
            </div>
        `;
        refreshChatBoxes();
        renderButtons([{ text: "⬅ Back to Lobby", class: "btn btn-back", action: renderActiveLobbyView }]);
    }

    function sendRoomChatMsg() {
        let input = document.getElementById("room-chat-input");
        if (!input || !input.value.trim()) return;
        if (socket && socket.connected) {
            socket.emit('sendRoomMessage', { roomId: currentRoomId, name: game.playerName || "Trainer", text: input.value.trim() });
        }
        input.value = "";
    }

    function showInventoryMenu() {
        clearConsole("flex-start", "#1a0f00", "#33ccff");
        let html = `<h2 style="color: #33ccff; font-size:16px;">🎒 INVENTORY & ITEMS</h2><p style="font-size:11px; color:#aaa;">Click usable items to consume them:</p>`;
        game.inventory.forEach((item, idx) => {
            let useBtn = item === "Energy Core" ? `<button class="btn btn-sys" style="padding:2px 6px; font-size:10px; min-height:24px;" onclick="useEnergyCore(${idx})">Use (+50 Stm)</button>` : '';
            html += `<div class="dex-card" style="font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                <span>📦 ${item}</span>
                ${useBtn}
            </div>`;
        });
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function useEnergyCore(idx) {
        if (game.inventory[idx] === "Energy Core") {
            game.inventory.splice(idx, 1);
            game.stamina += 50;
            saveGame(); updateUI();
            log("⚡ Energy Core activated! Gained +50 Stamina!", "color-cyan");
            showInventoryMenu();
        }
    }

    function showMarketMenu() {
        clearConsole("flex-start", "#3d1c00", "#ff8c00");
        document.getElementById("console").innerHTML = `<h2 style="color: #ffaa00; font-size:16px;">🏪 MARKET DISTRICT</h2><p style="color: #aaa; font-size:11.5px;">Trade ores and buy utilities.</p>`;
        renderButtons([
            { text: "💰 Doug's Ores", class: "btn btn-mine", action: () => { game.funds += 300; game.inventory.push("Copper Ore"); saveGame(); updateUI(); alert("Sold ores to Doug for $300!"); showMarketMenu(); } },
            { text: "🛍️ Don's Store", class: "btn btn-farm", action: () => { if(game.funds >= 150) { game.funds -= 150; game.inventory.push("Healing Potion"); saveGame(); updateUI(); alert("Bought Healing Potion!"); } else { alert("Not enough funds!"); } showMarketMenu(); } },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showLuckyWheelScreen() {
        clearConsole("center", "#333300", "#ffff00");
        document.getElementById("console").innerHTML = `<div style="font-size: 36px; margin-bottom: 4px;">🎡</div><h2 style="color: #ffff00; font-size:16px;">🎰 LUCKY WHEEL</h2><p style="color: #aaa; font-size:11.5px;">Spin for rewards! (Cost: $100)</p>`;
        renderButtons([
            { text: "🔄 Spin ($100)", class: "btn btn-spin", action: () => {
                if (game.funds >= 100) {
                    game.funds -= 100;
                    if (Math.random() > 0.5) { game.funds += 400; alert("Jackpot! Won $400!"); }
                    else { game.inventory.push("Diamond"); alert("Won a rare Diamond!"); }
                    saveGame(); updateUI(); showLuckyWheelScreen();
                } else { alert("Not enough funds to spin!"); }
            }},
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showFreePortalsMenu() {
        clearConsole("center", "#4d004d", "#ff00ff");
        document.getElementById("console").innerHTML = `<h2 style="color: #ff00ff; font-size:16px;">🌌 FREE PORTALS</h2><p style="color: #aaa; font-size:11.5px;">Open dimensions to recruit characters!</p>`;
        renderButtons([
            { text: "🎀 Astolfo Portal", class: "btn btn-maid", action: () => { game.staff.push({ name: "Astolfo", origin: "Fate", power: 30, maxHp: 120, hp: 120 }); saveGame(); alert("Recruited Astolfo!"); showMainMenu(); } },
            { text: "🖤 Felix Portal", class: "btn btn-maid", action: () => { game.staff.push({ name: "Felix Argyle", origin: "Re:Zero", power: 28, maxHp: 110, hp: 110 }); saveGame(); alert("Recruited Felix!"); showMainMenu(); } },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showDLCMenu() {
        if (game.dlcUnlocked) { showPremiumSectors(); return; }
        clearConsole("center", "#4d004d", "#ff00ff");
        document.getElementById("console").innerHTML = `<h2 style="color: #ff00ff; font-size:16px;">🔒 PREMIUM DLC PORTALS</h2><p style="color: #00ffff; font-size:11.5px;">Enter Passcode (MULTIVERSE):</p><input type="text" id="dlc-code" placeholder="Passcode..." style="background:#111; color:#0f0; border:1px solid #0ff; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px; text-align:center; margin-top:6px;" />`;
        renderButtons([
            { text: "🔓 Unlock", class: "btn btn-dlc", action: () => {
                let val = document.getElementById("dlc-code").value.trim().toUpperCase();
                if (val === "MULTIVERSE") { game.dlcUnlocked = true; saveGame(); showPremiumSectors(); }
                else { alert("Incorrect Passcode!"); }
            }},
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showPremiumSectors() {
        clearConsole("center", "#4d004d", "#ff00ff");
        document.getElementById("console").innerHTML = `<h2 style="color: #ff00ff; font-size:16px;">🌟 PREMIUM SECTORS</h2><p style="color: #aaa; font-size:11.5px;">VIP dimensions unlocked!</p>`;
        renderButtons([
            { text: "🥞 Goth IHOP Portal", class: "btn btn-maid", action: () => { game.staff.push({ name: "Goth Raven", origin: "DC", power: 35, maxHp: 130, hp: 130 }); saveGame(); alert("Recruited Goth Raven!"); showMainMenu(); } },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function showMainMenu() {
        clearConsole("flex-start", "radial-gradient(circle at 50% 20%, #1a1500 0%, #080702 85%)", "#ffaa00");
        document.getElementById("stats-bar").style.display = "flex";
        updateUI();
        log(`--- NEXUS HQ (Slot ${currentSaveSlot}) | WELCOME, TRAINER ${game.playerName.toUpperCase()} ---`, "color-cyan");
        renderButtons([
            { text: "🗺️ World Map", class: "btn btn-map", action: () => startSinglePlayerCombat("Wild Treant", 90, 14, 600) },
            { text: "⛏️ Stardew Mines", class: "btn btn-mine", action: () => startSinglePlayerCombat("Cave Bat", 75, 12, 450) },
            { text: "⭐ Set Champion", class: "btn btn-maid", action: showChampionSelectMenu },
            { text: "🛍️ Market District", class: "btn btn-farm", action: showMarketMenu },
            { text: "🎰 Lucky Wheel", class: "btn btn-spin", action: showLuckyWheelScreen },
            { text: "🎒 Inventory", class: "btn btn-gear", action: showInventoryMenu },
            { text: "🌌 Free Portals", class: "btn btn-sys", action: showFreePortalsMenu },
            { text: "🔒 Premium DLC", class: "btn btn-dlc", action: showDLCMenu },
            { text: "🌐 Online Hub", class: "btn btn-sys", action: showOnlineHubMenu },
            { text: "💤 Sleep", action: () => { game.stamina = 100; game.day++; saveGame(); updateUI(); alert("Rested for the night!"); showMainMenu(); } },
            { text: "📁 Switch Slot", class: "btn btn-back", action: showIntroScreen }
        ]);
    }

    window.onload = () => { showIntroScreen(); };
</script>
