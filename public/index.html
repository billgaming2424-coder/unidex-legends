<!DOCTYPE html>
<!-- saved from url=(0031)file:///D:/downloads/index.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UniMon Legends</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            background-color: #030305; color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 6px;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Adapts cleanly to mobile browser URL bars */
            overflow: hidden; display: flex; flex-direction: column;
            user-select: none;
            touch-action: manipulation;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }

        /* Top HUD Bar */
        #stats-bar {
            background: linear-gradient(180deg, #12121c 0%, #08080f 100%);
            border: 1px solid #00ffff55;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
            padding: 4px 8px; margin-bottom: 6px; border-radius: 6px;
            font-size: 11.5px; flex-shrink: 0; display: none;
            justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 4px;
        }
        .stat-highlight { color: #ff00ff; font-weight: bold; text-shadow: 0 0 8px #ff00ff88; }
        .stat-money { color: #ffff00; font-weight: bold; text-shadow: 0 0 8px #ffff0088; }
        
        /* Main Interactive Console Wrapper */
        #screen-wrapper {
            position: relative;
            flex: 1 1 auto;
            min-height: 120px;
            display: flex;
            width: 100%;
            margin-bottom: 6px;
            overflow: hidden;
        }

        #console {
            flex: 1 1 100%; min-height: 0; background-color: #020204;
            border: 2px solid #222233;
            padding: 10px; overflow-y: auto;
            border-radius: 8px; font-size: 13.5px; line-height: 1.4;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95), 0 0 20px rgba(0, 255, 100, 0.15);
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center;
            position: relative;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* Visible Neon Scrollbars */
        #console::-webkit-scrollbar, #controls::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        #console::-webkit-scrollbar-track, #controls::-webkit-scrollbar-track {
            background: #080811;
            border-radius: 4px;
        }
        #console::-webkit-scrollbar-thumb, #controls::-webkit-scrollbar-thumb {
            background: #00ffff55;
            border: 1px solid #00ffff;
            border-radius: 4px;
        }

        /* On-Screen Mobile Touch Scroll Nudge Buttons */
        .touch-scroll-panel {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
            pointer-events: auto;
        }
        .touch-scroll-btn {
            background: rgba(10, 10, 20, 0.85);
            color: #00ffff;
            border: 1px solid #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .touch-scroll-btn:active {
            background: #00ffff;
            color: #000;
        }

        /* CRT Scanline Overlay */
        #console::after {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.015), rgba(0, 255, 0, 0.04));
            z-index: 2; background-size: 100% 3px, 6px 100%; pointer-events: none; opacity: 0.65;
        }

        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #14141e; padding-bottom: 3px; width: 100%; text-align: left; position: relative; z-index: 3; }

        @keyframes travelSlide {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(8px); }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .travel-animation { animation: travelSlide 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; }

        @keyframes desertSandstorm {
            0% { background-position: 0 0; filter: sepia(0.8) brightness(1.1); transform: translateX(-4px); }
            50% { background-position: 100px 50px; filter: sepia(1) brightness(1.3); transform: translateX(4px); }
            100% { background-position: 0 0; filter: sepia(0.8) brightness(1.1); transform: translateX(-4px); }
        }
        .desert-scene { animation: desertSandstorm 2s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes volcanoEruption {
            0% { box-shadow: inset 0 0 30px rgba(255,50,0,0.3); transform: scale(1); }
            50% { box-shadow: inset 0 0 60px rgba(255,0,0,0.7); transform: scale(1.01); }
            100% { box-shadow: inset 0 0 30px rgba(255,50,0,0.3); transform: scale(1); }
        }
        .volcano-scene { animation: volcanoEruption 2s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes mineRumble {
            0% { transform: translate(0, 0); filter: brightness(0.9); }
            20% { transform: translate(-4px, 3px); filter: brightness(1.2) hue-rotate(15deg); }
            40% { transform: translate(4px, -2px); filter: brightness(0.85); }
            60% { transform: translate(-3px, -4px); filter: brightness(1.15); }
            80% { transform: translate(4px, 4px); filter: brightness(0.9); }
            100% { transform: translate(0, 0); filter: brightness(1); }
        }
        .mining-animation { animation: mineRumble 0.25s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes restNightSequence {
            0% { background: #000; opacity: 0; transform: scale(0.95); }
            30% { background: #050515; opacity: 1; transform: scale(1); }
            70% { background: #02020a; opacity: 1; transform: scale(1.02); }
            100% { background: #000; opacity: 0; transform: scale(1.05); }
        }
        .rest-scene { animation: restNightSequence 4s ease-in-out forwards; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }
        .zzz-1 { animation: zFloat 1.5s infinite ease-in; display: inline-block; font-size: 20px; color: #00ffff; }
        .zzz-2 { animation: zFloat 1.5s infinite ease-in 0.5s; display: inline-block; font-size: 26px; color: #ff00ff; }
        .zzz-3 { animation: zFloat 1.5s infinite ease-in 1s; display: inline-block; font-size: 32px; color: #ffff00; }
        @keyframes zFloat { 0% { transform: translateY(0px) translateX(0px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-30px) translateX(15px); opacity: 0; } }

        @keyframes saveToastFade { 0% { opacity: 0; transform: translateY(10px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
        #save-toast { position: fixed; bottom: 20px; right: 20px; background: #002211; border: 1px solid #00ff66; color: #00ff66; padding: 6px 12px; border-radius: 4px; font-size: 12px; z-index: 9999; display: none; box-shadow: 0 0 10px rgba(0,255,100,0.4); pointer-events: none; }

        #join-toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
        .join-toast-entry { background: #001a0d; border: 1px solid #00ff88; color: #00ff88; padding: 6px 12px; border-radius: 4px; font-size: 12px; box-shadow: 0 0 10px rgba(0,255,136,0.4); white-space: nowrap; animation: joinToastIn 0.25s ease-out; }
        @keyframes joinToastIn { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes joinToastOut { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(20px); } }

        /* In-page replacement for window.alert() - the native browser alert() (and
           confirm()/prompt()) forcibly kicks the page out of Fullscreen API mode the
           instant it pops up, which is exactly what was booting fullscreen players out
           of the game on every "not enough funds"/"released!" style message. This is a
           normal DOM overlay instead, so it never touches fullscreen state. */
        #game-alert-overlay {
            position: fixed; inset: 0; z-index: 20000;
            background: rgba(0,0,0,0.65);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #game-alert-overlay.active { opacity: 1; pointer-events: auto; }
        #game-alert-box {
            background: #0b0b14; border: 1px solid #00ffff88; border-radius: 8px;
            padding: 18px 22px; max-width: 88%; width: 340px;
            box-shadow: 0 0 24px rgba(0,255,255,0.25);
            text-align: center;
            transform: scale(0.9); transition: transform 0.2s ease;
        }
        #game-alert-overlay.active #game-alert-box { transform: scale(1); }
        #game-alert-message { color: #fff; font-size: 13px; line-height: 1.5; margin-bottom: 14px; white-space: pre-line; }
        #game-alert-ok-btn {
            background: #00332e; color: #00ffcc; border: 1px solid #00ffcc; border-radius: 4px;
            padding: 6px 26px; font-size: 12px; cursor: pointer; font-family: inherit;
        }
        #game-alert-ok-btn:hover { background: #00544a; }

        /* --- Animated Title Screen --- */
        .title-stage { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .title-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .title-particle {
            position: absolute; bottom: -10px; left: 50%; width: 3px; height: 3px; border-radius: 50%;
            background: #00ffff; box-shadow: 0 0 6px 2px rgba(0,255,255,0.8);
            animation: titleParticleFloat linear infinite; opacity: 0;
        }
        @keyframes titleParticleFloat {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 0.9; }
            90%  { opacity: 0.5; }
            100% { transform: translateY(-230px) translateX(var(--drift, 12px)); opacity: 0; }
        }
        .title-particle:nth-child(1)  { left: 8%;  animation-duration: 5.5s; animation-delay: 0s;    --drift: 12px;  background:#00ffff; }
        .title-particle:nth-child(2)  { left: 18%; animation-duration: 7s;   animation-delay: 1.1s;  --drift: -18px; background:#ff66ff; }
        .title-particle:nth-child(3)  { left: 28%; animation-duration: 6.2s; animation-delay: 2.3s;  --drift: 10px;  background:#00ff88; }
        .title-particle:nth-child(4)  { left: 40%; animation-duration: 8s;   animation-delay: 0.6s;  --drift: -8px;  background:#00ffff; }
        .title-particle:nth-child(5)  { left: 52%; animation-duration: 5.8s; animation-delay: 3s;    --drift: 16px;  background:#ff66ff; }
        .title-particle:nth-child(6)  { left: 63%; animation-duration: 6.8s; animation-delay: 1.8s;  --drift: -14px; background:#00ff88; }
        .title-particle:nth-child(7)  { left: 74%; animation-duration: 7.4s; animation-delay: 0.3s;  --drift: 20px;  background:#00ffff; }
        .title-particle:nth-child(8)  { left: 84%; animation-duration: 5.2s; animation-delay: 2.6s;  --drift: -10px; background:#ff66ff; }
        .title-particle:nth-child(9)  { left: 92%; animation-duration: 6.5s; animation-delay: 1.3s;  --drift: 6px;   background:#00ff88; }
        .title-particle:nth-child(10) { left: 48%; animation-duration: 9s;   animation-delay: 4s;    --drift: -22px; background:#00ffff; }

        .title-logo-wrap {
            position: relative; z-index: 2; margin-bottom: 4px;
            animation: logoReveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) both, logoGlowPulse 2.6s ease-in-out 1.1s infinite;
        }
        .title-logo-wrap svg { width: 100%; max-width: 360px; height: auto; display: block; }
        @keyframes logoReveal {
            0%   { opacity: 0; transform: scale(0.72) translateY(10px); filter: brightness(2.2) blur(6px); }
            60%  { opacity: 1; transform: scale(1.05) translateY(0);   filter: brightness(1.3) blur(0); }
            100% { opacity: 1; transform: scale(1) translateY(0);      filter: brightness(1) blur(0); }
        }
        @keyframes logoGlowPulse {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(0,255,255,0.55)) drop-shadow(0 0 22px rgba(255,102,255,0.35)); }
            50%      { filter: drop-shadow(0 0 18px rgba(0,255,255,0.85)) drop-shadow(0 0 34px rgba(255,102,255,0.55)); }
        }

        .title-tagline {
            opacity: 0; animation: fadeUpIn 0.8s ease-out 0.9s forwards;
            color: #ffff00; font-size: 12.5px; max-width: 400px; margin-top: 4px; position: relative; z-index: 2;
        }
        @keyframes fadeUpIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .title-menu-btn { opacity: 0; animation: menuBtnRise 0.5s ease-out forwards; }
        .title-menu-btn:nth-of-type(1) { animation-delay: 1.15s; }
        .title-menu-btn:nth-of-type(2) { animation-delay: 1.28s; }
        .title-menu-btn:nth-of-type(3) { animation-delay: 1.41s; }
        .title-menu-btn:nth-of-type(4) { animation-delay: 1.54s; }
        .title-menu-btn:nth-of-type(5) { animation-delay: 1.67s; }
        @keyframes menuBtnRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes wheelSpinAnim {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(1080deg) scale(1.1); filter: hue-rotate(90deg); }
            100% { transform: rotate(2160deg) scale(1); filter: hue-rotate(0deg); }
        }
        .wheel-spinning { animation: wheelSpinAnim 2.2s cubic-bezier(0.15, 0.85, 0.35, 1.05) forwards; }

        @keyframes ballToss {
            0% { transform: translateY(60px) scale(0.4) rotate(0deg); opacity: 0; }
            40% { transform: translateY(-20px) scale(1.1) rotate(360deg); opacity: 1; }
            100% { transform: translateY(0px) scale(1) rotate(720deg); opacity: 1; }
        }
        @keyframes ballWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-28deg) scale(1.05); }
            30% { transform: rotate(28deg) scale(1.05); }
            45% { transform: rotate(-18deg) scale(1.02); }
            60% { transform: rotate(18deg) scale(1.02); }
            75% { transform: rotate(-8deg) scale(1); }
            85% { transform: rotate(8deg) scale(1); }
        }
        .pokeball-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; margin: 10px 0; }
        .pokeball-sprite { width: 60px; height: 60px; border-radius: 50%; position: relative; box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.4); border: 3px solid #111; overflow: hidden; animation: ballToss 0.6s ease-out forwards, ballWobble 1.2s ease-in-out 0.6s 2; }
        .ball-top { width: 100%; height: 50%; background: #ff1a1a; }
        .ball-bottom { width: 100%; height: 50%; background: #ffffff; }
        .ball-center-band { position: absolute; top: 46%; left: 0; width: 100%; height: 8%; background: #111; z-index: 4; }
        .ball-center-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: #ffffff; border: 2px solid #111; z-index: 5; box-shadow: 0 0 4px #fff; }
        @keyframes redLightBlink { 0%, 49% { background: #ff1a1a; box-shadow: 0 0 8px #ff1a1a; } 50%, 100% { background: #ffffff; box-shadow: 0 0 4px #fff; } }
        .pokeball-sprite.capturing .ball-center-btn { animation: redLightBlink 0.4s steps(1) infinite; }
        .pokeball-sprite.capturing { animation: ballShakeCapture 0.4s ease-in-out infinite; }
        @keyframes ballShakeCapture { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
        .shiny-frame { display: inline-block; border: 3px solid #ffdd00; border-radius: 12px; box-shadow: 0 0 20px rgba(255,221,0,0.7); padding: 2px; }

        /* Portal reroll spin */
        @keyframes rerollSpinAnim {
            0% { transform: rotate(0deg) scale(1); filter: brightness(1) blur(0px); opacity: 1; }
            40% { transform: rotate(220deg) scale(0.55); filter: brightness(2.2) blur(2px); opacity: 0.35; }
            70% { transform: rotate(300deg) scale(0.55); filter: brightness(2.2) blur(2px); opacity: 0.35; }
            100% { transform: rotate(360deg) scale(1); filter: brightness(1) blur(0px); opacity: 1; }
        }
        .encounter-portrait-wrap.reroll-spin { animation: rerollSpinAnim 0.65s ease-in-out; }

        /* Unique evolution overlay */
        .evolution-overlay { position: fixed; inset: 0; background: radial-gradient(circle, rgba(50,0,70,0.92) 0%, rgba(0,0,0,0.96) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; animation: evoOverlayFade 2.2s ease-in-out forwards; }
        .evolution-flash { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #ffe066 30%, transparent 70%); animation: evoFlashPulse 1.1s ease-in-out infinite; }
        .evolution-text { position: relative; z-index: 2; text-align: center; animation: fadeUpIn 0.6s ease-out 0.3s both; padding: 0 20px; }
        @keyframes evoFlashPulse { 0%, 100% { transform: scale(0.6); opacity: 0.5; } 50% { transform: scale(1.35); opacity: 1; } }
        @keyframes evoOverlayFade { 0% { opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }

        /* Cloud sync status indicator */
        @keyframes cloudSyncSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .sync-status-syncing { display: inline-block; animation: cloudSyncSpin 1s linear infinite; }
        .sync-status-error { color: #ff6666; }

        /* --- STORY & WORLD EXPANSION: dialogue engine modal --- */
        #dialogue-overlay {
            position: fixed; inset: 0; z-index: 21000;
            background: rgba(0,0,0,0.75);
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #dialogue-overlay.active { opacity: 1; pointer-events: auto; }
        #dialogue-box {
            background: linear-gradient(180deg, #0b0b16 0%, #060609 100%);
            border: 1px solid #ffcc6688; border-radius: 10px 10px 0 0;
            padding: 16px 18px 18px 18px; width: 100%; max-width: 480px;
            margin-bottom: 0; box-shadow: 0 -6px 28px rgba(255,204,102,0.18);
            transform: translateY(24px); transition: transform 0.25s ease;
        }
        #dialogue-overlay.active #dialogue-box { transform: translateY(0); }
        .dialogue-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .dialogue-portrait-wrap {
            width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
            border: 2px solid #ffcc66; box-shadow: 0 0 12px rgba(255,204,102,0.5);
            background: #1a1508; display: flex; align-items: center; justify-content: center;
        }
        .dialogue-portrait-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .dialogue-portrait-fallback { font-size: 30px; }
        .dialogue-name { color: #ffcc66; font-size: 15px; font-weight: bold; margin: 0; }
        .dialogue-title { color: #999; font-size: 10.5px; margin: 1px 0 0 0; }
        #dialogue-text { color: #eee; font-size: 12.5px; line-height: 1.6; margin: 0 0 12px 0; white-space: pre-line; min-height: 34px; }
        #dialogue-options { display: flex; flex-direction: column; gap: 6px; }
        .dialogue-option-btn {
            background: #14140a; color: #ffcc66; border: 1px solid #ffcc6666; border-radius: 5px;
            padding: 8px 10px; font-family: 'Courier New', Courier, monospace; font-size: 12px;
            text-align: left; cursor: pointer; transition: all 0.15s ease;
        }
        .dialogue-option-btn:hover { background: #241d0a; border-color: #ffcc66; }
        .dialogue-option-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Responsive Action Button Grid */
        #controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            flex-shrink: 0;
            width: 100%;
            max-height: 42vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            z-index: 4;
            padding: 2px 2px 8px 2px;
        }
        @media (min-width: 650px) { #controls { grid-template-columns: repeat(4, 1fr); max-height: 250px; } }
        
        .btn {
            background: #12121c; color: #00ff66; border: 1px solid #00ff6666;
            padding: 8px 4px;
            font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: bold;
            cursor: pointer; border-radius: 4px; text-align: center; transition: all 0.15s ease;
            touch-action: manipulation; min-height: 38px; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover, .btn.gamepad-focused { background: #1c1c2e; box-shadow: 0 0 10px rgba(0, 255, 100, 0.8); outline: 2px solid #00ffff; }
        .btn:active, .btn.selected { background-color: #00ff66; color: #000; outline: 2px solid #ff00ff; }
        
        .btn-sys { border-color: #00ffff; color: #00ffff; }
        .btn-dlc { border-color: #ff00ff; color: #ff00ff; }
        .btn-villain { border-color: #ff0055; color: #ff0055; background: #2b0011; }
        .btn-back { border-color: #ff3333; color: #ff3333; }
        .btn-farm { border-color: #00ff88; color: #00ff88; background: #001f0c; }
        .btn-gear { border-color: #33ccff; color: #33ccff; background: #001122; }
        .btn-map { border-color: #00ffcc; color: #00ffcc; background: #002222; }
        .btn-mine { border-color: #ffaa00; color: #ffaa00; background: #221500; }
        .btn-combat { border-color: #ff0033; color: #ff0033; background: #33000a; }
        .btn-start { border-color: #00ffff; color: #00ffff; font-size: 13.5px; grid-column: span 2; background: #002222; }

<script>
    let socket = null;
    try { socket = io({ transports: ['websocket', 'polling'] }); } catch(e) {}

    let REAL_CHARACTERS_DB = [];
    let currentSaveSlot = 1;

    // ==================================================================
    // CLOUD ACCOUNT & CLOUD SAVE (Chase Studios / Supabase)
    // Same project as the chase-studios-portal site, so one account works
    // on both. Everything here degrades gracefully offline: if the CDN
    // script fails to load or there's no network, the game plays exactly
    // as it always has, purely on local saves.
    // ==================================================================
    const SUPABASE_URL = "https://rvetucuqburqnrgoatui.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2ZXR1Y3VxYnVycW5yZ29hdHVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTMyOTcsImV4cCI6MjEwMzg2OTI5N30.Q3g0deWdLd8b0oczpDd1gwdRcTm2xJ_RBhjhtCgm19g";

    let supabaseClient = null;
    try {
        if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) { supabaseClient = null; }

    let cloudUser = null;
    let cloudSaveMeta = { exists: false };
    let cloudBusy = false;
    let cloudEmailDraft = "";
    let cloudMenuReturnTo = null;

    // A one-time reward for linking an account, granted once per Chase Studios
    // account (tracked server-side via profiles.welcome_bundle_claimed) - not
    // per save slot, so a player can't farm it by linking multiple slots.
    const CLOUD_WELCOME_BUNDLE = {
        desc: "Welcome to the Chase Studios Network! Nova, the Cloudlink Sentinel joins your staff!",
        apply: (g) => {
            addStaffMember({ name: "Nova, the Cloudlink Sentinel", power: 85, origin: "Chase Studios Network", dexId: 9901, legendary: true });
            recordDex(9901, false);
        }
    };

    function validateCloudCredentials(email, password) {
        if (!email || !password) return "Please enter both an email and password.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return "Please enter a valid email address.";
        if (password.length < 6) return "Password must be at least 6 characters.";
        return null;
    }

    // Supabase's own error.message is usually readable as-is, but a few common cases
    // read better reworded, and some failure modes don't come back with a friendly
    // message at all.
    function friendlyCloudAuthError(error) {
        if (!error) return "Something went wrong. Please try again.";
        const msg = (error.message || "").toLowerCase();
        if (error.status === 429 || msg.includes("rate limit")) return "Too many attempts - please wait a minute before trying again.";
        if (msg.includes("already registered")) return "An account with that email already exists - try logging in instead.";
        if (msg.includes("invalid login credentials")) return "Incorrect email or password.";
        if (msg.includes("email not confirmed")) return "Please confirm your email first - check your inbox for the verification link.";
        if (msg.includes("failed to fetch") || error.name === "TypeError") return "Couldn't reach the server - check your connection and try again.";
        return error.message || "Something went wrong. Please try again.";
    }

    // Pulls down {exists, updatedAt, saveData, playerName, day, funds} for the
    // signed-in account's single cloud save. Cached in cloudSaveMeta so screens
    // can render synchronously between fetches.
    async function fetchCloudSaveMeta() {
        if (!supabaseClient || !cloudUser) { cloudSaveMeta = { exists: false }; return cloudSaveMeta; }
        try {
            const { data, error } = await supabaseClient
                .from('player_saves')
                .select('save_data, updated_at')
                .eq('user_id', cloudUser.id)
                .maybeSingle();
            if (error || !data) { cloudSaveMeta = { exists: false }; return cloudSaveMeta; }
            let sd = data.save_data || {};
            cloudSaveMeta = {
                exists: true,
                updatedAt: new Date(data.updated_at).getTime(),
                saveData: sd,
                playerName: sd.playerName || "Trainer",
                day: sd.day || 1,
                funds: sd.funds || 0
            };
        } catch (e) {
            cloudSaveMeta = { exists: false };
        }
        return cloudSaveMeta;
    }

    // Debounced so rapid successive saveGame() calls (common while playing)
    // coalesce into one push instead of hammering the network.
    let cloudPushTimer = null;
    let cloudPushInFlight = false;
    let cloudPushQueued = false;

    // 'idle' | 'syncing' | 'synced' | 'error' - drives the small cloud icon in the stats bar.
    let cloudSyncStatus = 'idle';
    let cloudSyncRetryCount = 0;
    let cloudSyncRetryTimer = null;

    function updateCloudSyncIndicator() {
        let el = document.getElementById("cloud-sync-indicator");
        if (!el) return;
        if (!supabaseClient || !cloudUser || !game.cloudLinked) { el.textContent = ''; el.title = ''; el.className = ''; return; }
        const ICONS = { idle: '☁️', syncing: '🔄', synced: '☁️', error: '⚠️' };
        const TITLES = { idle: 'Cloud sync ready', syncing: 'Syncing to the cloud...', synced: `Synced ${game.cloudSyncedAt ? 'at ' + new Date(game.cloudSyncedAt).toLocaleTimeString() : ''}`, error: 'Cloud sync failed - retrying automatically. Click to open cloud menu.' };
        el.textContent = ICONS[cloudSyncStatus] || '☁️';
        el.title = TITLES[cloudSyncStatus] || '';
        el.className = cloudSyncStatus === 'error' ? 'sync-status-error' : (cloudSyncStatus === 'syncing' ? 'sync-status-syncing' : '');
    }

    function scheduleCloudPush() {
        if (!supabaseClient || !cloudUser || !game.cloudLinked) return;
        clearTimeout(cloudPushTimer);
        cloudPushTimer = setTimeout(() => { performCloudPush(); }, 800);
    }

    // Auto-retries with backoff on failure (network hiccup, dropped session, etc.)
    // instead of silently giving up until the next manual save.
    function scheduleCloudSyncRetry() {
        clearTimeout(cloudSyncRetryTimer);
        if (cloudSyncRetryCount >= 5) return;
        let delay = Math.min(60000, 5000 * Math.pow(2, cloudSyncRetryCount));
        cloudSyncRetryCount++;
        cloudSyncRetryTimer = setTimeout(() => { if (game.cloudLinked) performCloudPush(); }, delay);
    }

    async function performCloudPush() {
        if (!supabaseClient || !cloudUser || !game.cloudLinked) return;
        if (cloudPushInFlight) { cloudPushQueued = true; return; }
        cloudPushInFlight = true;
        cloudSyncStatus = 'syncing';
        updateCloudSyncIndicator();
        try {
            const { data, error } = await supabaseClient
                .from('player_saves')
                .upsert({ user_id: cloudUser.id, save_data: game }, { onConflict: 'user_id' })
                .select('updated_at')
                .single();
            if (!error && data) {
                game.cloudSyncedAt = new Date(data.updated_at).getTime();
                cloudSaveMeta = { exists: true, updatedAt: game.cloudSyncedAt, saveData: game, playerName: game.playerName, day: game.day, funds: game.funds };
                cloudSyncStatus = 'synced';
                cloudSyncRetryCount = 0;
                clearTimeout(cloudSyncRetryTimer);
            } else {
                cloudSyncStatus = 'error';
                scheduleCloudSyncRetry();
            }
        } catch (e) {
            cloudSyncStatus = 'error';
            scheduleCloudSyncRetry();
        }
        cloudPushInFlight = false;
        updateCloudSyncIndicator();
        if (cloudPushQueued) { cloudPushQueued = false; performCloudPush(); }
    }

    // Background safety net on top of the debounced push-on-save: catches any drift
    // (e.g. a change that didn't route through saveGame) while the tab is open.
    setInterval(() => {
        if (game && game.cloudLinked && supabaseClient && cloudUser && !cloudPushInFlight) performCloudPush();
    }, 120000);

    // Best-effort final sync when the player alt-tabs away, minimizes, or closes the tab.
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden" && game && game.cloudLinked && !cloudPushInFlight) performCloudPush();
    });

    async function submitCloudAuth(mode) {
        let emailInput = document.getElementById("cloud-email-input");
        let pwInput = document.getElementById("cloud-password-input");
        let email = emailInput ? emailInput.value.trim() : "";
        let password = pwInput ? pwInput.value.trim() : "";
        cloudEmailDraft = email;

        let validationError = validateCloudCredentials(email, password);
        if (validationError) {
            let statusEl = document.getElementById("cloud-status-msg");
            if (statusEl) statusEl.textContent = validationError;
            return;
        }

        cloudBusy = true;
        showCloudAccountMenu();
        try {
            const fn = mode === 'signup' ? 'signUp' : 'signInWithPassword';
            const { data, error } = await supabaseClient.auth[fn]({ email, password });
            cloudBusy = false;
            if (error) {
                showCloudAccountMenu();
                let el = document.getElementById("cloud-status-msg");
                if (el) el.textContent = friendlyCloudAuthError(error);
                return;
            }
            if (mode === 'signup' && !data.session) {
                showCloudAccountMenu();
                let el = document.getElementById("cloud-status-msg");
                if (el) el.textContent = "Check your email to confirm your account, then log in.";
                return;
            }
            cloudUser = (data.session ? data.session.user : data.user) || null;
            if (cloudUser) await fetchCloudSaveMeta();
            showCloudAccountMenu();
        } catch (e) {
            cloudBusy = false;
            showCloudAccountMenu();
            let el = document.getElementById("cloud-status-msg");
            if (el) el.textContent = friendlyCloudAuthError(e);
        }
    }

    async function cloudLogout() {
        if (!supabaseClient) return;
        cloudBusy = true;
        showCloudAccountMenu();
        try { await supabaseClient.auth.signOut(); } catch (e) {}
        cloudUser = null;
        cloudSaveMeta = { exists: false };
        cloudBusy = false;
        showCloudAccountMenu();
    }

    function unlinkCurrentSave() {
        game.cloudLinked = false;
        saveGame();
        showCloudAccountMenu();
    }

    async function manualCloudSync() {
        cloudBusy = true;
        showCloudAccountMenu();
        await performCloudPush();
        cloudBusy = false;

    // COMBAT BALANCE (client side - Cave Monster / Regional Monster fights
    // and the co-op raid boss). Mirrored server-side in server.js for the
    // raid boss's retaliation damage - keep DEFENSE_MITIGATION_K and
    // MIN_TRUE_DAMAGE_FLOOR in sync between the two if you retune them.
    // ==================================================================
    const ENEMY_HP_MULTIPLIER = 1.4;   // across-the-board enemy HP boost
    const ENEMY_ATK_MULTIPLIER = 1.5;  // across-the-board enemy ATK boost
    const ENEMY_CRIT_CHANCE = 0.12;
    const ENEMY_CRIT_MULTIPLIER = 1.5;
    const DEFENSE_MITIGATION_K = 50;   // higher K = defense matters less per point
    const MIN_TRUE_DAMAGE_FLOOR = 3;   // every landed hit deals at least this much, no matter how tanky the target is

    // Defense scales off a fighter's own power stat - there's no separate gear
    // stat system yet (equippedGear is currently cosmetic), so this is the one
    // knob that currently feeds mitigation. Bump the 0.25 multiplier (or wire
    // in real gear bonuses here later) to make defense matter more.
    function getFighterDefense(fighter) {
        return Math.round(((fighter && fighter.power) || 30) * 0.25);
    }

    // Asymptotic mitigation curve (defense / (defense + K)) can approach but
    // can never reach 100% reduction no matter how high defense climbs, and
    // armorPenPct (0-1) further shrinks the defense the formula sees. The
    // MIN_TRUE_DAMAGE_FLOOR is a second, independent backstop on top of that -
    // together these are what make a 0-damage hit impossible.
    function computeMitigatedDamage(rawDamage, defense, armorPenPct) {
        let effectiveDefense = Math.max(0, (defense || 0) * (1 - (armorPenPct || 0)));
        let mitigation = effectiveDefense / (effectiveDefense + DEFENSE_MITIGATION_K);
        let mitigated = rawDamage * (1 - mitigation);
        return Math.max(MIN_TRUE_DAMAGE_FLOOR, Math.round(mitigated));
    }

        return Math.random() < ENEMY_CRIT_CHANCE;

    let currentTrackName = null;

    function playBGM(trackKey) {
        lastActiveTrack = trackKey;
        if (isAudioMuted) return;
        if (currentTrackName === trackKey) return;
        stopAllMusic();
        let track = AUDIO_TRACKS[trackKey] || AUDIO_TRACKS.intro;
        if (track) { 
            track.loop = true; 
            track.volume = masterVolume; 
            track.play().catch(() => {}); 
            currentTrackName = trackKey; 
        }
    }

    function playStarterCry(starterName) {
        if (isAudioMuted) return;
        stopAllMusic();
        let pool = PORTAL_CHAR_POOLS.standard;
        let charObj = pool.find(c => c.name === starterName);
        if (charObj && charObj.cry) {
            charObj.cry.volume = masterVolume;
            charObj.cry.currentTime = 0;
            charObj.cry.play().catch(() => {});
        }
    }

    function stopStarterCries() {
        let pool = PORTAL_CHAR_POOLS.standard || [];
        pool.forEach(c => { try { if (c.cry) { c.cry.pause(); c.cry.currentTime = 0; } } catch (e) {} });
    }

    function stopAllMusic() {
        Object.values(AUDIO_TRACKS).forEach(t => { try { t.pause(); t.currentTime = 0; } catch (e) {} });
        currentTrackName = null;
    }

    function updateMasterVolume(val) {
        masterVolume = parseFloat(val);
        if (currentTrackName && AUDIO_TRACKS[currentTrackName]) {
            AUDIO_TRACKS[currentTrackName].volume = masterVolume;
        }
    }

    function toggleAudioMute() {
        isAudioMuted = !isAudioMuted;
        let btn = document.getElementById("audio-toggle-btn");
        if (isAudioMuted) { 
            stopAllMusic(); 
            if (btn) btn.innerText = "🔇"; 
        } else { 
            if (btn) btn.innerText = "🔊"; 
            playBGM(lastActiveTrack); 
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    // --- GAMEPAD ENGINE ---
    function updateGamepadFocus() {
        const btns = Array.from(document.querySelectorAll("#controls .btn"));
        if (!btns.length) return;
        gamepadBtnIndex = Math.max(0, Math.min(gamepadBtnIndex, btns.length - 1));
        btns.forEach((b, idx) => {
            if (idx === gamepadBtnIndex) b.classList.add("gamepad-focused");
            else b.classList.remove("gamepad-focused");
        });
    }

    let gpLastNav = 0;
    function pollGamepads() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const now = Date.now();
        for (let i = 0; i < gamepads.length; i++) {
            let gp = gamepads[i];
            if (gp) {
                let dpadUp = gp.buttons[12] && gp.buttons[12].pressed;
                let dpadDown = gp.buttons[13] && gp.buttons[13].pressed;
                let dpadLeft = gp.buttons[14] && gp.buttons[14].pressed;
                let dpadRight = gp.buttons[15] && gp.buttons[15].pressed;
                let stickY = gp.axes[1] || 0;
                let stickX = gp.axes[0] || 0;

                const btns = Array.from(document.querySelectorAll("#controls .btn"));
                if (btns.length && (now - gpLastNav > 180)) {
                    if (dpadRight || stickX > 0.5) {
                        gamepadBtnIndex = (gamepadBtnIndex + 1) % btns.length;
                        gpLastNav = now;
                        updateGamepadFocus();
                    } else if (dpadLeft || stickX < -0.5) {
                        gamepadBtnIndex = (gamepadBtnIndex - 1 + btns.length) % btns.length;
                        gpLastNav = now;
                        updateGamepadFocus();
                    } else if (dpadDown || stickY > 0.5) {
                        gamepadBtnIndex = Math.min(gamepadBtnIndex + 2, btns.length - 1);
                        gpLastNav = now;
                        updateGamepadFocus();
                    } else if (dpadUp || stickY < -0.5) {
                        gamepadBtnIndex = Math.max(gamepadBtnIndex - 2, 0);
                        gpLastNav = now;
                        updateGamepadFocus();
                    }
                }

                if (gp.buttons[0] && gp.buttons[0].pressed) {
                    if (!window._gpA_pressed) {
                        window._gpA_pressed = true;
                        if (btns[gamepadBtnIndex]) btns[gamepadBtnIndex].click();
                    }
                } else { window._gpA_pressed = false; }

                if (gp.buttons[1] && gp.buttons[1].pressed) {
                    if (!window._gpB_pressed) {
                        window._gpB_pressed = true;
                        let backBtn = document.querySelector(".btn-back");
                        if (backBtn) backBtn.click();
                    }
                } else { window._gpB_pressed = false; }
            }
        }
        requestAnimationFrame(pollGamepads);
    }
    requestAnimationFrame(pollGamepads);

    async function loadCharacterDatabase() {
        try {
            const res = await fetch('/characters.json?t=' + Date.now());
            REAL_CHARACTERS_DB = await res.json();
        } catch (e) { REAL_CHARACTERS_DB = []; }
    }

    function getAllDexEntries() {
        let poolEntries = [];
        Object.keys(PORTAL_CHAR_POOLS).forEach(poolKey => {
            PORTAL_CHAR_POOLS[poolKey].forEach(c => poolEntries.push({ id: c.id, name: c.name, origin: c.origin, type: c.type, portal: poolKey }));
        });
        let existingIds = new Set(REAL_CHARACTERS_DB.map(c => c.id));
        return REAL_CHARACTERS_DB.concat(poolEntries.filter(c => !existingIds.has(c.id)))
            .sort((a, b) => a.id - b.id);
    }

    const DAILY_QUEST_POOL = [
        { key: 'catches', desc: 'Catch 3 characters from any portal', target: 3, reward: 200 },

    // Backfills every progression field this batch adds so older saves (and saves
    // loaded before this code ran once) never hit an undefined lookup.
    function ensureProgressionDefaults() {
        if (!game.stats) game.stats = {};
        if (!game.dailyProgress) game.dailyProgress = { catches: 0, rerolls: 0, raidKills: 0, trains: 0, harvests: 0, marketListings: 0, evolutions: 0 };
        if (!Array.isArray(game.dailyQuests)) game.dailyQuests = [];
        if (typeof game.loginStreak !== 'number') game.loginStreak = 1;
        if (typeof game.lastLoginDateStr !== 'string') game.lastLoginDateStr = '';
    }

    function bumpLifetimeStat(key, amount = 1) {
        ensureProgressionDefaults();
        game.stats[key] = (game.stats[key] || 0) + amount;
    }

    // Advances daily-quest progress and auto-claims the reward the moment a quest's
    // target is hit (no separate "claim" step - momentum matters more than busywork).
    function bumpDailyProgress(key, amount = 1) {
        ensureProgressionDefaults();
        game.dailyProgress[key] = (game.dailyProgress[key] || 0) + amount;
        game.dailyQuests.forEach(q => {
            if (!q.claimed && q.key === key && (game.dailyProgress[q.key] || 0) >= q.target) {
                q.claimed = true;
                game.funds += q.reward;
                showGameAlert(`✅ Daily Quest Complete: ${q.desc}! +$${q.reward}`);
            }
        });
    }

    function generateDailyQuests() {
        let pool = DAILY_QUEST_POOL.slice();
        let picks = [];
        for (let i = 0; i < 3 && pool.length; i++) {
            let idx = Math.floor(Math.random() * pool.length);
            let t = pool.splice(idx, 1)[0];
            picks.push({ key: t.key, desc: t.desc, target: t.target, reward: t.reward, claimed: false });
        }
        return picks;
    }

    // Runs once per real-world calendar day (cheap to call every time HQ loads - it
    // no-ops unless the date string has actually changed): rolls fresh daily quests,
    // resets today's progress counters, and advances (or resets) the login streak.
    function checkDailyReset() {
        ensureProgressionDefaults();
        let todayStr = new Date().toISOString().slice(0, 10);
        if (game.lastLoginDateStr === todayStr) return;
        let prevDateStr = game.lastLoginDateStr;
        if (prevDateStr) {
            let diffDays = Math.round((new Date(todayStr + 'T00:00:00Z') - new Date(prevDateStr + 'T00:00:00Z')) / 86400000);
            game.loginStreak = diffDays === 1 ? (game.loginStreak || 0) + 1 : 1;
        } else {
            game.loginStreak = 1;
        }
        game.lastLoginDateStr = todayStr;
        game.dailyProgress = { catches: 0, rerolls: 0, raidKills: 0, trains: 0, harvests: 0, marketListings: 0, evolutions: 0 };
        game.dailyQuests = generateDailyQuests();
        let streakBonus = Math.min(500, 50 * game.loginStreak);
        game.funds += streakBonus;
        saveGame();
        showGameAlert(`📅 Day streak: ${game.loginStreak}! New daily quests are up. +$${streakBonus} login bonus!`);
    }

    function checkAchievements() {
        if (!game.achievements) game.achievements = {};
        ensureProgressionDefaults();
        ACHIEVEMENT_DEFS.forEach(t => {
            if (!game.achievements[t.id] && t.check(game, game.stats)) {
                game.achievements[t.id] = true;
                game.funds += t.reward;
                log(`🏆 ACHIEVEMENT UNLOCKED: ${t.name} - ${t.desc} (+$${t.reward})`, "color-cyan");
            }
        });
    }

    // Backfills every field this expansion adds so saves from before this code
    // existed never hit an undefined lookup (same pattern as ensureFarmDefaults /

    function ensureWorldExpansionDefaults() {
        if (!game.quests) game.quests = { active: [], completed: [], flags: {} };
        if (!Array.isArray(game.quests.active)) game.quests.active = [];
        if (!Array.isArray(game.quests.completed)) game.quests.completed = [];
        if (!game.quests.flags) game.quests.flags = {};
        if (!game.reputation) game.reputation = { viking: 0, oakhaven: 0, duneSpire: 0, forgePeak: 0, mistVeil: 0 };
        if (!game.resources) game.resources = { wood: 0 };
        if (typeof game.resources.wood !== 'number') game.resources.wood = 0;
        if (!game.homestead) game.homestead = { unlocked: false, structures: { longhouse: 0, watchtower: 0, palisades: 0, barracks: 0 }, guards: [] };
        if (!game.homestead.structures) game.homestead.structures = { longhouse: 0, watchtower: 0, palisades: 0, barracks: 0 };
        if (!Array.isArray(game.homestead.guards)) game.homestead.guards = [];
    }

    function isQuestActive(questId) { ensureWorldExpansionDefaults(); return game.quests.active.includes(questId); }
    function isQuestCompleted(questId) { ensureWorldExpansionDefaults(); return game.quests.completed.includes(questId); }

    // Returns this leader's next not-yet-completed quest (whether it's already
    // active or not) so the dialogue engine always knows what to offer/track.
    function getNextQuestForLeader(leaderKey) {
        let defs = Object.keys(QUEST_DEFS).map(id => QUEST_DEFS[id]).filter(q => q.giver === leaderKey);
        return defs.find(q => !isQuestCompleted(q.id)) || null;
    }

    function startQuest(questId) {
        ensureWorldExpansionDefaults();
        let q = QUEST_DEFS[questId];
        if (!q || isQuestActive(questId) || isQuestCompleted(questId)) return;
        game.quests.active.push(questId);
        saveGame(); updateUI();
        showGameAlert(`📜 Quest Started: ${q.name}\n\n${q.desc}`);
    }

    function completeQuest(questId) {
        ensureWorldExpansionDefaults();
        let q = QUEST_DEFS[questId];
        if (!q || isQuestCompleted(questId) || !isQuestActive(questId)) return;
        if (!q.checkComplete(game)) {
            showGameAlert("You haven't met the requirements for this quest yet.");
            return;
        }
        if (q.onComplete) q.onComplete(game);
        game.quests.active = game.quests.active.filter(id => id !== questId);
        game.quests.completed.push(questId);
        if (q.reward) {
            if (q.reward.funds) game.funds += q.reward.funds;
            if (q.reward.reputation) {
                Object.keys(q.reward.reputation).forEach(repKey => bumpReputation(repKey, q.reward.reputation[repKey]));
            }
        }
        checkAchievements();
        saveGame(); updateUI();
        showGameAlert(`✅ Quest Complete: ${q.name}\n\n${q.completeText || ''}`);
        checkVikingHomesteadUnlock();
    }

    function setStoryFlag(flag, value = true) { ensureWorldExpansionDefaults(); game.quests.flags[flag] = value; }

    let activeDialogueNpc = null;

    function getDynamicQuestOption(leaderKey) {
        let quest = getNextQuestForLeader(leaderKey);
        if (!quest) return null;
        if (isQuestActive(quest.id)) {
            if (quest.checkComplete(game)) return { label: `✅ Turn in: ${quest.name}`, action: 'turnInQuest', questId: quest.id };
            return { label: `📜 (In Progress) ${quest.name}`, action: 'showQuestDesc', questId: quest.id };
        }
        return { label: `❗ ${quest.name}`, action: 'offerQuest', questId: quest.id };
    }

    function openDialogue(npcKey) {
        if (!NPC_LEADERS[npcKey]) return;
        activeDialogueNpc = npcKey;
        activeDialogueNode = 'start';
        renderDialogue();
    }

    function renderDialogue() {
        let npc = NPC_LEADERS[activeDialogueNpc];
        if (!npc) { closeDialogue(); return; }
        let node = npc.dialogue[activeDialogueNode] || npc.dialogue.start;

        document.getElementById('dialogue-name').innerText = npc.name;
        document.getElementById('dialogue-title').innerText = npc.title;
        document.getElementById('dialogue-text').innerText = node.text;

        let portraitWrap = document.getElementById('dialogue-portrait-wrap');
        portraitWrap.innerHTML = '';
        let img = document.createElement('img');
        img.src = npc.portrait;
        img.alt = npc.name;
        img.onerror = () => { portraitWrap.innerHTML = `<span class="dialogue-portrait-fallback">${npc.fallbackEmoji}</span>`; };
        portraitWrap.appendChild(img);

        let options = node.options.slice();
        if (activeDialogueNode === 'start') {
            let dyn = getDynamicQuestOption(npc.key);
            if (dyn) options = [dyn].concat(options);
        }

        let optionsEl = document.getElementById('dialogue-options');
        optionsEl.innerHTML = '';
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'dialogue-option-btn';
            btn.innerText = opt.label;
            btn.onclick = () => dialogueChoice(opt);
            optionsEl.appendChild(btn);
        });

        document.getElementById('dialogue-overlay').classList.add('active');
    }

    function dialogueChoice(opt) {
        if (!opt) return;
        if (opt.next) { activeDialogueNode = opt.next; renderDialogue(); return; }
        if (opt.action === 'close') { closeDialogue(); return; }
        if (opt.action === 'offerQuest') { startQuest(opt.questId); renderDialogue(); return; }
        if (opt.action === 'turnInQuest') { completeQuest(opt.questId); renderDialogue(); return; }
        if (opt.action === 'showQuestDesc') {
            let q = QUEST_DEFS[opt.questId];
            if (q) showGameAlert(`📜 ${q.name}\n\n${q.desc}`);
            return;
        }
    }

    function closeDialogue() {
        let overlay = document.getElementById('dialogue-overlay');
        if (overlay) overlay.classList.remove('active');
        activeDialogueNpc = null;
    }

        if (key === 'forgePeak') return [{ text: "🔨 Commission a Rune ($200)", class: "btn btn-combat", action: commissionRune }];
        if (key === 'mistVeil') return [{ text: "👻 Consult the Spirits ($150)", class: "btn btn-goth", action: consultSpirits }];
        return [];
    }

    // --- OAKHAVEN / DUNE-SPIRE / FORGE-PEAK / MIST-VEIL: lightweight themed actions ---
    function forageHerbs() {
        if ((game.stamina || 0) < 10) { log("❌ Not enough stamina to forage!", "color-red"); return; }
        game.stamina -= 10;
        let herbs = ["Moonleaf Sprig", "Silverroot", "Dew Blossom", "Bitter Fen Moss"];
        let found = herbs[Math.floor(Math.random() * herbs.length)];
        game.inventory.push(found);
        bumpReputation('oakhaven', 2);
        saveGame(); updateUI();
        log(`🌿 You forage beneath the canopy and find: ${found}!`, "color-cyan");
        showSettlementHub('oakhaven');
    }

    function haggleBazaar() {
        if ((game.stamina || 0) < 10) { log("❌ Not enough stamina to haggle!", "color-red"); return; }
        game.stamina -= 10;
        let gained = Math.round(80 + Math.random() * 220);
        game.funds += gained;
        bumpReputation('duneSpire', 2);
        saveGame(); updateUI();
        log(`🏺 You strike a shrewd bargain in the Bazaar and pocket $${gained}.`, "color-cyan");
        showSettlementHub('duneSpire');
    }

    function commissionRune() {
        let cost = 200;
        if (game.funds < cost) { log("❌ Not enough funds to commission a rune!", "color-red"); return; }
        let champion = getChampion();
        if (!champion || !champion.uid) { log("❌ You need a champion in your active party first!", "color-red"); return; }
        game.funds -= cost;
        let gain = Math.floor(4 + Math.random() * 5);
        let member = game.staff.find(s => s.uid === champion.uid);
        if (member) member.power = (member.power || 30) + gain;
        bumpReputation('forgePeak', 2);
        saveGame(); updateUI();
        log(`🔨 High Smith Varek forges a rune into ${champion.name}'s gear! Power +${gain}.`, "color-cyan");
        showSettlementHub('forgePeak');
    }

    function consultSpirits() {
        let cost = 150;
        if (game.funds < cost) { log("❌ Not enough funds for an offering!", "color-red"); return; }
        game.funds -= cost;
        game.stamina = Math.min(100, (game.stamina || 0) + 40);
        bumpReputation('mistVeil', 2);
        saveGame(); updateUI();
        log(`👻 Lady Vespera's spirit wisps swirl around you, and your strength is restored. (+40 Stamina)`, "color-cyan");
        showSettlementHub('mistVeil');
    }

    // --- VIKING HOMESTEAD: Deep Forest woodcutting, construction, guards, raids ---
    function showDeepForestMenu() {
        if (!game.homestead.unlocked) {
            showGameAlert("The Deep Forest belongs to no one yet. Earn Bjargaöldum's trust and claim your land deed first.");

            return;
        }
        playBGM('hq');
        clearConsole("flex-start", "radial-gradient(circle at 50% 30%, #041006 0%, #010402 85%)", "#66ffaa");

            <p style="color:#ffd700; font-size:12px;">🪵 Wood: ${game.resources.wood || 0} | ⚡ Stamina: ${game.stamina || 0}</p>
        `;
        renderButtons([

    function chopWood() {
        if ((game.stamina || 0) < 8) { log("❌ Not enough stamina to chop wood!", "color-red"); showDeepForestMenu(); return; }
        game.stamina -= 8;
        let gained = Math.floor(3 + Math.random() * 4); // 3-6
        game.resources.wood = (game.resources.wood || 0) + gained;
        saveGame(); updateUI();
        log(`🪓 You chop timber and gather ${gained} wood. (${game.resources.wood} total)`, "color-cyan");
        showDeepForestMenu();
    }

    const HOMESTEAD_STRUCTURES = {
        longhouse: { name: "Longhouse / Main Hall", icon: "🏛️", desc: "Increases stamina recovered each Sleep cycle.", baseWoodCost: 20, baseFundsCost: 400 },
        watchtower: { name: "Watchtower", icon: "🗼", desc: "Early warning against bandit raids - softens losses on defeat.", baseWoodCost: 15, baseFundsCost: 300 },
        palisades: { name: "Perimeter Palisades", icon: "🛡️", desc: "Fortifies the settlement - raises guard defense during raids.", baseWoodCost: 25, baseFundsCost: 350 },
        barracks: { name: "Guard Posts / Barracks", icon: "⛺", desc: "Adds an extra guard slot per level.", baseWoodCost: 18, baseFundsCost: 450 }
    };

    function homesteadStructureCost(type) {
        let def = HOMESTEAD_STRUCTURES[type];
        let level = game.homestead.structures[type] || 0;
        return { wood: def.baseWoodCost * (level + 1), funds: def.baseFundsCost * (level + 1) };
    }

    function homesteadGuardSlotCount() {
        return 2 + (game.homestead.structures.barracks || 0);
    }

    function showHomesteadMenu() {
        if (!game.homestead.unlocked) { showGameAlert("You haven't been granted a land deed yet."); showSettlementHub('viking'); return; }
        playBGM('hq');
        clearConsole("flex-start", "radial-gradient(circle at 50% 20%, #0a1a2a 0%, #020608 85%)", "#8fd3ff");
        let html = `
            <h2 style="color:#8fd3ff; font-size:18px;">🏡 YOUR HOMESTEAD</h2>
            <p style="color:#aaa; font-size:12px;">🪵 Wood: ${game.resources.wood || 0} | 💰 Funds: $${Math.floor(game.funds)}</p>
            <div style="width:100%;">
        `;
        Object.keys(HOMESTEAD_STRUCTURES).forEach(type => {
            let def = HOMESTEAD_STRUCTURES[type];
            let level = game.homestead.structures[type] || 0;
            let cost = homesteadStructureCost(type);
            html += `<div class="dex-card" style="display:block; text-align:left;">
                <strong style="color:#8fd3ff;">${def.icon} ${def.name} (Lv. ${level})</strong><br>
                <span style="font-size:11px; color:#aaa;">${def.desc}</span><br>
                <span style="font-size:11px; color:#ffd700;">Upgrade cost: 🪵${cost.wood} + $${cost.funds}</span>
                <button class="btn btn-farm" style="padding:4px 8px; font-size:11px; min-height:26px; margin-top:4px;" onclick="buildHomesteadStructure('${type}')">🔨 ${level === 0 ? 'Build' : 'Upgrade'}</button>
            </div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([
            { text: "🛡️ Guard Roster", class: "btn btn-maid", action: showGuardRosterMenu },
            { text: "🔔 Scout for Raiders", class: "btn btn-combat", action: triggerBanditRaid },
            { text: "🌲 Deep Forest", class: "btn btn-mine", action: showDeepForestMenu },
            { text: "⬅ Back to Fjord", class: "btn btn-back", action: () => showSettlementHub('viking') }
        ]);
    }

    function buildHomesteadStructure(type) {
        if (!HOMESTEAD_STRUCTURES[type]) return;
        let cost = homesteadStructureCost(type);
        if ((game.resources.wood || 0) < cost.wood) { log("❌ Not enough wood!", "color-red"); showHomesteadMenu(); return; }
        if (game.funds < cost.funds) { log("❌ Not enough funds!", "color-red"); showHomesteadMenu(); return; }
        game.resources.wood -= cost.wood;
        game.funds -= cost.funds;
        game.homestead.structures[type] = (game.homestead.structures[type] || 0) + 1;
        bumpReputation('viking', 5);
        saveGame(); updateUI();
        log(`🔨 ${HOMESTEAD_STRUCTURES[type].name} is now level ${game.homestead.structures[type]}!`, "color-cyan");
        showHomesteadMenu();
    }

    function showGuardRosterMenu() {
        playBGM('staff');
        clearConsole("flex-start", "radial-gradient(circle at 50% 20%, #0a1a2a 0%, #020608 85%)", "#8fd3ff");
        let slotCount = homesteadGuardSlotCount();
        let guards = game.homestead.guards || [];
        let html = `
            <h2 style="color:#8fd3ff; font-size:18px;">🛡️ GUARD ROSTER (${guards.length}/${slotCount})</h2>
            <p style="color:#aaa; font-size:12px;">Assign roster members to defend the Homestead from bandit raids.</p>
            <div style="width:100%;">
        `;
        for (let slot = 0; slot < slotCount; slot++) {
            let assignment = guards.find(g => g.slot === slot);
            let member = assignment ? game.staff.find(s => s.uid === assignment.uid) : null;
            html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px;">Slot ${slot + 1}: ${member ? `${member.name} (Pwr ${member.power || 0})${member.fatigued ? ' 😴' : ''}` : 'Empty'}</span>
                ${member ? `<button class="btn btn-back" style="padding:4px 8px; font-size:11px; min-height:26px;" onclick="unassignHomesteadGuard(${slot})">Remove</button>` : `<button class="btn btn-farm" style="padding:4px 8px; font-size:11px; min-height:26px;" onclick="showGuardPicker(${slot})">Assign</button>`}
            </div>`;
        }
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to Homestead", class: "btn btn-back", action: showHomesteadMenu }]);
    }

    function showGuardPicker(slot) {
        clearConsole("flex-start", "radial-gradient(circle at 50% 20%, #0a1a2a 0%, #020608 85%)", "#8fd3ff");
        let assignedUids = (game.homestead.guards || []).map(g => g.uid);
        let available = (game.staff || []).filter(s => !assignedUids.includes(s.uid));
        let html = `<h2 style="color:#8fd3ff; font-size:18px;">Assign Guard - Slot ${slot + 1}</h2><div style="width:100%;">`;
        if (!available.length) html += `<p style="color:#666; font-size:12px;">No available roster members to assign.</p>`;
        available.forEach(s => {
            html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px;">${s.name} (Pwr ${s.power || 0})</span>
                <button class="btn btn-farm" style="padding:4px 8px; font-size:11px; min-height:26px;" onclick="assignHomesteadGuard('${s.uid}', ${slot})">Assign</button>
            </div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Cancel", class: "btn btn-back", action: showGuardRosterMenu }]);
    }

    function assignHomesteadGuard(characterId, slot) {
        if (!game.staff.find(s => s.uid === characterId)) { showGuardRosterMenu(); return; }
        if (!Array.isArray(game.homestead.guards)) game.homestead.guards = [];
        let slotCount = homesteadGuardSlotCount();
        if (slot < 0 || slot >= slotCount) { showGuardRosterMenu(); return; }
        game.homestead.guards = game.homestead.guards.filter(g => g.slot !== slot && g.uid !== characterId);
        game.homestead.guards.push({ uid: characterId, slot: slot });
        saveGame(); updateUI();
        showGuardRosterMenu();
    }

    function unassignHomesteadGuard(slot) {
        game.homestead.guards = (game.homestead.guards || []).filter(g => g.slot !== slot);
        saveGame(); updateUI();
        showGuardRosterMenu();
    }

    // Resolves an immediate bandit assault using the same mitigation formula the raid
    // boss retaliation uses (computeMitigatedDamage) - assigned guards' total power is
    // the settlement's offense, palisades level is its defense.
    function triggerBanditRaid() {
        if (!game.homestead.unlocked) { showSettlementHub('viking'); return; }
        let guards = (game.homestead.guards || [])
            .map(g => Object.assign({}, g, { member: game.staff.find(s => s.uid === g.uid) }))
            .filter(g => g.member && !g.member.fatigued);

        if (!guards.length) {
            showGameAlert("🔔 No rested guards are standing watch! Assign roster members to your Guard Roster before scouting for raiders.");
            return;
        }

        let guardPower = guards.reduce((sum, g) => sum + (g.member.power || 0), 0);
        let palisadesLevel = game.homestead.structures.palisades || 0;
        let watchtowerLevel = game.homestead.structures.watchtower || 0;
        let defense = palisadesLevel * 15;

        // Bandit strength scales gently with how far into the game the player is.
        let banditAttack = 60 + (game.day || 1) * 3;
        let mitigatedThreat = computeMitigatedDamage(banditAttack, defense, 0.1);
        let victory = guardPower >= mitigatedThreat;

        clearConsole("center", "radial-gradient(circle at 50% 30%, #2a0a0a 0%, #080202 85%)", "#ff6666");
        if (victory) {
            let salvage = Math.round(150 + Math.random() * 250 + palisadesLevel * 20);
            game.funds += salvage;
            bumpReputation('viking', 8);
            saveGame(); updateUI();
            document.getElementById("console").innerHTML = `
                <div style="font-size:40px;">⚔️</div>
                <h2 style="color:#66ff99; font-size:18px;">RAID REPELLED!</h2>
                <p style="color:#fff; font-size:12px;">Your guards (combined power ${guardPower}) drove off a bandit warband! Salvage recovered: $${salvage}.</p>
            `;
        } else {
            let repairCost = Math.round(80 + Math.random() * 120);
            game.funds = Math.max(0, game.funds - repairCost);
            // A watchtower softens the blow - higher levels spare more guards from fatigue.
            let fatigueSpared = Math.min(guards.length, watchtowerLevel);
            guards.forEach((g, idx) => { if (idx >= fatigueSpared) g.member.fatigued = true; });
            saveGame(); updateUI();
            document.getElementById("console").innerHTML = `
                <div style="font-size:40px;">💥</div>
                <h2 style="color:#ff6666; font-size:18px;">HOMESTEAD RAIDED!</h2>
                <p style="color:#fff; font-size:12px;">Your guards (combined power ${guardPower}) couldn't fully hold the line. Bandits looted before fleeing - minor repairs cost $${repairCost}, and some guards are now fatigued (they'll recover after your next Sleep cycle).</p>
            `;
        }
        renderButtons([{ text: "✔ Return to Homestead", class: "btn btn-start", action: showHomesteadMenu }]);
    }

    // Deterministic (not random) so the same character always gets the same badge.
    function hashTypeForName(name) {
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return TYPE_ICON_LIST[h % TYPE_ICON_LIST.length];
    }

    let _typeByNameIndex = null;
    let _typeByNameIndexDbSize = -1;
    function buildTypeByNameIndex() {
        let idx = {};
        (REAL_CHARACTERS_DB || []).forEach(c => { if (c.type && c.name) idx[c.name.toLowerCase()] = c.type; });
        Object.values(PORTAL_CHAR_POOLS || {}).forEach(pool => {
            pool.forEach(c => { if (c.type && c.name) idx[c.name.toLowerCase()] = c.type; });
        });
        return idx;
    }

    function resolveCharacterType(name) {
        if (!name) return 'Normal';
        // REAL_CHARACTERS_DB loads async, so rebuild the index once it actually has data.
        if (!_typeByNameIndex || _typeByNameIndexDbSize !== REAL_CHARACTERS_DB.length) {
            _typeByNameIndex = buildTypeByNameIndex();
            _typeByNameIndexDbSize = REAL_CHARACTERS_DB.length;
        }
        return _typeByNameIndex[String(name).toLowerCase()] || hashTypeForName(String(name));
    }

    // Wired into onerror for every catchable-character <img> - swaps a missing/broken
    // photo for that character's type badge instead of leaving a blank box.
    function applyTypeIconFallback(imgEl, name) {
        imgEl.onerror = null;
        imgEl.src = typeIconDataUri(resolveCharacterType(name));
        imgEl.style.objectFit = 'cover';
        imgEl.style.background = '#111';
    }

    function escAttr(str) {
        return String(str == null ? '' : str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // Same visual treatment as portrait(), but falls back to the type badge on error
    // instead of hiding the image - use this for anything caught in the UniDex.
    function characterPortrait(name, maxHeight = 190) {
        let src = getCharacterPortrait(name);
        return `<img src="${src}" alt="${name}" style="max-height: ${maxHeight}px; max-width: 90%; object-fit: contain; margin-bottom: 8px; border-radius: 8px; border: 2px solid #00ffff; background: #0d0d0d; box-shadow: 0 0 15px rgba(0,255,255,0.3);" onerror="applyTypeIconFallback(this, '${escAttr(name)}')" />`;
    }

    // --- UNIQUE EVOLUTION ---
    // Deterministic-but-distinctive title per character name (same input always yields
    // the same evolved form) so every player's evolved copy of a given character matches.
    function getEvolvedName(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
        let title = EVOLUTION_TITLES[hash % EVOLUTION_TITLES.length];
        return `${title} ${name}`;
    }

    // Unlocked once a character's been caught EVOLUTION_THRESHOLD times (tracked via the
    // existing dex duplicate-catch counter). Evolves one un-evolved roster copy in place:
    // renames it to its unique evolved form and boosts its power. Free (the duplicate
    // catches themselves are the cost), one-time per dex entry.
    function evolveCharacter(dexId, returnPage = 1, returnQuery = "", returnPortal = "") {
        let dexEntry = game.pokedex && game.pokedex[String(dexId)];
        if (!dexEntry || (dexEntry.count || 0) < EVOLUTION_THRESHOLD || dexEntry.evolved) {
            showDexEntryDetail(dexId, returnPage, returnQuery, returnPortal);
            return;
        }
        let candidate = game.staff.find(s => s.dexId === dexId && !s.isEvolved);
        if (!candidate) {
            log("❌ You need an un-evolved copy of this character in your roster to evolve it!", "color-red");
            showDexEntryDetail(dexId, returnPage, returnQuery, returnPortal);
            return;
        }
        let oldName = candidate.name;
        let newName = getEvolvedName(candidate.baseName || oldName);
        candidate.baseName = candidate.baseName || oldName;
        candidate.name = newName;
        candidate.power = Math.round((candidate.power || 30) * 1.5);
        candidate.isEvolved = true;
        dexEntry.evolved = true;
        dexEntry.evolvedName = newName;
        bumpLifetimeStat('totalEvolutions');
        bumpDailyProgress('evolutions');
        saveGame(); updateUI();
        showEvolutionAnimation(oldName, newName, () => showDexEntryDetail(dexId, returnPage, returnQuery, returnPortal));
    }

    function showEvolutionAnimation(oldName, newName, onDone) {

        overlay.className = "evolution-overlay";

        setTimeout(() => {

            if (onDone) onDone();
        }, 2200);
    }

    // --- CHAMPION & ACTIVE PARTY (max 6, Pokémon-style) ---
    const MAX_PARTY_SIZE = 6;

    function generateUid() {
        return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // Backfills uids on older saves, keeps game.partyUids/game.championUid pointing at
    // real roster members, and auto-populates the party from the roster the very first
    // time a save from before the party system existed gets loaded.
    function ensurePartySystem() {
        if (!game.staff) game.staff = [];
        game.staff.forEach(s => { if (!s.uid) s.uid = generateUid(); });
        if (!Array.isArray(game.partyUids)) game.partyUids = [];
        game.partyUids = game.partyUids.filter(uid => game.staff.some(s => s.uid === uid));
        if (game.partyUids.length === 0 && game.staff.length > 0) {
            game.partyUids = game.staff.slice(0, MAX_PARTY_SIZE).map(s => s.uid);
        }
        if (!game.championUid || !game.partyUids.includes(game.championUid)) {
            game.championUid = game.partyUids[0] || null;
        }
    }

    function getActiveParty() {
        ensurePartySystem();
        return game.partyUids.map(uid => game.staff.find(s => s.uid === uid)).filter(Boolean);
    }

    function getReserve() {
        ensurePartySystem();
        return game.staff.filter(s => !game.partyUids.includes(s.uid));
    }

    function getChampion() {
        ensurePartySystem();
        if (game.championUid) {
            let c = game.staff.find(s => s.uid === game.championUid);
            if (c) return c;
        }
        let party = getActiveParty();
        return party.length ? party[0] : { name: "Trainer Partner", power: 35, uid: null };
    }

    // Snapshot of the active party for one battle: champion fights first, everyone
    // starts at full HP for this encounter.
    function buildCombatParty() {
        let champion = getChampion();
        let party = getActiveParty();
        if (!party.length) party = [champion];
        let ordered = [champion, ...party.filter(p => p.uid !== champion.uid)];
        return ordered.map(p => ({ uid: p.uid, name: p.name, power: p.power || 30, hp: 100, maxHp: 100 }));
    }

    // Adds a newly recruited/traded-in character to the roster, auto-slotting them into
    // the active party if there's room (<6), otherwise they land in the reserve/PC box.
    function addStaffMember(memberData) {
        if (!game.staff) game.staff = [];
        if (!Array.isArray(game.partyUids)) game.partyUids = [];
        let member = Object.assign({ uid: generateUid() }, memberData);
        game.staff.push(member);
        if (game.partyUids.length < MAX_PARTY_SIZE) game.partyUids.push(member.uid);
        if (!game.championUid) game.championUid = member.uid;
        return member;
    }

    // --- AETHERIA BLACKJACK (21 vs the dealer) ---
    const CARD_RANKS = [
        { rank: 'A', value: 11 }, { rank: '2', value: 2 }, { rank: '3', value: 3 }, { rank: '4', value: 4 },
        { rank: '5', value: 5 }, { rank: '6', value: 6 }, { rank: '7', value: 7 }, { rank: '8', value: 8 },
        { rank: '9', value: 9 }, { rank: '10', value: 10 }, { rank: 'J', value: 10 }, { rank: 'Q', value: 10 }, { rank: 'K', value: 10 }
    ];
    const CARD_SUITS = ['♠️', '♥️', '♦️', '♣️'];

    function drawCard() {
        let r = CARD_RANKS[Math.floor(Math.random() * CARD_RANKS.length)];
        let s = CARD_SUITS[Math.floor(Math.random() * CARD_SUITS.length)];
        return { rank: r.rank, value: r.value, suit: s };
    }

    function handTotal(cards) {
        let total = cards.reduce((sum, c) => sum + c.value, 0);
        let aces = cards.filter(c => c.rank === 'A').length;
        while (total > 21 && aces > 0) { total -= 10; aces--; }
        return total;
    }

    function cardLabel(c) { return `${c.rank}${c.suit}`; }

    let blackjackState = null; // { bet, playerCards, dealerCards }

    function showBlackjackScreen(message = "") {
        playBGM('shop');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #002211 0%, #000805 85%)", "#00ff66");
        document.getElementById("console").innerHTML = `

            <p style="color:#aaa; font-size:12px; max-width:360px;">Beat the dealer's hand without going over 21. A natural Blackjack pays 2.5x!</p>
            <p style="color:#ffd700; font-size:12px;">💰 Funds: $${Math.floor(game.funds)}</p>
            ${message ? `<p style="font-size:12px; margin-top:6px;">${message}</p>` : ''}
        `;
