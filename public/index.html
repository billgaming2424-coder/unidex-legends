    function startBlackjackHand(amount) {
        if (amount <= 0 || game.funds < amount) {
            showBlackjackScreen(`<span style="color:#ff6666;">❌ Not enough funds for that bet!</span>`);
            return;
        }
        game.funds -= amount;
        blackjackState = { bet: amount, playerCards: [drawCard(), drawCard()], dealerCards: [drawCard(), drawCard()] };
        updateUI(); saveGame();

        if (handTotal(blackjackState.playerCards) === 21) {
            standBlackjack(); // natural blackjack - auto-resolve against the dealer's hand
        } else {
            renderBlackjackTable();
        }
    }

    function renderBlackjackTable(revealDealer = false, message = "") {
        clearConsole("center", "radial-gradient(circle at 50% 30%, #002211 0%, #000805 85%)", "#00ff66");
        let b = blackjackState;
        let playerTotal = handTotal(b.playerCards);
        let dealerShown = revealDealer ? b.dealerCards : [b.dealerCards[0]];
        let dealerTotal = revealDealer ? handTotal(b.dealerCards) : '?';
        document.getElementById("console").innerHTML = `
            <h2 style="color:#00ff66; font-size:18px;">🃏 BLACKJACK TABLE</h2>
            <p style="color:#ff6666; font-size:13px;">Dealer: ${dealerShown.map(cardLabel).join(' ')}${revealDealer ? '' : ' 🂠'} (${dealerTotal})</p>
            <p style="color:#00ffff; font-size:13px;">You: ${b.playerCards.map(cardLabel).join(' ')} (${playerTotal})</p>
            <p style="color:#ffd700; font-size:12px;">💵 Bet: $${b.bet}</p>
            ${message ? `<p style="font-size:12px; margin-top:6px;">${message}</p>` : ''}
        `;
        if (!revealDealer) {
            renderButtons([
                { text: "🃏 Hit", class: "btn btn-combat", action: hitBlackjack },
                { text: "✋ Stand", class: "btn btn-start", action: standBlackjack }
            ]);
        } else {
            renderButtons([
                { text: "🔁 Play Again", class: "btn btn-combat", action: () => showBlackjackScreen() },
                { text: "⬅ Back to Casino", class: "btn btn-back", action: showCasinoMenu }
            ]);
        }
    }

    function hitBlackjack() {
        if (!blackjackState) { showBlackjackScreen(); return; }
        blackjackState.playerCards.push(drawCard());
        if (handTotal(blackjackState.playerCards) > 21) {
            finishBlackjackHand(`<strong style="color:#ff6666;">💥 BUST! You went over 21 and lost $${blackjackState.bet}.</strong>`);
        } else {
            renderBlackjackTable(false);
        }
    }

    function standBlackjack() {
        if (!blackjackState) { showBlackjackScreen(); return; }
        let b = blackjackState;
        while (handTotal(b.dealerCards) < 17) {
            b.dealerCards.push(drawCard());
        }
        let playerTotal = handTotal(b.playerCards);
        let dealerTotal = handTotal(b.dealerCards);

        if (playerTotal > 21) {
            finishBlackjackHand(`<strong style="color:#ff6666;">💥 BUST! You lost $${b.bet}.</strong>`);
        } else if (dealerTotal > 21 || playerTotal > dealerTotal) {
            let isNaturalBlackjack = b.playerCards.length === 2 && playerTotal === 21;
            let payout = isNaturalBlackjack ? Math.floor(b.bet * 2.5) : b.bet * 2;
            game.funds += payout;
            finishBlackjackHand(`<strong style="color:#55ff99;">🎉 ${isNaturalBlackjack ? 'BLACKJACK! ' : ''}You win $${payout}!</strong>`);
        } else if (playerTotal === dealerTotal) {
            game.funds += b.bet;
            finishBlackjackHand(`<strong style="color:#ffd700;">🤝 Push! Your bet was returned.</strong>`);
        } else {
            finishBlackjackHand(`<strong style="color:#ff6666;">💥 Dealer wins. You lost $${b.bet}.</strong>`);
        }
    }

    function finishBlackjackHand(message) {
        updateUI(); saveGame();
        renderBlackjackTable(true, message);
        blackjackState = null;
    }

    function pickWeightedWheelPrize() {
        let totalWeight = WHEEL_PRIZES.reduce((sum, p) => sum + p.weight, 0);
        let roll = Math.random() * totalWeight;
        for (const prize of WHEEL_PRIZES) {
            if (roll < prize.weight) return prize;
            roll -= prize.weight;
        }
        return WHEEL_PRIZES[0];
    }

    // Pool for wheel "companion" jackpot pulls - every portal pool except the Mystery-Gift-only legendary one.
    function getWheelCompanionPool() {
        let pool = [];
        Object.keys(PORTAL_CHAR_POOLS).forEach(key => {
            if (key === 'legendary') return;
            pool = pool.concat(PORTAL_CHAR_POOLS[key]);
        });
        return pool;
    }

    function grantRandomWheelCompanion() {
        let pool = getWheelCompanionPool();
        if (!pool.length) return "";
        let chosen = pool[Math.floor(Math.random() * pool.length)];
        addStaffMember({ name: chosen.name, power: chosen.power || rollEncounterPower(), origin: chosen.origin, dexId: chosen.id });
        recordDex(chosen.id, false);
        return chosen.name;
    }

    function triggerWheelSpin() {
        let usingFreeSpin = (game.freeSpins || 0) > 0;
        if (!usingFreeSpin && game.funds < 100) {
            log("❌ You need at least $100 to spin!", "color-red");
            return;

        updateUI(); saveGame();

        renderButtons([]);
        const iconBefore = document.getElementById("wheel-icon");
        const resTextBefore = document.getElementById("wheel-result");
        if (iconBefore) iconBefore.className = "wheel-spinning";
        if (resTextBefore) resTextBefore.innerHTML = usingFreeSpin ? "Spinning the multiversal wheel (Free Spin)..." : "Spinning the multiversal wheel...";

        setTimeout(() => {
            let roll = pickWeightedWheelPrize();
            let detail = roll.action();
            let displayText = (typeof detail === 'string' && detail) ? `${roll.text} (${detail})` : roll.text;
            updateUI(); saveGame();

            // Re-query fresh rather than reuse the references captured before the timeout -
            // roll.action() can unlock an achievement, whose log() does #console.innerHTML +=,
            // which recreates the whole subtree and orphans any previously-grabbed node refs.
            const iconNow = document.getElementById("wheel-icon");
            if (iconNow) iconNow.className = "";
            const resTextNow = document.getElementById("wheel-result");
            if (resTextNow) resTextNow.innerHTML = `<strong style="color: #00ff66;">🎉 ${displayText}</strong>`;
            let freeSpinsNow = game.freeSpins || 0;
            renderButtons([

    function plantSeed(plotIndex, cropKey) {
        ensureFarmDefaults();
        if ((game.farm.seeds[cropKey] || 0) <= 0) { showPlantPicker(plotIndex); return; }
        let plot = game.farm.plots[plotIndex];
        if (!plot || plot.crop) { showCropPlotsMenu(); return; }
        game.farm.seeds[cropKey]--;
        plot.crop = cropKey;
        plot.daysLeft = CROP_CATALOG[cropKey].growDays;
        plot.watered = false;
        saveGame(); updateUI();
        showCropPlotsMenu();
    }

        plot.watered = true;
        saveGame(); updateUI();

    function harvestPlot(plotIndex) {
        ensureFarmDefaults();
        let plot = game.farm.plots[plotIndex];
        if (!plot || !plot.crop || plot.daysLeft > 0) { showCropPlotsMenu(); return; }
        let cropKey = plot.crop;
        game.farm.harvested[cropKey] = (game.farm.harvested[cropKey] || 0) + 1;
        plot.crop = null; plot.daysLeft = 0; plot.watered = false;

                html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:12px;">${def.productEmoji} ${def.product} x${owned} ($${def.sellPrice} each)</span>
                    <button class="btn btn-start" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="sellAnimalProduct('${def.product}', ${def.sellPrice})">💰 Sell All</button>
                </div>`;
            }
        });
        if (!anySellable) html += `<p style="color:#888; font-size:12px;">Nothing to sell yet - grow some crops or raise animals!</p>`;
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to Farm", class: "btn btn-back", action: showFarmMenu }]);
    }

    function sellCrop(cropKey) {
        ensureFarmDefaults();
        let def = CROP_CATALOG[cropKey];
        let owned = game.farm.harvested[cropKey] || 0;
        if (!def || owned <= 0) { showSellProduceMenu(); return; }
        game.funds += owned * def.sellPrice;
        game.farm.harvested[cropKey] = 0;
        saveGame(); updateUI();
        showSellProduceMenu();
    }

    function sellAnimalProduct(productName, price) {
        ensureFarmDefaults();
        let owned = game.farm.animalProducts[productName] || 0;
        if (owned <= 0) { showSellProduceMenu(); return; }
        game.funds += owned * price;
        game.farm.animalProducts[productName] = 0;
        saveGame(); updateUI();
        showSellProduceMenu();
    }

    // --- STAFF ROSTER & INTERACTIONS ---
    function staffCardHtml(s, extraButtonsHtml) {
        let isChampion = game.championUid && s.uid === game.championUid;
        let costumeDef = s.costume ? getCostumeDef(s.costume) : null;
        return `
            <div class="dex-card" style="display:flex; justify-content:space-between; align-items:center; ${isChampion ? 'border-color:#ffd700; box-shadow:0 0 8px rgba(255,215,0,0.35);' : ''}">
                <div style="display:flex; align-items:center; gap:8px;">
                    <img src="${getCharacterPortrait(s.name)}" style="width:34px;height:34px;object-fit:contain;border-radius:6px;border:1px solid #a020f0;" onerror="applyTypeIconFallback(this, '${escAttr(s.name)}')"/>
                    <div style="font-size:12px;">
                        <strong>${isChampion ? '👑 ' : ''}${s.name}${s.shiny ? ' ✨' : ''}${s.isEvolved ? ' 🌟' : ''}${costumeDef ? ` ${costumeDef.emoji}` : ''}</strong><br>
                        <span style="font-size:10.5px;color:#aaa;">Origin: ${s.origin || 'Unknown'} | Power: ${s.power || 0}${costumeDef ? ` | 🎭 ${costumeDef.name}` : ''}</span>
                    </div>
                </div>
                <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;">
                    ${extraButtonsHtml}
                    <button class="btn btn-maid" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="interactWithStaff('${s.uid}')">💬 Talk</button>
                    <button class="btn btn-back" style="padding:3px 8px; font-size:11px; min-height:28px; border-color:#ff3333; color:#ff6666;" onclick="confirmReleaseStaff('${s.uid}')">🗑️ Release</button>
                </div>
            </div>
        `;
    }

    function showStaffMenu() {
        playBGM('staff');
        clearConsole("flex-start", "radial-gradient(circle at 50% 25%, #2b005c 0%, #0c001a 80%)", "#a020f0");
        ensurePartySystem();
        let party = getActiveParty();
        let reserve = getReserve();
        let html = `<h2 style="color:#a020f0; font-size:18px;">⚔️ STAFF ROSTER & INTERACTIONS</h2><div style="width:100%;">`;

        if (!game.staff.length) {
            html += `<p style="color:#aaa; font-size:12px;">No staff recruited yet.</p>`;
        } else {
            html += `<p style="color:#ffd700; font-size:11.5px; margin:6px 0 3px 0;">⭐ ACTIVE PARTY (${party.length}/${MAX_PARTY_SIZE})</p>`;
            party.forEach((s) => {
                let isChampion = game.championUid === s.uid;
                let extra = `
                    ${!isChampion ? `<button class="btn btn-start" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="setChampion('${s.uid}')">👑 Champion</button>` : ''}
                    ${party.length > 1 ? `<button class="btn btn-sys" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="benchPartyMember('${s.uid}')">➖ Bench</button>` : ''}
                `;
                html += staffCardHtml(s, extra);
            });

            html += `<p style="color:#66ccff; font-size:11.5px; margin:10px 0 3px 0;">📦 RESERVE (PC BOX) (${reserve.length})</p>`;
            if (!reserve.length) {
                html += `<p style="color:#888; font-size:11.5px;">Nobody in reserve right now.</p>`;
            } else {
                reserve.forEach((s) => {
                    let extra = `<button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="addToParty('${s.uid}')">➕ Add to Party</button>`;
                    html += staffCardHtml(s, extra);
                });
            }
        }
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function setChampion(uid) {
        let member = game.staff.find(s => s.uid === uid);
        if (!member) return;
        // Champion must be an active party member - promoting from reserve pulls them in
        // first (swapping out the CURRENT CHAMPION's own slot if the party's already
        // full - previously this bumped whoever happened to sit in slot 0, which could
        // silently bench an unrelated party member instead of the champion you're replacing).
        if (!game.partyUids.includes(uid)) {
            if (game.partyUids.length >= MAX_PARTY_SIZE) {
                let champIdx = game.partyUids.indexOf(game.championUid);
                game.partyUids[champIdx !== -1 ? champIdx : 0] = uid;
            } else {
                game.partyUids.push(uid);
            }
        }
        game.championUid = uid;
        saveGame(); updateUI();
        showStaffMenu();
    }

    function benchPartyMember(uid) {
        if (game.partyUids.length <= 1) {
            showGameAlert("You need at least one active party member!");
            return;
        }
        game.partyUids = game.partyUids.filter(u => u !== uid);
        if (game.championUid === uid) game.championUid = game.partyUids[0] || null;
        saveGame(); updateUI();
        showStaffMenu();
    }

    function addToParty(uid) {
        if (!game.staff.some(s => s.uid === uid)) return;
        if (game.partyUids.includes(uid)) { showStaffMenu(); return; }
        if (game.partyUids.length >= MAX_PARTY_SIZE) {
            showPartySwapPicker(uid);
            return;
        }
        game.partyUids.push(uid);
        if (!game.championUid) game.championUid = uid;
        saveGame(); updateUI();
        showStaffMenu();
    }

    // Party's full (6/6) - let the player pick who gets benched to make room.
    function showPartySwapPicker(incomingUid) {
        let incoming = game.staff.find(s => s.uid === incomingUid);
        if (!incoming) { showStaffMenu(); return; }
        playBGM('staff');
        clearConsole("flex-start", "radial-gradient(circle at 50% 25%, #2b005c 0%, #0c001a 80%)", "#a020f0");
        let html = `<h2 style="color:#a020f0; font-size:16px;">Party's full! Bench someone to make room for ${incoming.name}:</h2><div style="width:100%;">`;
        getActiveParty().forEach((s) => {
            html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center;">
                <span>${game.championUid === s.uid ? '👑 ' : ''}${s.name} (Pwr ${s.power || 0})</span>
                <button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="swapIntoParty('${incomingUid}', '${s.uid}')">Swap In ${incoming.name}</button>
            </div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Cancel", class: "btn btn-back", action: showStaffMenu }]);
    }

    function swapIntoParty(incomingUid, outgoingUid) {
        let idx = game.partyUids.indexOf(outgoingUid);
        if (idx === -1) { showStaffMenu(); return; }
        game.partyUids[idx] = incomingUid;
        if (game.championUid === outgoingUid) game.championUid = incomingUid;
        saveGame(); updateUI();
        showStaffMenu();
    }

    // Lets a player release a staff member they've caught (typically an extra copy of
    // someone they already have) back into the multiverse, freeing up the roster.
    function confirmReleaseStaff(uid) {
        let member = game.staff.find(s => s.uid === uid);
        if (!member) return;
        if (game.staff.length <= 1) {
            showGameAlert("You need at least one team member! Recruit another before releasing this one.");
            return;
        }
        playBGM('staff');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #2b005c 0%, #0c001a 80%)", "#ff3333");
        document.getElementById("console").innerHTML = `
            ${characterPortrait(member.name, 160)}
            <p style="color: #ffff00; font-size: 13px; line-height: 1.45; max-width: 400px;">
                👴 <strong>[Professor Bill]:</strong> "You want to release <strong>${member.name}</strong> back into the multiverse? This can't be undone!"
            </p>
        `;
        renderButtons([
            { text: "✔ Yes, release them", class: "btn btn-back", action: () => releaseStaffMember(uid) },
            { text: "❌ Nevermind", class: "btn btn-start", action: showStaffMenu }
        ]);
    }

    function releaseStaffMember(uid) {
        let idx = game.staff.findIndex(s => s.uid === uid);
        if (idx === -1) { showStaffMenu(); return; }
        let member = game.staff[idx];
        game.staff.splice(idx, 1);
        game.partyUids = game.partyUids.filter(u => u !== uid);
        if (game.championUid === uid) game.championUid = null;

        // Releasing removes them from your active roster, but keeps the UniDex entry
        // discovered (just like a real Pokédex) - only the extra "count" goes down.
        if (member.dexId != null && game.pokedex && game.pokedex[String(member.dexId)]) {
            let entry = game.pokedex[String(member.dexId)];
            entry.count = Math.max(0, (entry.count || 1) - 1);
        }

        game.funds += 50;
        saveGame(); updateUI();
        showGameAlert(`👋 Released ${member.name} back into the multiverse. (+$50)`);
        showStaffMenu();
    }

    // Gifting scales up per character: the Nth gift to a given member costs more than
    // the last (100, 250, 550, 1000...), so a couple of cheap boosts stay easy but
    // maxing one character out purely by spamming cash takes real grinding instead.
    function giftCostFor(member) {
        let n = member.giftsGiven || 0;
        return 100 + 75 * n * (n + 1);
    }

    function interactWithStaff(uid) {
        let member = game.staff.find(s => s.uid === uid);
        if (!member) return;
        playBGM('staff');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #2b005c 0%, #0c001a 80%)", "#a020f0");
        let cost = giftCostFor(member);
        document.getElementById("console").innerHTML = `
            ${characterPortrait(member.name, 160)}
            <h3 style="color:#ff66ff; font-size:16px;">💬 Chat with ${member.name}</h3>
            <p style="color:#ffff00; font-size:12.5px; max-width:380px; line-height:1.4;">
                "Hey trainer ${game.playerName}! Thanks for having me along across timelines in Aetheria. Let's keep pushing our limits!"
            </p>
            ${member.giftsGiven ? `<p style="color:#aa88ff; font-size:11px;">Gifted ${member.giftsGiven}x already - the next one costs more.</p>` : ''}
        `;
        renderButtons([
            { text: `💖 Give Gift ($${cost})`, class: "btn btn-start", action: () => {
                let liveCost = giftCostFor(member);
                if (game.funds >= liveCost) {
                    game.funds -= liveCost;
                    member.power = (member.power || 20) + 5;
                    member.giftsGiven = (member.giftsGiven || 0) + 1;
                    saveGame(); updateUI();
                    showGameAlert(`${member.name} smiles warmly! Power increased by +5! (Next gift: $${giftCostFor(member)})`);
                } else { showGameAlert(`Not enough funds - this gift costs $${liveCost}!`); }
                showStaffMenu();

        ]);
    }

    // Shared random-pick logic used for a fresh encounter AND for rerolling one, so a
    // reroll always redraws from the exact same source (portal pool or the wild UniDex).
    function drawEncounterFromSource(poolKey, isWild) {
        if (isWild) {
            if (!REAL_CHARACTERS_DB || REAL_CHARACTERS_DB.length === 0) return null;
            let chosen = REAL_CHARACTERS_DB[Math.floor(Math.random() * REAL_CHARACTERS_DB.length)];
            return { name: chosen.name, origin: chosen.origin, power: rollEncounterPower(), dexId: chosen.id, baseChance: 0.50, isShiny: Math.random() < SHINY_CHANCE, poolKey: null, isWild: true };
        }
        let pool = PORTAL_CHAR_POOLS[poolKey] || PORTAL_CHAR_POOLS.standard;
        let chosen = pool[Math.floor(Math.random() * pool.length)];
        return { name: chosen.name, origin: chosen.origin, power: rollEncounterPower(), dexId: chosen.id, baseChance: 0.50, isShiny: Math.random() < SHINY_CHANCE, poolKey: poolKey, isWild: false };
    }

    function triggerPortalTheme(poolKey, musicKey) {
        playBGM(musicKey || 'rift');
        let costumeDef = COSTUME_CATALOG[poolKey];
        if (costumeDef && Math.random() < COSTUME_DROP_CHANCE) {
            grantCostume(costumeDef);
            return;
        }
        encounterRerollCount = 0;
        activeEncounter = drawEncounterFromSource(poolKey, false);
        renderEncounterScreen();
    }

    // Pulls a random character straight from the 2000-strong UniDex roster (characters.json)
    // so that entries #1-2000 are actually reachable in gameplay, not just listed in the dex.
    function spawnWildUniDexEncounter() {
        if (!REAL_CHARACTERS_DB || REAL_CHARACTERS_DB.length === 0) { showMainMenu(); return; }
        encounterRerollCount = 0;
        activeEncounter = drawEncounterFromSource(null, true);
        renderEncounterScreen();
    }

    // Escalates each consecutive reroll on the SAME encounter; resets to base cost the
    // moment a fresh encounter is triggered (see encounterRerollCount resets above).
    function getRerollCost() {
        return REROLL_BASE_COST + encounterRerollCount * REROLL_INCREMENT;
    }

    // Costs escalating cash (never free) and redraws from the same source pool as the
    // current encounter, with a short spin/flash animation on the portrait.
    function rerollEncounter() {
        if (!activeEncounter) return;
        let cost = getRerollCost();
        if ((game.funds || 0) < cost) {
            let statusEl = document.getElementById("capture-status");
            if (statusEl) statusEl.innerHTML = `<strong style="color:#ff6666;">💸 Not enough funds to reroll! Need $${cost}.</strong>`;
            return;
        }
        game.funds -= cost;
        encounterRerollCount++;
        bumpLifetimeStat('totalRerolls');
        bumpDailyProgress('rerolls');
        updateUI(); saveGame();

        renderButtons([]);
        let wrap = document.getElementById("encounter-portrait-wrap");
        if (wrap) wrap.classList.add("reroll-spin");
        let statusEl = document.getElementById("capture-status");
        if (statusEl) statusEl.innerText = "🌀 Rerolling the portal...";

        setTimeout(() => {
            let redrawn = drawEncounterFromSource(activeEncounter.poolKey, activeEncounter.isWild);
            if (redrawn) activeEncounter = redrawn;
            renderEncounterScreen();
        }, 650);
    }

    function renderEncounterScreen() {
        clearConsole("center", "radial-gradient(circle at 50% 50%, #4d004d 0%, #1a001a 80%)", "#ff00ff");
        let ballTypes = getAvailableBallTypes();
        let portraitHtml = characterPortrait(activeEncounter.name, 120);
        let rerollCost = getRerollCost();
        document.getElementById("console").innerHTML = `

    function processPortalCatch(ballType) {
        if (!ballType || countOwnedBalls(ballType) <= 0) { renderEncounterScreen(); return; }
        consumeBall(ballType);
        updateUI(); saveGame();

        renderButtons([]);
        const statusEl = document.getElementById("capture-status");
        const ballEl = document.querySelector(".pokeball-sprite");
        if (ballEl) ballEl.classList.add("capturing");
        if (statusEl) statusEl.innerText = `The ball is shaking...`;

        let bonus = BALL_CATCH_BONUS[ballType] || 0;
        let isGuaranteed = ballType === "Master Ball";
        let chance = isGuaranteed ? 1 : Math.min(0.95, (activeEncounter.baseChance || 0.5) + bonus);
        let success = Math.random() < chance;

        setTimeout(() => {
            if (ballEl) ballEl.classList.remove("capturing");
            let shinyTag = activeEncounter.isShiny ? " ✨SHINY✨" : "";
            if (success) {
                addStaffMember({ name: activeEncounter.name, power: activeEncounter.power, origin: activeEncounter.origin, dexId: activeEncounter.dexId, shiny: activeEncounter.isShiny || false });
                recordDex(activeEncounter.dexId, activeEncounter.isShiny || false);
                saveGame(); updateUI();
                if (statusEl) statusEl.innerHTML = `<strong style="color:#55ff99;">🎉 CAPTURED ${activeEncounter.name}${shinyTag}!</strong>`;
            } else {
                if (statusEl) statusEl.innerHTML = `<strong style="color:#ff6666;">💥 Oh no! ${activeEncounter.name}${shinyTag} broke free!</strong>`;
            }
            renderButtons([{ text: "✔ Return to HQ", class: "btn btn-start", action: showMainMenu }]);
        }, 2200);
    }

        let amount = input ? parseInt(input.value, 10) : NaN;
        if (!amount || amount <= 0) return;
        if (amount > (game.funds || 0)) { showGameAlert("You don't have that much cash!"); return; }
        sendTradeOffer(partnerIdx, 'cash', amount);
    }

    function sendTradeOffer(partnerIdx, kind, payload) {
        let partner = currentTradePartners[partnerIdx];
        if (!partner || !socket) return;
        let offerPayload;
        if (kind === 'item') {
            pendingOutgoingTrade = { targetId: partner.id, targetName: partner.name, kind, item: payload };
            offerPayload = { item: payload };
        } else if (kind === 'cash') {
            pendingOutgoingTrade = { targetId: partner.id, targetName: partner.name, kind, cash: payload };
            offerPayload = { cash: payload };
        } else {
            let member = game.staff.find(s => s.uid === payload);
            if (!member) return;
            if (game.staff.length <= 1) { showGameAlert("You need at least one team member!"); return; }
            pendingOutgoingTrade = { targetId: partner.id, targetName: partner.name, kind, character: member, staffUid: payload };
            offerPayload = { character: member };
        }
        socket.emit('offerTrade', { roomId: currentRoomId, targetId: partner.id, kind, payload: offerPayload, senderName: game.playerName });
        showTradeWaitingScreen();
    }

    function showTradeWaitingScreen() {
        if (!pendingOutgoingTrade) { renderActiveLobbyView(); return; }
        clearConsole("center", "radial-gradient(circle at 50% 30%, #201a00 0%, #050400 85%)", "#ffaa00");
        let what = pendingOutgoingTrade.kind === 'item' ? pendingOutgoingTrade.item
            : pendingOutgoingTrade.kind === 'cash' ? `$${pendingOutgoingTrade.cash}`
            : pendingOutgoingTrade.character.name;
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ffaa00; font-size:16px;">🤝 Offer Sent</h2>
            <p style="color:#aaa; font-size:12px;">Waiting for <strong>${pendingOutgoingTrade.targetName}</strong> to respond to your offer of <strong>${what}</strong>...</p>
        `;
        renderButtons([{ text: "❌ Cancel Offer", class: "btn btn-back", action: () => { pendingOutgoingTrade = null; renderActiveLobbyView(); } }]);
    }

    function showIncomingTradeOffer() {
        if (!incomingTradeOffer) { showMainMenu(); return; }
        let o = incomingTradeOffer;
        playBGM('trade');
        clearConsole("flex-start", "radial-gradient(circle at 50% 30%, #201a00 0%, #050400 85%)", "#ffaa00");
        let html = `
            <h2 style="color:#ffaa00; font-size:16px;">🤝 Incoming Trade Offer!</h2>
            <p style="color:#fff; font-size:12.5px;"><strong>${o.senderName}</strong> wants to trade you their <strong>${tradeOfferSummary(o)}</strong>!</p>
            <p style="color:#aaa; font-size:11.5px;">Choose what to give in return:</p>
            <p style="color:#aaa; font-size:11px;">💰 Cash</p>
            <div style="width:100%; max-width:380px; display:flex; gap:6px; align-items:center;">
                <input type="number" id="incoming-cash-input" placeholder="Amount" min="1" max="${Math.floor(game.funds || 0)}" style="background:#111;color:#0ff;border:1px solid #0ff;padding:6px;font-family:'Courier New';font-size:12px;border-radius:4px;width:110px;" />
                <button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="finalizeIncomingCashTrade()">Give Cash</button>
            </div>
            <div style="width:100%; max-width:380px;">
        `;
        currentIncomingChoiceList = [];
        let counts = {};
        (game.inventory || []).forEach(i => counts[i] = (counts[i] || 0) + 1);
        let items = Object.keys(counts);
        currentIncomingChoiceList = items;
        html += `<p style="color:#aaa; font-size:11px; margin-top:6px;">🎒 Items</p>`;
        if (!items.length) {
            html += `<p style="color:#888; font-size:12px;">You have nothing to trade back!</p>`;
        } else {
            items.forEach((item, idx) => {
                html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>${item} (x${counts[item]})</span>
                    <button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="finalizeIncomingTrade('item', ${idx})">Give This</button>
                </div>`;
            });
        }
        html += `<p style="color:#aaa; font-size:11px; margin-top:6px;">⚔️ Team Members</p>`;
        if ((game.staff || []).length <= 1) {
            html += `<p style="color:#888; font-size:12px;">You need at least one team member — recruit more before trading a character back!</p>`;
        } else {
            game.staff.forEach((s) => {
                html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>${s.name} (Pwr ${s.power || 0})</span>
                    <button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="finalizeIncomingTrade('character', '${s.uid}')">Give This</button>
                </div>`;
            });
        }
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "❌ Decline Offer", class: "btn btn-back", action: declineIncomingTrade }]);
    }

    function finalizeIncomingCashTrade() {
        let input = document.getElementById("incoming-cash-input");
        let amount = input ? parseInt(input.value, 10) : NaN;
        if (!amount || amount <= 0) return;
        if (amount > (game.funds || 0)) { showGameAlert("You don't have that much cash!"); return; }
        finalizeIncomingTrade('cash', amount);
    }

    function finalizeIncomingTrade(kind, choiceValue) {
        if (!incomingTradeOffer || !socket) return;
        let o = incomingTradeOffer;
        // o is flattened (kind + item/cash/character live directly on it) - rebuild the
        // {kind, payload} shape the generic trade pipeline (and applyReceivedTrade) expect.
        let receivedPayload = { item: o.item, cash: o.cash, character: o.character };
        let received = { kind: o.kind, payload: receivedPayload };
        let give, receiveMessage;

        if (kind === 'item') {
            let myItem = currentIncomingChoiceList[choiceValue];
            if (!myItem) return;
            let idx = game.inventory.indexOf(myItem);
            if (idx !== -1) game.inventory.splice(idx, 1);
            give = { kind: 'item', payload: { item: myItem } };
            applyReceivedTrade(received.kind, received.payload);
            receiveMessage = `You gave your ${myItem} and received ${tradeOfferSummary(o)} from ${o.senderName}!`;
        } else if (kind === 'cash') {
            game.funds -= choiceValue;
            give = { kind: 'cash', payload: { cash: choiceValue } };
            applyReceivedTrade(received.kind, received.payload);
            receiveMessage = `You gave $${choiceValue} and received ${tradeOfferSummary(o)} from ${o.senderName}!`;
        } else {
            if ((game.staff || []).length <= 1) { showGameAlert("You need at least one team member!"); return; }
            let myCharacter = game.staff.find(s => s.uid === choiceValue);
            if (!myCharacter) return;
            let idx = game.staff.findIndex(s => s.uid === choiceValue);
            game.staff.splice(idx, 1);
            game.partyUids = game.partyUids.filter(u => u !== choiceValue);
            if (game.championUid === choiceValue) game.championUid = null;
            give = { kind: 'character', payload: { character: myCharacter } };
            applyReceivedTrade(received.kind, received.payload);
            receiveMessage = `You gave ${myCharacter.name} and received ${tradeOfferSummary(o)} from ${o.senderName}!`;
        }

        socket.emit('acceptTrade', { targetId: o.senderId, senderName: game.playerName, offererName: o.senderName, give, receive: received });
        saveGame(); updateUI();
        finishTradeUI(receiveMessage);
        incomingTradeOffer = null;
    }

    // Applies whatever we just received in a trade (item, character, or cash) to our save.
    function applyReceivedTrade(kind, payload) {
        if (kind === 'item') {
            game.inventory.push(payload.item);
        } else if (kind === 'cash') {
            game.funds = (game.funds || 0) + payload.cash;
        } else if (kind === 'character') {
            let { uid, ...restOfCharacter } = payload.character;
            addStaffMember(restOfCharacter);
            if (payload.character.dexId != null) recordDex(payload.character.dexId, false);
        }
    }

    function declineIncomingTrade() {
        if (incomingTradeOffer && socket) {
            socket.emit('declineTradeOffer', { targetId: incomingTradeOffer.senderId, declinerName: game.playerName });
        }
        incomingTradeOffer = null;
        showMainMenu();
    }

    function finishTradeUI(message) {
        clearConsole("center", "radial-gradient(circle, #002200, #000)", "#00ff88");
        document.getElementById("console").innerHTML = `<h2 style="color:#00ff88; font-size:16px;">✅ Trade Complete!</h2><p style="color:#fff; font-size:12px; max-width:360px;">${message}</p>`;
        renderButtons([{ text: "✔ Return to Lobby", class: "btn btn-start", action: renderActiveLobbyView }]);
    }

    // --- LIVE ONLINE PvP DUELS ---
    // A full party-vs-party duel against another connected trainer, using the server's
    // authoritative battle state so both sides see identical HP, active fighters, and
    // turn order. Mirrors the PvE combat screen's party-strip + forced-swap-on-faint UX.
    function requestPvPDuel(targetId) {
        if (!socket) return;
        let partner = onlineRoomPlayers.find(p => p.id === targetId);
        pendingPvPTarget = { id: targetId, name: partner ? partner.name : "Trainer" };
        socket.emit('requestPvP', { roomId: currentRoomId, targetId, challengerName: game.playerName, party: buildCombatParty() });
        playBGM('battle');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #330011 0%, #08000a 85%)", "#ff0055");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0055; font-size:16px;">⚔️ Challenge Sent!</h2>
            <p style="color:#aaa; font-size:12px;">Waiting for <strong>${pendingPvPTarget.name}</strong> to accept your duel...</p>
        `;
        renderButtons([{ text: "❌ Cancel", class: "btn btn-back", action: () => { pendingPvPTarget = null; renderActiveLobbyView(); } }]);
    }

    function showIncomingPvPChallenge() {
        if (!incomingPvPChallenge) { renderActiveLobbyView(); return; }
        let c = incomingPvPChallenge;
        let theirParty = c.party || [];
        let leadName = (theirParty[0] && theirParty[0].name) || "their champion";
        playBGM('battle');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #330011 0%, #08000a 85%)", "#ff0055");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0055; font-size:16px;">⚔️ Duel Challenge!</h2>
            <p style="color:#fff; font-size:12.5px;"><strong>${c.challengerName}</strong> wants a full-party duel! Their lead: <strong>${leadName}</strong> (${theirParty.length} fighter${theirParty.length === 1 ? '' : 's'})</p>
        `;
        renderButtons([
            { text: "⚔️ Accept", class: "btn btn-combat", action: () => {
                socket.emit('acceptPvP', { challengerId: c.challengerId, challengerName: c.challengerName, accepterName: game.playerName, party: buildCombatParty() });
                incomingPvPChallenge = null;
            }},
            { text: "❌ Decline", class: "btn btn-back", action: () => {
                socket.emit('declinePvP', { challengerId: c.challengerId, declinerName: game.playerName });
                incomingPvPChallenge = null;
                renderActiveLobbyView();
            }}
        ]);
    }

    // Mirrors the PvE combat screen's party-strip: green dot = active fighter,
    // orange = alive and in reserve, dark red = fainted.
    function pvpPartyStripHtml(party, activeIdx) {
        return (party || []).map((p, i) => {
            let faint = p.hp <= 0;
            let isActive = i === activeIdx;
            let color = faint ? '#552222' : (isActive ? '#00ff99' : '#ffaa00');
            return `<span title="${p.name}: ${p.hp}/${p.maxHp} HP" style="display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 2px; background:${color}; border:1px solid #000;"></span>`;
        }).join('');
    }

    function renderLivePvPScreen(logMessage) {
        let b = currentPvPBattle;
        if (!b) { renderActiveLobbyView(); return; }
        let mine = b.myParty[b.myActiveIdx];
        let opp = b.oppParty[b.oppActiveIdx];
        if (!mine || !opp) { renderActiveLobbyView(); return; }
        clearConsole("center", "radial-gradient(circle at 50% 30%, #33000a 0%, #080002 85%)", "#ff0044");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ff0033; font-size:16px;">⚔️ DUEL vs ${b.oppName.toUpperCase()}</h2>
            <div style="display: flex; justify-content: space-around; width: 100%; margin: 8px 0;">
                <div class="dex-card" style="text-align: center; width: 48%; display: block; border-color: #00ff66; padding:6px;">
                    ${characterPortrait(mine.name, 75)}
                    <strong style="color: #00ffff; font-size:12px;">${mine.name}</strong><br>
                    ❤️ <span style="color:#33ff33; font-size:11px;">${mine.hp} / ${mine.maxHp}</span>
                    <div style="margin-top:4px;">${pvpPartyStripHtml(b.myParty, b.myActiveIdx)}</div>
                </div>
                <div class="dex-card" style="text-align: center; width: 48%; display: block; border-color: #ff0055; padding:6px;">
                    ${characterPortrait(opp.name, 75)}
                    <strong style="color: #ff0055; font-size:12px;">${opp.name}</strong><br>
                    ❤️ <span style="color:#ff3333; font-size:11px;">${opp.hp} / ${opp.maxHp}</span>
                    <div style="margin-top:4px;">${pvpPartyStripHtml(b.oppParty, b.oppActiveIdx)}</div>
                </div>
            </div>
            <p style="color: #ffff00; font-size: 12px; margin:2px 0;">${logMessage || (b.needsMySwap ? "Your fighter fainted - send out your next one!" : (b.isMyTurn ? "Your move!" : `Waiting on ${b.oppName}...`))}</p>
        `;
        if (b.needsMySwap) {
            renderButtons([{ text: "🔄 Choose Next Fighter", class: "btn btn-start", action: () => showPvPSwapPicker(true) }]);
        } else if (b.isMyTurn) {
            renderButtons([
                { text: "⚔️ Strike", class: "btn btn-combat", action: () => executePvPAction('strike') },
                { text: "💥 Special", class: "btn btn-combat", action: () => executePvPAction('special') },
                { text: "🛡️ Guard", class: "btn btn-mine", action: () => executePvPAction('guard') },
                { text: "🔄 Swap Fighter", class: "btn btn-dex", action: () => showPvPSwapPicker(false) }
            ]);
        } else {
            renderButtons([]);
        }
    }

    function executePvPAction(actionType) {
        let b = currentPvPBattle;
        if (!b || !b.isMyTurn || b.needsMySwap || !socket) return;
        let fighter = b.myParty[b.myActiveIdx];
        if (!fighter) return;
        b.isMyTurn = false;
        socket.emit('executeLivePvPAction', { battleId: b.battleId, actionType, power: fighter.power, championName: fighter.name });
        renderLivePvPScreen(`You used ${actionType.toUpperCase()}! Waiting for the result...`);
    }

    // forced = true after your active fighter faints (must pick someone, no cancel);
    // forced = false is a voluntary mid-duel swap, which still costs your turn.
    function showPvPSwapPicker(forced) {
        let b = currentPvPBattle;
        if (!b) return;
        clearConsole("center", "radial-gradient(circle at 50% 30%, #33000a 0%, #080002 85%)", "#ff0044");
        let html = `<h2 style="font-size:16px; color:#ff0055;">🔄 ${forced ? 'Choose Your Next Fighter' : 'Swap Active Fighter'}</h2><div style="width:100%; max-width:380px;">`;
        b.myParty.forEach((p, i) => {
            let faint = p.hp <= 0;
            let isActive = i === b.myActiveIdx;
            html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center; opacity:${faint ? 0.45 : 1};">
                <span>${faint ? '💀' : '⚔️'} ${p.name} (${p.hp}/${p.maxHp} HP)${isActive && !forced ? ' <span style="color:#ffaa00;">(Active)</span>' : ''}</span>
                ${(!faint && !isActive) ? `<button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="confirmPvPSwap(${i})">Send Out</button>` : ''}
            </div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons(forced ? [] : [{ text: "⬅ Cancel", class: "btn btn-back", action: () => renderLivePvPScreen() }]);
    }

    function confirmPvPSwap(idx) {
        let b = currentPvPBattle;
        if (!b || !socket) return;
        let fighter = b.myParty[idx];
        if (!fighter || fighter.hp <= 0) return;
        b.isMyTurn = false;
        b.needsMySwap = false;
        socket.emit('executeLivePvPAction', { battleId: b.battleId, actionType: 'swap', swapToIdx: idx, championName: fighter.name });
        renderLivePvPScreen(`Sending out ${fighter.name}...`);
    }

    // --- LIVE CO-OP RAID BOSS ---
    // The raid boss is genuinely shared server-wide: every currently-connected
    // player is hitting the exact same HP pool in real time, and everyone who's
    // watching the fight when it dies gets credited the reward.
    function showRaidTierSelect() {
        playBGM('villain');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #3a0000 0%, #0a0002 85%)", "#ff0055");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0055; text-shadow: 0 0 10px #ff0055; font-size:18px;">🐲 CHOOSE YOUR RAID BOSS</h2>
            <p style="color:#aaa; font-size:12px; max-width:360px;">Every trainer online right now fights the SAME boss - team up and strike together in real time!</p>
        `;
        renderButtons([
            { text: "🐉 Void Titan Chronos (Lv. 50)", class: "btn btn-raid", action: () => selectRaidBossTier('titan') },
            { text: "🐲 Shadow Dragon Netherfang (Lv. 90)", class: "btn btn-raid", action: () => selectRaidBossTier('dragon') },
            { text: "⬅ Back to Lobby", class: "btn btn-back", action: renderActiveLobbyView }
        ]);
    }

    function selectRaidBossTier(tierKey) {
        if (socket) socket.emit('selectRaidTier', tierKey);
        startCoopRaidSession();
    }

    // The raid boss previously never damaged players at all - striking it only ever
    // reduced its shared HP pool server-side. raidPlayerFighter is a lightweight local
    // combatant (not the persistent roster entry) that takes the boss's retaliation hits.
    let raidPlayerFighter = null;

    function startCoopRaidSession() {
        raidScreenActive = true;
        let champ = getChampion();
        raidPlayerFighter = {
            name: champ.name,
            power: champ.power || 30,
            maxHp: 100,
            hp: 100,
            defense: getFighterDefense(champ)
        };
        renderRaidBossScreen();
    }

    function renderRaidBossScreen() {
        playBGM('villain');
        let boss = currentRaidBossState || { name: "Contacting raid server...", hp: 0, maxHp: 1, level: 1, reward: 0 };
        let pf = raidPlayerFighter || { name: "Fighter", hp: 100, maxHp: 100 };
        clearConsole("center", "radial-gradient(circle at 50% 30%, #3a0000 0%, #0a0002 85%)", "#ff0055");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0055; text-shadow: 0 0 10px #ff0055; font-size:18px;">🐲 CO-OP RAID BOSS</h2>
            <div class="dex-card" style="display:block; text-align:center; font-size:12px;">
                <strong style="color:#ff3333; font-size:16px;">${boss.name}</strong> (Lv. ${boss.level})<br>
                ❤️ Raid HP: <span style="color:#ff3333;" id="raid-boss-hp">${boss.hp} / ${boss.maxHp}</span>
            </div>
            <div class="dex-card" style="display:block; text-align:center; font-size:12px; margin-top:6px;">
                <strong style="color:#00ffff;">${pf.name}</strong><br>
                ❤️ Your HP: <span style="color:#33ff33;" id="raid-player-hp">${pf.hp} / ${pf.maxHp}</span>
            </div>
            <p id="raid-combat-log" style="color:#ffff00; font-size:12px;">Every trainer online can strike this SAME boss right now - your hits (and theirs) land live! It strikes back, and enrages under 30% HP.</p>
        `;
        renderButtons([
            { text: pf.hp > 0 ? "💥 Strike the Boss!" : "💤 Fighter Down - Leave to Heal", class: "btn btn-raid", action: executeRaidStrike },
            { text: "🏃 Leave Raid", class: "btn btn-back", action: () => { raidScreenActive = false; renderActiveLobbyView(); } }
        ]);
    }

    function executeRaidStrike() {
        if (!socket || !socket.connected) { showGameAlert("Not connected to the server - can't reach the raid boss right now."); return; }
        if (!raidPlayerFighter || raidPlayerFighter.hp <= 0) { showGameAlert("Your fighter is down! Retreat and heal before striking again."); return; }
        let lead = getChampion();
        let dmg = (lead.power || 35) + Math.floor(Math.random() * 20);
        socket.emit('attackRaidBoss', { damage: dmg, trainerName: game.playerName, championName: lead.name, defense: raidPlayerFighter.defense });
    }

    if (socket) {
        socket.on('roomUpdate', ({ roomId, players }) => { onlineRoomPlayers = players; if (currentRoomId === roomId && !chatScreenActive) renderActiveLobbyView(); });

        socket.on('assignedRandomRoom', (roomId) => {
            if (!roomId) return;
            currentRoomId = roomId;
            socket.emit('joinRoom', { roomId: currentRoomId, player: { name: game.playerName, staff: game.staff, power: game.managerPower } });
            roomChatLog = [];
            renderActiveLobbyView();
        });

        socket.on('receiveRoomMessage', (entry) => {
            roomChatLog.push(entry);
            if (roomChatLog.length > 50) roomChatLog.shift();
            if (chatScreenActive) renderRoomChatScreen();
        });

        socket.on('raidBossUpdate', (boss) => {
            currentRaidBossState = boss;
            if (raidScreenActive) renderRaidBossScreen();
        });

        socket.on('raidBossHit', (data) => {
            if (currentRaidBossState) {
                currentRaidBossState.hp = data.bossHp;
                currentRaidBossState.maxHp = data.bossMaxHp;
            }
            if (raidScreenActive) {
                let hpEl = document.getElementById("raid-boss-hp");
                if (hpEl) hpEl.innerText = `${data.bossHp} / ${data.bossMaxHp}`;
                let logEl = document.getElementById("raid-combat-log");
                if (logEl) logEl.innerHTML = `<span style="color:#00ffff;">${data.log}</span>`;
            }
            if (data.isDefeated && raidScreenActive) {
                raidScreenActive = false;
                setTimeout(() => {
                    game.funds += (data.reward || 0);
                    bumpLifetimeStat('totalRaidKills');
                    bumpDailyProgress('raidKills');
                    updateUI(); saveGame();
                    clearConsole("center", "radial-gradient(circle, #003300, #000)", "#00ff88");
                    document.getElementById("console").innerHTML = `
                        <h2 style="color:#00ff88; font-size:18px;">🏆 RAID BOSS DEFEATED!</h2>
                        <p style="color:#fff; font-size:12px;">${data.slayer} landed the final blow! Everyone who joined the fight claims $${data.reward}!</p>
                    `;
                    renderButtons([{ text: "✔ Return to Lobby", class: "btn btn-start", action: renderActiveLobbyView }]);
                }, 900);
            }
        });

        // The boss strikes back at whoever just hit it - sent only to that one socket,
        // never broadcast, since it's retaliation against a single striker's fighter.
        socket.on('raidBossRetaliate', ({ damage, isCrit, enraged, bossName }) => {
            if (!raidPlayerFighter) return;
            raidPlayerFighter.hp = Math.max(0, raidPlayerFighter.hp - (damage || 0));
            if (!raidScreenActive) return;
            let critTag = isCrit ? " 💢 CRITICAL HIT!" : "";
            let enrageTag = enraged ? " 🔥 ENRAGED!" : "";
            let logEl = document.getElementById("raid-combat-log");
            if (logEl) logEl.innerHTML = `<span style="color:#ff6666;">${bossName} strikes back for ${damage}!${critTag}${enrageTag}</span>`;
            let hpEl = document.getElementById("raid-player-hp");
            if (hpEl) hpEl.innerText = `${raidPlayerFighter.hp} / ${raidPlayerFighter.maxHp}`;
            if (raidPlayerFighter.hp <= 0) {
                renderRaidBossScreen();
                showGameAlert(`${raidPlayerFighter.name} was knocked out by ${bossName}! Leave the raid to send them back in at full HP.`);
            }
        });

        // --- Generalized trade protocol: item / character / cash all flow through the
        // same offerTrade -> receiveTradeOffer -> acceptTrade -> tradeCompleted pipeline.
        socket.on('receiveTradeOffer', (data) => {
            incomingTradeOffer = { senderId: data.senderId, senderName: data.senderName, kind: data.kind, ...data.payload };
            showIncomingTradeOffer();
        });

        socket.on('tradeCompleted', (data) => {
            if (!pendingOutgoingTrade) return;
            applyReceivedTrade(data.received.kind, data.received.payload);
            saveGame(); updateUI();
            finishTradeUI(`You gave your ${tradeOfferSummary(pendingOutgoingTrade)} and received ${tradeOfferSummary({ kind: data.received.kind, ...data.received.payload })} from ${data.partnerName}!`);
            pendingOutgoingTrade = null;
        });

        socket.on('tradeOfferDeclined', (data) => {
            if (pendingOutgoingTrade) {
                showGameAlert(`${data.declinerName || "The trainer"} declined your trade offer.`);
                pendingOutgoingTrade = null;
                renderActiveLobbyView();
            }
        });

        // --- Global player market ---
        socket.on('marketUpdate', (listings) => {
            globalMarketListings = listings || [];
        });

        socket.on('itemPurchasedSuccess', (listing) => {
            game.funds -= listing.price;
            game.inventory.push(listing.item);
            saveGame(); updateUI();
            showGlobalMarketScreen(`<span style="color:#55ff99;">✔ Bought ${listing.item} for $${listing.price}!</span>`);
        });

        socket.on('itemSoldNotification', (data) => {
            game.funds += data.price;
            saveGame(); updateUI();
            showGameAlert(`💰 ${data.buyer} bought your ${data.item} for $${data.price}!`);
        });

        socket.on('marketListingCancelled', (listing) => {
            game.inventory.push(listing.item);
            saveGame(); updateUI();
            showGlobalMarketScreen(`<span style="color:#66ccff;">Listing cancelled — ${listing.item} returned to your bag.</span>`);
        });

        // --- Live online PvP duels ---
        socket.on('pvpChallengeReceived', (data) => {
            incomingPvPChallenge = { challengerId: data.challengerId, challengerName: data.challengerName, party: data.party };
            showIncomingPvPChallenge();
        });

        socket.on('pvpChallengeDeclined', (data) => {
            if (pendingPvPTarget) {
                showGameAlert(`${data.declinerName || "The trainer"} declined your duel challenge.`);
                pendingPvPTarget = null;
                renderActiveLobbyView();
            }
        });

        socket.on('startLivePvP', (data) => {
            let mySide = socket.id === data.p1Id ? 1 : 2;
            let oppName = mySide === 1
                ? (incomingPvPChallenge ? incomingPvPChallenge.challengerName : (pendingPvPTarget ? pendingPvPTarget.name : "Opponent"))
                : (data.challengerName || (pendingPvPTarget ? pendingPvPTarget.name : "Opponent"));
            currentPvPBattle = {
                battleId: data.battleId,
                mySide: mySide,
                oppName: oppName,
                myParty: mySide === 1 ? data.p1Party : data.p2Party,
                oppParty: mySide === 1 ? data.p2Party : data.p1Party,
                myActiveIdx: mySide === 1 ? data.p1ActiveIdx : data.p2ActiveIdx,
                oppActiveIdx: mySide === 1 ? data.p2ActiveIdx : data.p1ActiveIdx,
                isMyTurn: data.turn === socket.id,
                needsMySwap: false
            };
            pendingPvPTarget = null;
            incomingPvPChallenge = null;
            playBGM('battle');
            renderLivePvPScreen();
        });

        socket.on('pvpRoundUpdate', (data) => {
            let b = currentPvPBattle;
            if (!b || data.battleId !== b.battleId) return;
            b.myParty = b.mySide === 1 ? data.p1Party : data.p2Party;
            b.oppParty = b.mySide === 1 ? data.p2Party : data.p1Party;
            b.myActiveIdx = b.mySide === 1 ? data.p1ActiveIdx : data.p2ActiveIdx;
            b.oppActiveIdx = b.mySide === 1 ? data.p2ActiveIdx : data.p1ActiveIdx;
            let mySideKey = b.mySide === 1 ? 'p1' : 'p2';
            b.needsMySwap = data.needsSwap === mySideKey;
            b.isMyTurn = !data.needsSwap && data.turn === socket.id;
            renderLivePvPScreen(data.lastActionLog);
            if (data.isOver) {
                let won = data.winnerId === socket.id;
                setTimeout(() => {
                    clearConsole("center", won ? "radial-gradient(circle,#003300,#000)" : "radial-gradient(circle,#330000,#000)", won ? "#00ff88" : "#ff3333");
                    if (won) game.funds += 1500;
                    saveGame(); updateUI();
                    document.getElementById("console").innerHTML = `
                        <h2 style="font-size:18px;">${won ? '🏆 DUEL WON!' : '💀 DUEL LOST'}</h2>
                        <p style="font-size:12px;">${won ? 'Earned $1500!' : 'Better luck next time, trainer.'}</p>
                    `;
                    renderButtons([{ text: "✔ Return to Lobby", class: "btn btn-start", action: renderActiveLobbyView }]);
                    currentPvPBattle = null;
                }, 1200);
            }
        });
    }

    function showDexMenu(page = 1, searchQuery = "", portalFilter = "") {
        playBGM('dex');
        clearConsole("flex-start", "radial-gradient(circle at 50% 20%, #1a1500 0%, #080702 85%)", "#ffff00");

        let entries = getAllDexEntries();
        if (searchQuery.trim() !== "") {
            let q = searchQuery.toLowerCase();
            entries = entries.filter(c => c.name.toLowerCase().includes(q) || (c.origin && c.origin.toLowerCase().includes(q)));
        }
        if (portalFilter) {
            entries = entries.filter(c => c.portal === portalFilter);
        }

        let perPage = 15;
        let totalPages = Math.ceil(entries.length / perPage) || 1;
        page = Math.max(1, Math.min(page, totalPages));
        let slice = entries.slice((page-1)*perPage, page*perPage);

        let portalOptions = Object.keys(PORTAL_CHAR_POOLS).map(key =>
            `<option value="${key}" ${portalFilter === key ? 'selected' : ''}>${formatPortalLabel(key)}</option>`
        ).join('');

        let html = `
            <h2 style="color:#ffff00; font-size:18px;">📖 UNIDEX (${page}/${totalPages})</h2>
            <div style="margin: 6px 0; width: 100%; display: flex; justify-content: center; gap: 4px; flex-wrap: wrap;">
                <input type="text" id="dex-search-input" placeholder="Search name/origin..." value="${searchQuery}" style="background: #111; color: #0ff; border: 1px solid #0ff; padding: 5px; font-family: 'Courier New'; font-size: 11px; border-radius: 4px; width: 60%; max-width: 180px;" />
                <button class="btn btn-sys" style="padding: 4px 8px; font-size: 11px; min-height:28px;" onclick="filterDexSearch()">Search</button>
                ${(searchQuery || portalFilter) ? `<button class="btn btn-back" style="padding: 4px 6px; font-size: 11px; min-height:28px;" onclick="showDexMenu(1, '', '')">Reset</button>` : ''}
            </div>
            <div style="margin: 0 0 6px 0; width: 100%; display: flex; justify-content: center;">
                <select id="dex-portal-filter" onchange="filterDexPortal()" style="background: #111; color: #ff00ff; border: 1px solid #ff00ff; padding: 5px; font-family: 'Courier New'; font-size: 11px; border-radius: 4px; max-width: 220px;">
                    <option value="" ${portalFilter ? '' : 'selected'}>🌌 All Portals</option>
                    ${portalOptions}
                </select>
            </div>
            <div style="width:100%;">
        `;
        slice.forEach(e => {
            let dexEntry = game.pokedex && game.pokedex[String(e.id)];
            let caught = !!dexEntry;
            let icon = caught ? `<img src="${getCharacterPortrait(e.name)}" style="width:26px;height:26px;object-fit:contain;border-radius:4px;border:1px solid #0ff;" onerror="applyTypeIconFallback(this, '${escAttr(e.name)}')"/>` : '⚪';
            let shinyTag = caught && dexEntry.shiny ? ' ✨' : '';
            let evoTag = caught && dexEntry.evolved ? ' 🌟' : '';
            let portalTag = e.portal ? `<span style="color:#ff77ff; font-size:9.5px;"> [${formatPortalLabel(e.portal)}]</span>` : '';
            // Only caught entries are clickable - just like a real Pokedex, you can't pull
            // up a profile page for something you've never actually recruited.
            let clickAttr = caught ? ` onclick="showDexEntryDetail(${e.id}, ${page}, '${escAttr(searchQuery)}', '${escAttr(portalFilter)}')" style="font-size:11.5px; cursor:pointer;"` : ` style="font-size:11.5px;"`;
            html += `<div class="dex-card"${clickAttr}>${icon} <span>#${e.id} - ${caught ? e.name : '????????'}${shinyTag}${evoTag}${caught ? portalTag : ''}</span>${caught ? POKEBALL_SVG : ''}</div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;

        let btns = [];
        if (page > 1) btns.push({ text: "⬅ Prev", action: () => showDexMenu(page - 1, searchQuery, portalFilter) });
        if (page < totalPages) btns.push({ text: "Next ➡", action: () => showDexMenu(page + 1, searchQuery, portalFilter) });
        btns.push({ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu });
        renderButtons(btns);

        let searchInput = document.getElementById("dex-search-input");
        if (searchInput) {
            searchInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") filterDexSearch();
            });
        }
    }

    // Formats a portal pool key like "maidCafe" into readable text like "Maid Cafe".
    function formatPortalLabel(key) {
        if (!key) return '';
        return key.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());
    }

    // A single Pokedex-style entry profile: big portrait, type badge, origin, and
    // whatever flavor data this character has (persona, transcendent evolution, first
    // portal) - only reachable for entries you've actually caught.
    function showDexEntryDetail(id, returnPage = 1, returnQuery = "", returnPortal = "") {
        let entry = getAllDexEntries().find(e => e.id === id);
        let dexEntry = game.pokedex && game.pokedex[String(id)];
        if (!entry || !dexEntry) { showDexMenu(returnPage, returnQuery, returnPortal); return; }

        playBGM('dex');
        clearConsole("center", "radial-gradient(circle at 50% 20%, #1a1500 0%, #080702 85%)", "#ffff00");

        let type = resolveCharacterType(entry.name);
        let theme = TYPE_ICON_THEME[type] || TYPE_ICON_THEME.Normal;
        let portraitHtml = characterPortrait(entry.name, 150);
        let caughtCount = dexEntry.count || 1;
        let canEvolve = caughtCount >= EVOLUTION_THRESHOLD && !dexEntry.evolved;

        let evolutionLine;
        if (dexEntry.evolved) {
            evolutionLine = `<strong style="color:#ffe066;">Unique Evolution:</strong> ✨ ${dexEntry.evolvedName} ✨<br>`;
        } else if (canEvolve) {
            evolutionLine = `<strong style="color:#00ffff;">Unique Evolution:</strong> <span style="color:#55ff99;">Ready to evolve!</span><br>`;
        } else {
            evolutionLine = `<strong style="color:#888;">Unique Evolution:</strong> Catch ${EVOLUTION_THRESHOLD - caughtCount} more to unlock (${caughtCount}/${EVOLUTION_THRESHOLD})<br>`;
        }

        document.getElementById("console").innerHTML = `
            <p style="color:#888; font-size:11px; margin:0 0 2px 0;">UNIDEX ENTRY #${entry.id}</p>
            ${dexEntry.shiny ? `<div class="shiny-frame">${portraitHtml}</div>` : portraitHtml}
            <h2 style="color:#ffff00; font-size:18px; margin:4px 0 0 0;">${entry.name}${dexEntry.shiny ? ' ✨' : ''}</h2>
            <div style="display:inline-flex; align-items:center; gap:5px; background:${theme.bg2}; border:1px solid ${theme.bg}; border-radius:12px; padding:3px 10px; margin:6px 0;">
                <span style="width:12px;height:12px;border-radius:50%;background:${theme.bg};display:inline-block;"></span>
                <span style="color:#fff; font-size:11px; font-weight:bold;">${type} TYPE</span>
            </div>
            <div class="dex-card" style="display:block; text-align:left; font-size:12px; line-height:1.7; max-width:340px;">
                <strong style="color:#00ffff;">Origin:</strong> ${entry.origin || 'Unknown'}<br>
                ${entry.persona ? `<strong style="color:#00ffff;">Persona:</strong> ${entry.persona}<br>` : ''}
                ${entry.evo ? `<strong style="color:#00ffff;">Evolves into:</strong> ${entry.evo}<br>` : ''}
                ${entry.portal ? `<strong style="color:#00ffff;">First seen at:</strong> ${formatPortalLabel(entry.portal)}<br>` : ''}
                <strong style="color:#00ffff;">Times caught:</strong> ${caughtCount}<br>
                ${evolutionLine}
            </div>
        `;
        let btns = [];
        if (canEvolve) btns.push({ text: "⭐ Evolve!", class: "btn btn-start", action: () => evolveCharacter(id, returnPage, returnQuery, returnPortal) });
        btns.push({ text: "⬅ Back to UniDex", class: "btn btn-back", action: () => showDexMenu(returnPage, returnQuery, returnPortal) });
        renderButtons(btns);
    }

            { text: "⚔️ Strike", class: "btn btn-combat", action: () => executePokemonAction('strike') },
            { text: "💥 Special", class: "btn btn-combat", action: () => executePokemonAction('special') },
            { text: "🛡️ Guard", class: "btn btn-mine", action: () => executePokemonAction('guard') },
            { text: `🧪 Use Item (${healCount})`, class: "btn btn-sys", action: () => executePokemonAction('item') },
            { text: "🔄 Swap Fighter", class: "btn btn-dex", action: () => showCombatSwapPicker(false) },
            { text: "🏃 Run Away", class: "btn btn-back", action: s.regionKey ? () => showRegionHub(s.regionKey) : showMiningHub }
        ]);
    }

    function executePokemonAction(actionType) {
        let s = activeCombatSession;
        let fighter = s.party[s.activeIdx];
        if (!fighter || fighter.hp <= 0) return;

        if (actionType === 'item') {
            let idx = game.inventory.indexOf('Healing Potion');
            if (idx === -1) {
                s.lastLog = `<span style="color:#ff6666;">No Healing Potions in your bag!</span>`;
                renderPokemonCombatScreen();
                return;
            }
            game.inventory.splice(idx, 1);
            fighter.hp = Math.min(fighter.maxHp, fighter.hp + 50);
            saveGame(); updateUI();
            s.lastLog = `<span style="color:#33ff99;">${fighter.name} drinks a Healing Potion! +50 HP</span>`;
            renderPokemonCombatScreen();
            enemyCounterAttack();
            return;
        }

        let guarding = actionType === 'guard';
        let dmg = 0;
        if (!guarding) {
            let mult = actionType === 'special' ? 1.8 : 1.0;
            dmg = Math.floor((fighter.power + Math.random() * 12) * mult);
            s.enemyHP = Math.max(0, s.enemyHP - dmg);
        }
        s.playerGuarding = guarding;
        s.lastLog = guarding
            ? `<span style="color:#66ccff;">${fighter.name} takes a defensive stance!</span>`
            : `<span style="color:#00ffff;">${fighter.name} ${actionType === 'special' ? 'unleashes a SPECIAL attack' : 'strikes'} for ${dmg} damage!</span>`;
        renderPokemonCombatScreen();

        if (s.enemyHP <= 0) {
            setTimeout(winCombat, 1200);
            return;
        }
        enemyCounterAttack();
    }

    function enemyCounterAttack() {
        let s = activeCombatSession;
        setTimeout(() => {
            let fighter = s.party[s.activeIdx];
            let isCrit = rollEnemyCrit();
            let rawDamage = s.enemyDmg * (isCrit ? ENEMY_CRIT_MULTIPLIER : 1);
            let defense = getFighterDefense(fighter);
            let incoming = computeMitigatedDamage(rawDamage, defense, s.enemyArmorPen || 0);
            if (s.playerGuarding) incoming = Math.max(MIN_TRUE_DAMAGE_FLOOR, Math.floor(incoming * 0.5));
            s.playerGuarding = false;
            fighter.hp = Math.max(0, fighter.hp - incoming);
            let critTag = isCrit ? " 💢 CRITICAL HIT!" : "";

            if (fighter.hp <= 0) {
                let alive = s.party.filter(p => p.hp > 0);
                if (!alive.length) { loseCombat(); return; }
                clearConsole("center", "radial-gradient(circle at 50% 30%, #33000a 0%, #080002 85%)", "#ff0044");
                document.getElementById("console").innerHTML = `<h2 style="font-size:16px;">💥 ${fighter.name} fainted!</h2><p style="font-size:12px;">${s.enemyName} hit for ${incoming}${critTag}! Send out your next fighter.</p>`;
                renderButtons([{ text: "🔄 Choose Next Fighter", class: "btn btn-start", action: () => showCombatSwapPicker(true) }]);
            } else {
                s.lastLog = `<span style="color:#ff8888;">${s.enemyName} hit ${fighter.name} for ${incoming} damage!${critTag}</span>`;
                renderPokemonCombatScreen();
            }
        }, 900);
    }

    function winCombat() {
        let s = activeCombatSession;
        game.funds += (s.rewardCash || 1000);
        updateUI(); saveGame();
        clearConsole("center", "radial-gradient(circle,#003300,#000)", "#00ff88");
        document.getElementById("console").innerHTML = `<h2 style="font-size:18px;">🎉 BATTLE WON!</h2><p style="font-size:12px;">Earned $${s.rewardCash || 1000}!</p>`;
        if (REAL_CHARACTERS_DB.length > 0 && Math.random() < 0.5) {
            renderButtons([{ text: "👀 Something's rustling nearby...", class: "btn btn-start", action: spawnWildUniDexEncounter }]);
        } else {
            renderButtons([{ text: "Return to HQ", class: "btn btn-back", action: showMainMenu }]);
        }
    }

    function loseCombat() {
        clearConsole("center", "radial-gradient(circle,#330000,#000)", "#ff3333");
        document.getElementById("console").innerHTML = `<h2 style="font-size:18px;">💀 YOUR PARTY WAS DEFEATED!</h2><p style="font-size:12px;">Fled back to HQ. Better luck next time, trainer.</p>`;
        renderButtons([{ text: "Return to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    // forced = true after a faint (must pick someone, no cancel, no free enemy turn);
    // forced = false is a voluntary swap mid-battle, which still costs you the turn.
    function showCombatSwapPicker(forced) {
        let s = activeCombatSession;
        clearConsole("center", "radial-gradient(circle at 50% 30%, #33000a 0%, #080002 85%)", "#ff0044");
        let html = `<h2 style="font-size:16px; color:#ff0055;">🔄 ${forced ? 'Choose Your Next Fighter' : 'Swap Active Fighter'}</h2><div style="width:100%; max-width:380px;">`;
        s.party.forEach((p, i) => {
            let faint = p.hp <= 0;
            let isActive = i === s.activeIdx;
            html += `<div class="dex-card" style="display:flex; justify-content:space-between; align-items:center; opacity:${faint ? 0.45 : 1};">
                <span>${faint ? '💀' : '⚔️'} ${p.name} (${p.hp}/${p.maxHp} HP)${isActive && !forced ? ' <span style="color:#ffaa00;">(Active)</span>' : ''}</span>
                ${(!faint && !isActive) ? `<button class="btn btn-mine" style="padding:3px 8px; font-size:11px; min-height:28px;" onclick="confirmCombatSwap(${i}, ${forced})">Send Out</button>` : ''}
            </div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons(forced ? [] : [{ text: "⬅ Cancel", class: "btn btn-back", action: renderPokemonCombatScreen }]);
    }

    function confirmCombatSwap(idx, forced) {
        let s = activeCombatSession;
        s.activeIdx = idx;
        let fighter = s.party[idx];
        s.lastLog = `<span style="color:#00ffcc;">Go, ${fighter.name}!</span>`;
        renderPokemonCombatScreen();
        if (!forced) {
            enemyCounterAttack();
        }
    }

    // --- CHASE STUDIOS SPLASH ---
    let studioAudioCtx = null;
    function getStudioAudioCtx() {
        try {
            if (!studioAudioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) studioAudioCtx = new AC();
            }
            return studioAudioCtx;
        } catch (e) { return null; }
    }

    function playStudioChime() {
        if (isAudioMuted) return;
        const ctx = getStudioAudioCtx();
        if (!ctx) return;
        const fire = () => {
            try {
                const now = ctx.currentTime;
                const master = ctx.createGain();
                master.gain.value = masterVolume;
                master.connect(ctx.destination);
                // Soft arcane shimmer: cyan fundamental, amethyst fifth, and a high overtone.
                const notes = [
                    { freq: 587.33, delay: 0.00, peak: 0.18 },
                    { freq: 880.00, delay: 0.06, peak: 0.13 },
                    { freq: 1174.66, delay: 0.14, peak: 0.08 }
                ];
                notes.forEach(n => {
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(n.freq, now + n.delay);
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(0.0001, now + n.delay);
                    g.gain.linearRampToValueAtTime(n.peak, now + n.delay + 0.08);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + n.delay + 1.6);
                    osc.connect(g).connect(master);
                    osc.start(now + n.delay);
                    osc.stop(now + n.delay + 1.7);
                });
            } catch (e) {}
        };
        // Browsers block audio until a user gesture has occurred - if the context is
        // still suspended (autoplay blocked), quietly resume-and-fire, and if that
        // rejects (no gesture yet at all) just skip the chime rather than throwing.
        if (ctx.state === 'suspended') { ctx.resume().then(fire).catch(() => {}); }
        else { fire(); }
    }

    let studioIntroResolved = false;
    let studioIntroTimers = [];

    function clearStudioIntroTimers() {
        studioIntroTimers.forEach(t => clearTimeout(t));
        studioIntroTimers = [];
    }

    function studioIntroKeyHandler() { finishStudioIntro(); }

    function finishStudioIntro() {
        if (studioIntroResolved) return;
        studioIntroResolved = true;
        clearStudioIntroTimers();
        const el = document.getElementById('studio-intro');
        if (el) {
            el.removeEventListener('click', finishStudioIntro);
            document.removeEventListener('keydown', studioIntroKeyHandler);
            el.classList.add('studio-intro-hidden');
            setTimeout(() => { el.remove(); }, 850);
        }
        bootGame();
    }

    async function bootGame() {
        await loadCharacterDatabase();
        showIntroScreen();
    }

    function initStudioIntro() {
        const el = document.getElementById('studio-intro');
        if (!el) { bootGame(); return; }
        el.addEventListener('click', finishStudioIntro);
        document.addEventListener('keydown', studioIntroKeyHandler);
        studioIntroTimers.push(setTimeout(playStudioChime, 550));
        studioIntroTimers.push(setTimeout(finishStudioIntro, 4600));
    }

    // Deliberately NOT window.onload - that waits for every resource on the page to
    // finish, including the ~25 music/character-cry Audio() objects created above, which
    // can take a while and would leave the player staring at a blank tab before the
    // splash even starts. This script tag runs at the end of <body>, so the DOM is
    // already parsed by the time we get here - start the intro immediately.
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initStudioIntro);
    } else {
        initStudioIntro();
    }
</script>
