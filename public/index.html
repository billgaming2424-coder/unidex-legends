<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UniDex Legends</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            background-color: #030305; color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 6px; width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column; user-select: none; touch-action: manipulation;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
        #stats-bar {
            background: linear-gradient(180deg, #12121c 0%, #08080f 100%);
            border: 1px solid #00ffff55; padding: 4px 8px; margin-bottom: 6px; border-radius: 6px;
            font-size: 11px; flex-shrink: 0; display: none; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;
        }
        .stat-highlight { color: #ff00ff; font-weight: bold; }
        .stat-money { color: #ffff00; font-weight: bold; }
        #screen-wrapper { position: relative; flex: 1 1 auto; min-height: 100px; display: flex; width: 100%; margin-bottom: 6px; overflow: hidden; }
        #console {
            flex: 1 1 100%; min-height: 0; background-color: #020204; border: 2px solid #222233;
            padding: 10px; overflow-y: auto; border-radius: 8px; font-size: 13px; line-height: 1.4;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; position: relative;
            -webkit-overflow-scrolling: touch; transition: background 0.5s ease;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #14141e; padding-bottom: 3px; width: 100%; text-align: left; }
        
        #controls {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
            flex-shrink: 0; width: 100%; max-height: 48vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 12px;
        }
        @media (min-width: 650px) { #controls { grid-template-columns: repeat(4, 1fr); max-height: 250px; } }
        
        .btn {
            background: #12121c; color: #00ff66; border: 1px solid #00ff6666; padding: 9px 4px;
            font-family: 'Courier New'; font-size: 11.5px; font-weight: bold; cursor: pointer; border-radius: 4px; text-align: center; min-height: 38px; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover { background: #1c1c2e; outline: 2px solid #00ffff; }
        .btn-sys { border-color: #00ffff; color: #00ffff; }
        .btn-dlc { border-color: #ff00ff; color: #ff00ff; background: #220022; }
        .btn-back { border-color: #ff3333; color: #ff3333; background: #2b0011; }
        .btn-farm { border-color: #00ff88; color: #00ff88; background: #001f0c; }
        .btn-gear { border-color: #33ccff; color: #33ccff; background: #001122; }
        .btn-map { border-color: #00ffcc; color: #00ffcc; background: #002222; }
        .btn-mine { border-color: #ffaa00; color: #ffaa00; background: #221500; }
        .btn-combat { border-color: #ff0033; color: #ff0033; background: #33000a; }
        .btn-spin { border-color: #ffff00; color: #ffff00; background: #333300; }
        .btn-maid { border-color: #ff66ff; color: #ff66ff; background: #220022; }
        .btn-boss { border-color: #ff0055; color: #fff; background: #550011; box-shadow: 0 0 8px #ff0055; }
        .btn-forge { border-color: #ff8800; color: #ff8800; background: #2b1100; }
        .dex-card { background: #08080f; border: 1px solid #222238; border-radius: 6px; padding: 7px; margin: 4px 0; width: 98%; text-align: left; display: flex; align-items: center; gap: 8px; z-index: 3; position: relative; }
        .sys-icon { cursor:pointer; font-size:14px; background:#222; padding:2px 6px; border-radius:4px; border:1px solid #555; display: flex; align-items: center; justify-content: center;}

        /* ANIMATIONS */
        @keyframes travelSlide {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(8px); }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .travel-animation { animation: travelSlide 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes mineRumble {
            0% { transform: translate(0, 0); filter: brightness(0.9); }
            20% { transform: translate(-4px, 3px); filter: brightness(1.2) hue-rotate(15deg); }
            40% { transform: translate(4px, -2px); filter: brightness(0.85); }
            60% { transform: translate(-3px, -4px); filter: brightness(1.15); }
            80% { transform: translate(4px, 4px); filter: brightness(0.9); }
            100% { transform: translate(0, 0); filter: brightness(1); }
        }
        .mining-animation { animation: mineRumble 0.25s ease-in-out infinite; }

        @keyframes restNightSequence {
            0% { background: #000; opacity: 0; transform: scale(0.95); }
            30% { background: #050515; opacity: 1; transform: scale(1); }
            70% { background: #02020a; opacity: 1; transform: scale(1.02); }
            100% { background: #000; opacity: 0; transform: scale(1.05); }
        }
        .rest-scene { animation: restNightSequence 2s ease-in-out forwards; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }
        .zzz-1 { animation: zFloat 1.5s infinite ease-in; display: inline-block; font-size: 20px; color: #00ffff; }
        .zzz-2 { animation: zFloat 1.5s infinite ease-in 0.5s; display: inline-block; font-size: 26px; color: #ff00ff; }
        .zzz-3 { animation: zFloat 1.5s infinite ease-in 1s; display: inline-block; font-size: 32px; color: #ffff00; }
        @keyframes zFloat { 0% { transform: translateY(0px) translateX(0px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-30px) translateX(15px); opacity: 0; } }

        @keyframes wheelSpinAnim {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(1080deg) scale(1.1); filter: hue-rotate(90deg); }
            100% { transform: rotate(2160deg) scale(1); filter: hue-rotate(0deg); }
        }
        .wheel-spinning { animation: wheelSpinAnim 2.2s cubic-bezier(0.15, 0.85, 0.35, 1.05) forwards; display: inline-block; }

        @keyframes ballToss {
            0% { transform: translateY(60px) scale(0.4) rotate(0deg); opacity: 0; }
            40% { transform: translateY(-20px) scale(1.1) rotate(360deg); opacity: 1; }
            100% { transform: translateY(0px) scale(1) rotate(720deg); opacity: 1; }
        }
        @keyframes ballWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-28deg) scale(1.05); }
            30% { transform: rotate(28deg) scale(1.05); }
            45% { transform: rotate(-18deg) scale(1.02); }
            60% { transform: rotate(18deg) scale(1.02); }
            75% { transform: rotate(-8deg) scale(1); }
            85% { transform: rotate(8deg) scale(1); }
        }
        .pokeball-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; margin: 10px 0; }
        .pokeball-sprite { width: 60px; height: 60px; border-radius: 50%; position: relative; box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.4); border: 3px solid #111; overflow: hidden; animation: ballToss 0.6s ease-out forwards, ballWobble 1.2s ease-in-out 0.6s 2; }
        .ball-top { width: 100%; height: 50%; background: #ff1a1a; }
        .ball-bottom { width: 100%; height: 50%; background: #ffffff; }
        .ball-center-band { position: absolute; top: 46%; left: 0; width: 100%; height: 8%; background: #111; z-index: 4; }
        .ball-center-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: #ffffff; border: 2px solid #111; z-index: 5; box-shadow: 0 0 4px #fff; }
    </style>
</head>
<body>
    <audio id="bg-music" loop></audio>

    <div id="save-toast" style="position:fixed; bottom:20px; right:20px; background:#002211; border:1px solid #00ff66; color:#00ff66; padding:6px 12px; border-radius:4px; font-size:12px; z-index:9999; display:none;">💾 Game Saved</div>
    
    <div id="stats-bar">
        <div style="display:flex; align-items:center; gap:6px;">
            🌍 <span id="loc-display">Nexus HQ</span> | <span class="stat-highlight" id="player-name-display">Trainer</span>
            <span class="sys-icon" id="audio-btn" onclick="toggleAudio()" title="Toggle Music">🔇</span>
            <span class="sys-icon" onclick="toggleFullscreen()" title="Toggle Fullscreen">🔲</span>
            <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.5" onchange="setVolume(this.value)" style="width:40px; margin-left: 5px;">
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
            <span onclick="showLivePlayersModal()" style="cursor: pointer; color: #00ff88; background: #002211; border: 1px solid #00ff88; padding: 2px 5px; border-radius: 4px; font-weight: bold;">🟢 <span id="global-online-count">1</span></span>
            <span onclick="showLeaderboardModal()" style="cursor: pointer; color: #ffff00; background: #222200; border: 1px solid #ffff00; padding: 2px 5px; border-radius: 4px; font-weight: bold;">🏆 Rank</span>
            ⭐ <span id="active-champ-display" style="color:#00ffff; font-weight:bold;">Astolfo</span> |
            🏰 Spire: <span id="spire-floor-display" style="color:#ffaa00; font-weight:bold;">F1</span> |
            💰 $<span class="stat-money" id="funds-display">5000</span> | Day <span id="day-display">1</span> | ⚡ <span id="stamina-display">100</span>
        </div>
    </div>
    
    <div id="screen-wrapper">
        <div id="console"></div>
    </div>

    <div id="controls"></div>

<script>
    let socket = null;
    try { socket = io({ transports: ['websocket', 'polling'] }); } catch(e) {}

    // --- AUDIO CONTROLLER ---
    let isMuted = true;
    let currentTrack = "";
    
    function playMusic(trackName) {
        if (currentTrack === trackName) return; 
        currentTrack = trackName;
        let aud = document.getElementById("bg-music");
        if (!aud) return;
        aud.src = `music/${trackName}.mp3`;
        if (!isMuted) {
            aud.play().catch(e => console.log("Autoplay waiting for user gesture:", e));
        }
    }

    function toggleAudio() {
        let aud = document.getElementById("bg-music");
        if(isMuted) { 
            isMuted = false; 
            document.getElementById("audio-btn").innerText = "🔊"; 
            if(!currentTrack) playMusic('mainhq');
            else aud.play().catch(()=>{});
        } else { 
            aud.pause(); 
            isMuted = true; 
            document.getElementById("audio-btn").innerText = "🔇"; 
        }
    }
    
    function setVolume(val) { 
        let aud = document.getElementById("bg-music");
        if (aud) aud.volume = val; 
    }
    
    function toggleFullscreen() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(()=>{}); }
        else { document.exitFullscreen(); }
    }

    // --- STATE DEFINITION & PORTAL ENCOUNTERS ---
    let globalActiveTrainers = [];
    let globalLeaderboard = [];
    let globalChatMessages = [];
    let roomChatMessages = [];
    let globalMarketListings = [];
    let currentSaveSlot = 1;
    let currentRoomId = null;
    let onlineRoomPlayers = [];
    let activePvPSession = null;
    let singlePlayerCombatSession = null;
    let serverRaidBoss = { name: "Void Titan Chronos", hp: 5000, maxHp: 5000 };

    const PORTAL_POOLS = {
        'standard': [{ name: "Astolfo", origin: "Fate", power: 30, maxHp: 120, encounterDesc: "A mysterious pink-haired paladin emerges from the astral rift!" }, { name: "Felix Argyle", origin: "Re:Zero", power: 28, maxHp: 110, encounterDesc: "A cheerful feline healer steps forward with a wave!" }],
        'femboyHooters': [{ name: "Astolfo (Hooters)", origin: "Femboy Hooters", power: 32, maxHp: 125, encounterDesc: "Astolfo greets you holding a tray of multiverse wings!" }, { name: "Venti", origin: "Hooters", power: 29, maxHp: 115, encounterDesc: "A breezy bard glides through the portal humming a tune!" }],
        'bikiniBottom': [{ name: "SpongeBob", origin: "Bikini Bottom", power: 20, maxHp: 90, encounterDesc: "A porous yellow fry cook arrives ready to flip krabby patties!" }, { name: "Patrick Star", origin: "Bikini Bottom", power: 35, maxHp: 150, encounterDesc: "A pink starfish tumbles out from under a rock dimension!" }],
        'halloween': [{ name: "Jack Skellington", origin: "Halloween Town", power: 34, maxHp: 110, encounterDesc: "The Pumpkin King bows gracefully from the shadows!" }],
        'christmasPortal': [{ name: "Santa Claus", origin: "North Pole", power: 40, maxHp: 200, encounterDesc: "Jolly laughter rings out as a festive titan appears with gifts!" }],
        'gothIhop': [{ name: "Goth Raven", origin: "Azarath", power: 35, maxHp: 130, encounterDesc: "Dark shadows swirl as a brooding sorceress manifests!" }],
        'maidCafe': [{ name: "Doug", origin: "Archive", power: 50, maxHp: 200, encounterDesc: "An elite multiverse collector greets you with premium ores!" }, { name: "Zelda", origin: "Hyrule", power: 25, maxHp: 105, encounterDesc: "A royal princess glides through with an ancient aura!" }]
    };

    let defaultGameState = {
        playerName: "Trainer", funds: 5000, stamina: 100, day: 1, location: "Nexus HQ",
        activeChampionIndex: 0, spireFloor: 1,
        equippedGear: { weapon: "None (+0 ATK)", armor: "None (+0 DEF)" },
        inventory: ["Energy Core", "Pokéball", "Copper Ore", "Diamond", "Healing Potion"],
        staff: [{ name: "Astolfo", origin: "Fate", power: 30, maxHp: 120, hp: 120, level: 1, locked: true, loyalty: 10, evolved: false }],
        farm: { plots: [{ crop: null, stage: 0, ready: false }, { crop: null, stage: 0, ready: false }, { crop: null, stage: 0, ready: false }] },
        pokedex: {}, dlcUnlocked: false
    };

    let game = JSON.parse(JSON.stringify(defaultGameState));

    function sanitizeGameState(loadedState) {
        let clean = Object.assign(JSON.parse(JSON.stringify(defaultGameState)), loadedState || {});
        if (!Array.isArray(clean.staff) || clean.staff.length === 0) {
            clean.staff = [{ name: "Astolfo", origin: "Fate", power: 30, maxHp: 120, hp: 120, level: 1, locked: true, loyalty: 10, evolved: false }];
        } else {
            clean.staff = clean.staff.map(member => {
                if (typeof member === "string") {
                    return { name: member, origin: "Multiverse", power: 30, maxHp: 120, hp: 120, level: 1, locked: false, loyalty: 10, evolved: false };
                }
                return {
                    name: member.name || "Companion",
                    origin: member.origin || "Multiverse",
                    power: member.power || 25,
                    maxHp: member.maxHp || 100,
                    hp: member.hp !== undefined ? member.hp : (member.maxHp || 100),
                    level: member.level || 1,
                    locked: !!member.locked,
                    loyalty: member.loyalty || 10,
                    evolved: !!member.evolved
                };
            });
        }
        if (!Array.isArray(clean.inventory)) clean.inventory = ["Energy Core", "Pokéball", "Copper Ore"];
        if (!clean.equippedGear) clean.equippedGear = { weapon: "None (+0 ATK)", armor: "None (+0 DEF)" };
        if (!clean.farm || !Array.isArray(clean.farm.plots)) clean.farm = { plots: [{ crop: null, stage: 0, ready: false }, { crop: null, stage: 0, ready: false }, { crop: null, stage: 0, ready: false }] };
        clean.activeChampionIndex = (clean.activeChampionIndex !== undefined && clean.activeChampionIndex < clean.staff.length) ? clean.activeChampionIndex : 0;
        return clean;
    }

    function getActiveChampion() {
        if (!game.staff || game.staff.length === 0) sanitizeGameState(game);
        let idx = (game.activeChampionIndex !== undefined && game.activeChampionIndex < game.staff.length) ? game.activeChampionIndex : 0;
        return game.staff[idx] || game.staff[0];
    }

    function getSaveKey(slot) { return `unidexSave_slot_${slot}`; }
    
    function saveGame() {
        localStorage.setItem(getSaveKey(currentSaveSlot), JSON.stringify(game));
        syncTrainerPresence();
        showSaveToast();
    }

    function showSaveToast() {
        let toast = document.getElementById("save-toast");
        if (toast) { toast.style.display = "block"; setTimeout(() => { toast.style.display = "none"; }, 2000); }
    }

    function syncTrainerPresence() {
        if (socket && socket.connected) {
            const champ = getActiveChampion();
            socket.emit('registerTrainerPresence', {
                playerName: game.playerName || "Trainer", location: game.location || "Nexus HQ",
                funds: game.funds || 0, champion: champ.name, power: champ.power || 25
            });
            if (currentRoomId) {
                socket.emit('joinRoom', { roomId: currentRoomId, player: { name: game.playerName, location: game.location, champion: champ.name, power: champ.power } });
            }
        }
    }

    // --- SOCKET HANDLERS ---
    if (socket) {
        socket.on('globalOnlineUpdate', (data) => {
            const countEl = document.getElementById("global-online-count");
            if (countEl) countEl.innerText = data.totalOnline;
            globalActiveTrainers = data.activePlayers || [];
            globalLeaderboard = data.leaderboard || [];
            if (data.raidBoss) serverRaidBoss = data.raidBoss;
            if (data.marketListings) globalMarketListings = data.marketListings;
        });

        socket.on('marketUpdate', (listings) => { globalMarketListings = listings; });
        socket.on('itemSoldNotification', ({ item, price, buyer }) => {
            game.funds = (game.funds || 0) + price; saveGame(); updateUI();
            alert(`💰 [MARKET SALE]: Sold [${item}] to Trainer ${buyer} for $${price}!`);
        });
        socket.on('itemPurchasedSuccess', (itemObj) => {
            if (!game.inventory) game.inventory = [];
            game.inventory.push(itemObj.item); saveGame(); updateUI();
            alert(`🎉 [MARKET BOUGHT]: Purchased [${itemObj.item}] from ${itemObj.sellerName}!`);
            showLiveMarketBoard();
        });

        socket.on('raidBossUpdate', (boss) => { serverRaidBoss = boss; });
        socket.on('raidBossHit', (data) => {
            serverRaidBoss.hp = data.bossHp;
            let logEl = document.getElementById("raid-boss-combat-log");
            if (logEl) {
                document.getElementById("console").className = "mining-animation";
                setTimeout(() => document.getElementById("console").className = "", 250);
                logEl.innerHTML += `<div style="color:#00ffff; font-size:11px;">${data.log}</div>`;
                logEl.scrollTop = logEl.scrollHeight;
                let hpBar = document.getElementById("boss-hp-fill");
                if (hpBar) hpBar.style.width = `${Math.max(0, (data.bossHp / data.bossMaxHp) * 100)}%`;
                let hpText = document.getElementById("boss-hp-text");
                if (hpText) hpText.innerText = `${data.bossHp} / ${data.bossMaxHp}`;
            }
            if (data.isDefeated) {
                game.funds = (game.funds || 0) + (data.reward || 3000);
                if (!game.inventory) game.inventory = [];
                game.inventory.push("Diamond");
                saveGame(); updateUI();
                alert(`🏆 WORLD BOSS SLAIN by ${data.slayer}! Claimed $${data.reward || 3000} & 1x Diamond!`);
            }
        });

        socket.on('chatHistory', (history) => { globalChatMessages = history || []; });
        socket.on('receiveGlobalMessage', (msg) => { globalChatMessages.push(msg); if (globalChatMessages.length > 50) globalChatMessages.shift(); refreshChatBoxes(); });
        socket.on('receiveRoomMessage', (msg) => { roomChatMessages.push(msg); refreshChatBoxes(); });

        socket.on('assignedRandomRoom', (assignedRoom) => {
            currentRoomId = assignedRoom; const champ = getActiveChampion();
            socket.emit('joinRoom', { roomId: currentRoomId, player: { name: game.playerName, location: game.location, champion: champ.name, power: champ.power } });
            renderActiveLobbyView();
        });

        socket.on('roomUpdate', ({ roomId, players }) => { onlineRoomPlayers = players || []; if (currentRoomId === roomId) renderActiveLobbyView(); });

        socket.on('receiveTradeOffer', ({ senderId, senderName, item }) => {
            playMusic('trade');
            if (confirm(`🤝 [ITEM TRADE]: ${senderName} offered 1x [${item}]! Trade an item back?`)) {
                let tradeItem = prompt(`Enter item from bag:\n${game.inventory.join(', ')}`, game.inventory[0]);
                if (tradeItem && game.inventory.includes(tradeItem)) {
                    let idx = game.inventory.indexOf(tradeItem); game.inventory.splice(idx, 1); game.inventory.push(item);
                    saveGame(); updateUI();
                    socket.emit('acceptTradeOffer', { targetId: senderId, targetItem: item, myItem: tradeItem, senderName: game.playerName });
                    alert(`✅ Trade done! Received [${item}]!`);
                }
            }
            playMusic('mainhq');
        });

        socket.on('tradeCompleted', ({ receivedItem, partnerName }) => {
            if (!game.inventory) game.inventory = []; game.inventory.push(receivedItem);
            saveGame(); updateUI(); alert(`🎉 Received [${receivedItem}] from ${partnerName}!`); showInventoryMenu();
        });

        socket.on('receiveCharacterTradeOffer', ({ senderId, senderName, character }) => {
            playMusic('trade');
            if (confirm(`🎭 [HERO TRADE]: ${senderName} offered [${character.name}]! Trade back?`)) {
                if (game.staff.length <= 1) { alert("❌ Cannot trade your only hero!"); playMusic('mainhq'); return; }
                let charNames = game.staff.map((c, i) => `${i + 1}. ${c.name}`).join('\n');
                let sel = parseInt(prompt(`Enter hero number to trade:\n${charNames}`)) - 1;
                if (!isNaN(sel) && game.staff[sel] && !game.staff[sel].locked) {
                    let sent = game.staff.splice(sel, 1)[0]; game.staff.push(character); saveGame(); updateUI();
                    socket.emit('acceptCharacterTradeOffer', { targetId: senderId, targetCharacter: character, myCharacter: sent, senderName: game.playerName });
                    alert(`🎉 Sent [${sent.name}] & recruited [${character.name}]!`); showRosterMenu();
                } else { alert("❌ Hero is locked or invalid choice!"); }
            }
            playMusic('mainhq');
        });

        socket.on('characterTradeCompleted', ({ receivedCharacter, partnerName }) => {
            if (!game.staff) game.staff = []; game.staff.push(receivedCharacter);
            saveGame(); updateUI(); alert(`🎉 Recruited [${receivedCharacter.name}] from ${partnerName}!`); showRosterMenu();
        });

        socket.on('pvpChallengeReceived', ({ challengerId, challengerName, champion }) => {
            if (confirm(`⚔️ [LIVE DUEL]: ${challengerName} (${champion}) challenged you! Accept?`)) {
                const myChamp = getActiveChampion();
                socket.emit('acceptPvP', { challengerId, accepterName: game.playerName, champion: myChamp.name });
            }
        });

        socket.on('startLivePvP', (data) => {
            playMusic('battle');
            activePvPSession = { battleId: data.battleId, p1Id: data.p1Id, p2Id: data.p2Id, turn: data.p1Id, p1Hp: data.p1Max, p2Hp: data.p2Max, p1Max: data.p1Max, p2Max: data.p2Max, log: "⚔️ Live match started!" };
            renderLivePvPScreen();
        });

        socket.on('pvpRoundUpdate', (data) => {
            if (!activePvPSession) return;
            activePvPSession.turn = data.turn; activePvPSession.p1Hp = data.p1Hp; activePvPSession.p2Hp = data.p2Hp; activePvPSession.log = data.lastActionLog;
            
            document.getElementById("console").className = "mining-animation";
            setTimeout(() => document.getElementById("console").className = "", 250);

            if (data.isOver) {
                if (socket.id === data.winnerId) { game.funds = (game.funds || 0) + 1200; saveGame(); updateUI(); alert("🏆 VICTORY! Won duel and claimed $1200!"); } 
                else { alert("💀 DEFEAT! Knocked out in live duel!"); }
                activePvPSession = null; playMusic('mainhq'); renderActiveLobbyView();

            };

    function renderSinglePlayerCombat() {
        const c = singlePlayerCombatSession;
        const champ = getActiveChampion();
        clearConsole("center", "#20000a", "#ff0033");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0033; font-size:16px;">⚔️ BATTLE vs ${c.enemyName.toUpperCase()}</h2>
            <div style="display:flex; justify-content:space-around; width:100%; margin: 6px 0;">
                <div class="dex-card" style="width:48%; display:block; border-color:#00ff66; text-align:center;">
                    <strong style="color:#00ffff;">${champ.name}</strong><br>❤️ <span style="color:#33ff33;">${c.champHp} / ${c.champMaxHp}</span>
                </div>
                <div class="dex-card" style="width:48%; display:block; border-color:#ff0055; text-align:center;">
                    <strong style="color:#ff0055;">${c.enemyName}</strong><br>❤️ <span style="color:#ff3333;">${c.enemyHp} / ${c.enemyMaxHp}</span>
                </div>
            </div>
            <p style="color:#ffff00; font-size:12px;">${c.log}</p>
        `;
        renderButtons([
            { text: "⚔️ Strike", class: "btn btn-combat", action: () => executeSinglePlayerAction("strike") },
            { text: "🛡️ Guard", class: "btn btn-sys", action: () => executeSinglePlayerAction("guard") },
            { text: "⚡ Special (10 Stm)", class: "btn btn-dlc", action: () => executeSinglePlayerAction("special") },
            { text: "🏃 Flee", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function executeSinglePlayerAction(type) {
        const c = singlePlayerCombatSession;
        const champ = getActiveChampion();
        if (type === "special") {
            if ((game.stamina || 0) < 10) { alert("Not enough stamina!"); return; }
            game.stamina -= 10; saveGame(); updateUI();
        }

        if (type === "guard") {
            c.guarding = true; c.log = `${champ.name} prepares to block incoming damage!`;
        } else {
            let mult = type === "special" ? 1.8 : 1.0;
            let dmg = Math.floor((champ.power || 25) * mult + Math.random() * 8);
            c.enemyHp = Math.max(0, c.enemyHp - dmg);
            c.log = `${champ.name} hit ${c.enemyName} for ${dmg} damage!`;
            document.getElementById("console").className = "mining-animation";
            setTimeout(() => document.getElementById("console").className = "", 250);
        }

        if (c.enemyHp <= 0) {
            game.funds = (game.funds || 0) + c.reward; saveGame(); updateUI();
            alert(`🎉 Won battle! Earned $${c.reward}!`);
            showMainMenu(); return;
        }

        setTimeout(() => {
            let enemyHit = c.enemyDmg;
            if (c.guarding) { enemyHit = Math.floor(enemyHit * 0.5); c.guarding = false; }
            c.champHp = Math.max(0, c.champHp - enemyHit);
            c.log += ` ${c.enemyName} retaliated for ${enemyHit} damage!`;
            document.getElementById("console").className = "mining-animation";
            setTimeout(() => document.getElementById("console").className = "", 250);

            if (c.champHp <= 0) { alert("💀 Champion knocked out! Returning to HQ..."); showMainMenu(); } 
            else { renderSinglePlayerCombat(); }
        }, 600);
    }

    function executeSpireFight(floor, mobHp, mobDmg, reward) {
        const champ = getActiveChampion(); let champHp = champ.maxHp || 120;
        document.getElementById("console").className = "mining-animation";
        setTimeout(() => document.getElementById("console").className = "", 300);

        while (mobHp > 0 && champHp > 0) {
            let dmg = Math.floor((champ.power || 25) + Math.random() * 10); mobHp -= dmg;
            if (mobHp <= 0) break;
            champHp -= Math.max(1, mobDmg - (game.equippedGear && game.equippedGear.armor && game.equippedGear.armor.includes("Aegis") ? 8 : 0));
        }

        if (champHp > 0) {
            game.spireFloor = floor + 1; game.funds = (game.funds || 0) + reward;
            if (!game.inventory) game.inventory = []; if (floor % 3 === 0) game.inventory.push("Diamond");
            saveGame(); updateUI(); alert(`🎉 CLEARED FLOOR ${floor}! Claimed $${reward} and advanced!`); showSpireDungeonMenu();
        } else {
            alert(`💀 Champion was defeated on Floor ${floor}! Train your team or upgrade gear!`); showMainMenu();
        }
    }

    function craftGear(gearName, slot, reqItem1, reqItem2, goldCost, atkBoost=0, hpBoost=0) {
        if (!game.inventory) game.inventory = [];
        if ((game.funds || 0) < goldCost || !game.inventory.includes(reqItem1) || !game.inventory.includes(reqItem2)) { alert(`❌ Missing materials! Need: 1x ${reqItem1}, 1x ${reqItem2}, and $${goldCost}!`); return; }
        game.funds -= goldCost; game.inventory.splice(game.inventory.indexOf(reqItem1), 1); game.inventory.splice(game.inventory.indexOf(reqItem2), 1);
        if (!game.equippedGear) game.equippedGear = {}; game.equippedGear[slot] = gearName;
        if (game.staff) { game.staff.forEach(c => { c.power = (c.power || 25) + atkBoost; c.maxHp = (c.maxHp || 100) + hpBoost; c.hp = c.maxHp; }); }
        saveGame(); updateUI();
        document.getElementById("console").className = "mining-animation"; setTimeout(() => document.getElementById("console").className = "", 300);
        alert(`🔨 Successfully forged and equipped [${gearName}]!`); showBlacksmithForgeMenu();
    }

    function setActiveChampion(idx) { game.activeChampionIndex = idx; saveGame(); updateUI(); showRosterMenu(); }
    function toggleLockCompanion(idx) { game.staff[idx].locked = !game.staff[idx].locked; saveGame(); showRosterMenu(); }
    
    function trainCompanion(idx, cost) {
        let member = game.staff[idx];
        if ((game.funds || 0) >= cost) {
            game.funds -= cost; member.level = (member.level || 1) + 1; member.power = (member.power || 25) + 6; member.maxHp = (member.maxHp || 100) + 15; member.hp = member.maxHp;
            saveGame(); updateUI(); alert(`🎉 ${member.name} reached Level ${member.level}! Power is now ${member.power}!`); showRosterMenu();
        } else { alert(`❌ Need $${cost} to train!`); }
    }

    function limitBreakEvolve(idx) {
        let member = game.staff[idx];
        if ((member.level || 1) < 5 || (member.loyalty || 0) < 50) { alert(`❌ Requirements: Level 5+ & 50+ Loyalty!`); return; }
        if (member.evolved) { alert("✨ This hero is already Ascended!"); return; }
        member.name = `Ascended ${member.name} ⚡`; member.power = (member.power || 25) * 2; member.maxHp = (member.maxHp || 100) * 2; member.hp = member.maxHp; member.evolved = true;
        saveGame(); updateUI(); alert(`🌟 EVOLUTION SUCCESS! ${member.name} base stats are DOUBLED!`); showRosterMenu();
    }

    function releaseCompanion(idx) {
        let member = game.staff[idx];
        if (game.staff.length <= 1) { alert("❌ Cannot release only companion!"); return; }
        if (member.locked) { alert("🔒 Unlock companion first!"); return; }
        if (confirm(`⚠️ Release ${member.name}?`)) {
            game.staff.splice(idx, 1); if (game.activeChampionIndex >= game.staff.length) game.activeChampionIndex = 0;
            game.funds = (game.funds || 0) + 150; saveGame(); updateUI(); showRosterMenu();
        }
    }

        let member = game.staff[idx];
        clearConsole("center", "#150020", "#ff66ff");

        renderButtons([
            { text: "🎁 Gift Diamond (+15 Loyalty)", class: "btn btn-farm", action: () => {
                if (game.inventory && game.inventory.includes("Diamond")) {
                    game.inventory.splice(game.inventory.indexOf("Diamond"), 1); member.loyalty = Math.min(100, (member.loyalty || 0) + 15); member.power = (member.power || 25) + 4;
                    saveGame(); updateUI(); alert(`🎁 Gave Diamond! Loyalty is now ${member.loyalty}!`); talkToCompanion(idx);
                } else { alert("❌ No Diamond in inventory!"); }

    function playBlackjackMinigame() {
        if ((game.funds || 0) < 250) { alert("❌ Need $250 to play!"); return; }
        game.funds -= 250; let pTotal = Math.floor(4 + Math.random() * 16); let dTotal = Math.floor(14 + Math.random() * 8);

    function initiateCharacterTrade(targetId, targetName) {
        if (!game.staff || game.staff.length <= 1) { alert("❌ Need more than 1 companion!"); return; }
        let listStr = game.staff.map((c, i) => `${i + 1}. ${c.name}`).join('\n');
        let sel = parseInt(prompt(`Select hero number:\n${listStr}`)) - 1;
        if (!isNaN(sel) && game.staff[sel] && !game.staff[sel].locked) {
            let chosen = game.staff.splice(sel, 1)[0];
            saveGame(); updateUI();
            if (socket) socket.emit('offerTradeCharacter', { roomId: currentRoomId, targetId, character: chosen, senderName: game.playerName });
            alert(`🎭 Offered [${chosen.name}]!`);

        globalLeaderboard.forEach((user, idx) => {
            let badge = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx + 1}`;
            html += `<div class="dex-card" style="font-size: 12px; padding: 5px; display:flex; justify-content:space-between;"><span><strong>${badge} ${user.name}</strong></span><span style="color:#00ff66;">💰 $${Math.floor(user.funds || 0)}</span></div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function showGlobalChatScreen() {
        clearConsole("flex-start", "#001a22", "#00ffff");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #00ffff; font-size: 15px; margin: 3px 0;">💬 GLOBAL CHAT</h2>
            <div id="global-chat-box" style="width:100%; max-width:400px; height:130px; background:#05050a; border:1px solid #00ffff55; border-radius:4px; padding:8px; overflow-y:auto; font-size:12px; margin-bottom:6px;"></div>
            <div style="display:flex; gap:6px; width:100%; max-width:400px;">
                <input type="text" id="chat-input-text" placeholder="Message..." style="flex:1; background:#111; color:#0f0; border:1px solid #0ff; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px;" />
                <button class="btn btn-sys" style="padding:6px 10px;" onclick="sendGlobalChatMsg()">Send</button>
            </div>
        `;
        refreshChatBoxes();
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function sendGlobalChatMsg() {
        let input = document.getElementById("chat-input-text");
        if (!input || !input.value.trim()) return;
        if (socket && socket.connected) socket.emit('sendGlobalMessage', { name: game.playerName || "Trainer", text: input.value.trim() });
        input.value = "";
    }

    function showRoomChatScreen() {
        clearConsole("flex-start", "#002022", "#ffaa00");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ffaa00; font-size: 15px; margin: 3px 0;">💬 ROOM CHAT [${currentRoomId}]</h2>
            <div id="room-chat-box" style="width:100%; max-width:400px; height:130px; background:#05050a; border:1px solid #ffaa0055; border-radius:4px; padding:8px; overflow-y:auto; font-size:12px; margin-bottom:6px;"></div>
            <div style="display:flex; gap:6px; width:100%; max-width:400px;">
                <input type="text" id="room-chat-input" placeholder="Message..." style="flex:1; background:#111; color:#ffaa00; border:1px solid #ffaa00; padding:6px; font-family:'Courier New'; font-size:12px; border-radius:4px;" />
                <button class="btn btn-mine" style="padding:6px 10px;" onclick="sendRoomChatMsg()">Send</button>
            </div>
        `;
        refreshChatBoxes();
        renderButtons([{ text: "⬅ Back to Lobby", class: "btn btn-back", action: renderActiveLobbyView }]);
    }

    function sendRoomChatMsg() {
        let input = document.getElementById("room-chat-input");
        if (!input || !input.value.trim()) return;
        if (socket && socket.connected) socket.emit('sendRoomMessage', { roomId: currentRoomId, name: game.playerName || "Trainer", text: input.value.trim() });
        input.value = "";
    }

    window.onload = () => { showIntroScreen(); };
</script>
</body>
</html>
