<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UniDex Legends</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            background-color: #030305; color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 6px;
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column;
            user-select: none; touch-action: manipulation;
            padding-bottom: max(6px, env(safe-area-inset-bottom));
        }

        #stats-bar {
            background: linear-gradient(180deg, #12121c 0%, #08080f 100%);
            border: 1px solid #00ffff55;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
            padding: 4px 8px; margin-bottom: 6px; border-radius: 6px;
            font-size: 11.5px; flex-shrink: 0; display: none;
            justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 4px;
        }
        .stat-highlight { color: #ff00ff; font-weight: bold; text-shadow: 0 0 8px #ff00ff88; }
        .stat-money { color: #ffff00; font-weight: bold; text-shadow: 0 0 8px #ffff0088; }
        
        #screen-wrapper {
            position: relative; flex: 1 1 auto; min-height: 120px;
            display: flex; width: 100%; margin-bottom: 6px; overflow: hidden;
        }

        #console {
            flex: 1 1 100%; min-height: 0; background-color: #020204;
            border: 2px solid #222233; padding: 10px; overflow-y: auto;
            border-radius: 8px; font-size: 13.5px; line-height: 1.4;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95), 0 0 20px rgba(0, 255, 100, 0.15);
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center;
            position: relative; -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
        }

        #console::-webkit-scrollbar, #controls::-webkit-scrollbar { width: 8px; height: 8px; }
        #console::-webkit-scrollbar-track, #controls::-webkit-scrollbar-track { background: #080811; border-radius: 4px; }
        #console::-webkit-scrollbar-thumb, #controls::-webkit-scrollbar-thumb { background: #00ffff55; border: 1px solid #00ffff; border-radius: 4px; }

        .touch-scroll-panel { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 10; pointer-events: auto; }
        .touch-scroll-btn { background: rgba(10, 10, 20, 0.85); color: #00ffff; border: 1px solid #00ffff; box-shadow: 0 0 8px rgba(0, 255, 255, 0.4); border-radius: 50%; width: 32px; height: 32px; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .touch-scroll-btn:active { background: #00ffff; color: #000; }

        #console::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.015), rgba(0, 255, 0, 0.04));
            z-index: 2; background-size: 100% 3px, 6px 100%; pointer-events: none; opacity: 0.65;
        }

        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #14141e; padding-bottom: 3px; width: 100%; text-align: left; position: relative; z-index: 3; }

        @keyframes travelSlide {
            0% { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(8px); }
            50% { transform: scale(1.2) rotate(5deg); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .travel-animation { animation: travelSlide 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; }

        @keyframes desertSandstorm {
            0% { background-position: 0 0; filter: sepia(0.8) brightness(1.1); transform: translateX(-4px); }
            50% { background-position: 100px 50px; filter: sepia(1) brightness(1.3); transform: translateX(4px); }
            100% { background-position: 0 0; filter: sepia(0.8) brightness(1.1); transform: translateX(-4px); }
        }
        .desert-scene { animation: desertSandstorm 2s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes volcanoEruption {
            0% { box-shadow: inset 0 0 30px rgba(255,50,0,0.3); transform: scale(1); }
            50% { box-shadow: inset 0 0 60px rgba(255,0,0,0.7); transform: scale(1.01); }
            100% { box-shadow: inset 0 0 30px rgba(255,50,0,0.3); transform: scale(1); }
        }
        .volcano-scene { animation: volcanoEruption 2s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes mineRumble {
            0% { transform: translate(0, 0); filter: brightness(0.9); }
            20% { transform: translate(-4px, 3px); filter: brightness(1.2) hue-rotate(15deg); }
            40% { transform: translate(4px, -2px); filter: brightness(0.85); }
            60% { transform: translate(-3px, -4px); filter: brightness(1.15); }
            80% { transform: translate(4px, 4px); filter: brightness(0.9); }
            100% { transform: translate(0, 0); filter: brightness(1); }
        }
        .mining-animation { animation: mineRumble 0.25s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }

        @keyframes restNightSequence {
            0% { background: #000; opacity: 0; transform: scale(0.95); }
            30% { background: #050515; opacity: 1; transform: scale(1); }
            70% { background: #02020a; opacity: 1; transform: scale(1.02); }
            100% { background: #000; opacity: 0; transform: scale(1.05); }
        }
        .rest-scene { animation: restNightSequence 4s ease-in-out forwards; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; width: 100%; height: 100%; }
        .zzz-1 { animation: zFloat 1.5s infinite ease-in; display: inline-block; font-size: 20px; color: #00ffff; }
        .zzz-2 { animation: zFloat 1.5s infinite ease-in 0.5s; display: inline-block; font-size: 26px; color: #ff00ff; }
        .zzz-3 { animation: zFloat 1.5s infinite ease-in 1s; display: inline-block; font-size: 32px; color: #ffff00; }
        @keyframes zFloat { 0% { transform: translateY(0px) translateX(0px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-30px) translateX(15px); opacity: 0; } }

        @keyframes saveToastFade { 0% { opacity: 0; transform: translateY(10px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
        #save-toast { position: fixed; bottom: 20px; right: 20px; background: #002211; border: 1px solid #00ff66; color: #00ff66; padding: 6px 12px; border-radius: 4px; font-size: 12px; z-index: 9999; display: none; box-shadow: 0 0 10px rgba(0,255,100,0.4); pointer-events: none; }

        @keyframes wheelSpinAnim {
            0% { transform: rotate(0deg) scale(0.9); }
            50% { transform: rotate(1080deg) scale(1.1); filter: hue-rotate(90deg); }
            100% { transform: rotate(2160deg) scale(1); filter: hue-rotate(0deg); }
        }
        .wheel-spinning { animation: wheelSpinAnim 2.2s cubic-bezier(0.15, 0.85, 0.35, 1.05) forwards; }

        @keyframes ballToss {
            0% { transform: translateY(60px) scale(0.4) rotate(0deg); opacity: 0; }
            40% { transform: translateY(-20px) scale(1.1) rotate(360deg); opacity: 1; }
            100% { transform: translateY(0px) scale(1) rotate(720deg); opacity: 1; }
        }
        @keyframes ballWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-28deg) scale(1.05); }
            30% { transform: rotate(28deg) scale(1.05); }
            45% { transform: rotate(-18deg) scale(1.02); }
            60% { transform: rotate(18deg) scale(1.02); }
            75% { transform: rotate(-8deg) scale(1); }
            85% { transform: rotate(8deg) scale(1); }
        }
        .pokeball-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 3; margin: 10px 0; }
        .pokeball-sprite { width: 60px; height: 60px; border-radius: 50%; position: relative; box-shadow: inset 0 0 8px rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.4); border: 3px solid #111; overflow: hidden; animation: ballToss 0.6s ease-out forwards, ballWobble 1.2s ease-in-out 0.6s 2; }
        .ball-top { width: 100%; height: 50%; background: #ff1a1a; }
        .ball-bottom { width: 100%; height: 50%; background: #ffffff; }
        .ball-center-band { position: absolute; top: 46%; left: 0; width: 100%; height: 8%; background: #111; z-index: 4; }
        .ball-center-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border-radius: 50%; background: #ffffff; border: 2px solid #111; z-index: 5; box-shadow: 0 0 4px #fff; }

        #controls {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;
            flex-shrink: 0; width: 100%; max-height: 42vh; overflow-y: auto;
            -webkit-overflow-scrolling: touch; z-index: 4; padding: 2px 2px 8px 2px;
        }
        @media (min-width: 650px) { #controls { grid-template-columns: repeat(4, 1fr); max-height: 250px; } }
        
        .btn {
            background: #12121c; color: #00ff66; border: 1px solid #00ff6666; padding: 8px 4px;
            font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: bold;
            cursor: pointer; border-radius: 4px; text-align: center; transition: all 0.15s ease;
            touch-action: manipulation; min-height: 38px; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover, .btn.gamepad-focused { background: #1c1c2e; box-shadow: 0 0 10px rgba(0, 255, 100, 0.8); outline: 2px solid #00ffff; }
        .btn:active, .btn.selected { background-color: #00ff66; color: #000; outline: 2px solid #ff00ff; }
        
        .btn-sys { border-color: #00ffff; color: #00ffff; }
        .btn-dlc { border-color: #ff00ff; color: #ff00ff; }
        .btn-villain { border-color: #ff0055; color: #ff0055; background: #2b0011; }
        .btn-back { border-color: #ff3333; color: #ff3333; }
        .btn-farm { border-color: #00ff88; color: #00ff88; background: #001f0c; }
        .btn-gear { border-color: #33ccff; color: #33ccff; background: #001122; }
        .btn-map { border-color: #00ffcc; color: #00ffcc; background: #002222; }
        .btn-mine { border-color: #ffaa00; color: #ffaa00; background: #221500; }
        .btn-combat { border-color: #ff0033; color: #ff0033; background: #33000a; }
        .btn-start { border-color: #00ffff; color: #00ffff; font-size: 13.5px; grid-column: span 2; background: #002222; }
        .btn-maid { border-color: #ff66ff; color: #ff66ff; background: #220022; }
        .btn-dex { border-color: #ffff00; color: #ffff00; background: #222200; }
        .btn-cyber { border-color: #ff9900; color: #ff9900; background: #2a1500; }
        .btn-waffle { border-color: #ffcc66; color: #ffcc66; background: #2a1c00; }
        .btn-goth { border-color: #aa00ff; color: #aa00ff; background: #1a0022; }
        .btn-bikini { border-color: #ffcc00; color: #ffcc00; background: #221800; }
        .btn-halloween { border-color: #ff6600; color: #ff6600; background: #1a0d00; }
        .btn-hooters { border-color: #ff5500; color: #ff9955; background: #331100; }
        .btn-spin { border-color: #ffff00; color: #ffff00; background: #333300; }
        .btn-raid { border-color: #ff0055; color: #ffffff; background: #4a001a; font-weight: bold; }
        .btn-forge { border-color: #ff8800; color: #ff8800; background: #2b1100; }
        
        .clickable-portrait { cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease; border: 3px solid transparent; border-radius: 10px; padding: 4px; background: rgba(0,0,0,0.4); }
        .clickable-portrait:hover { transform: scale(1.05); border-color: #00ffff; box-shadow: 0 0 12px rgba(0,255,255,0.4); }
        .dex-card { background: #08080f; border: 1px solid #222238; border-radius: 6px; padding: 8px; margin: 4px 0; width: 98%; text-align: left; position: relative; z-index: 3; box-shadow: 0 2px 6px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
    <div id="save-toast">💾 Game Saved</div>
    <div id="stats-bar">
        <div>🌍 <span id="loc-display">Nexus HQ</span> | Trainer: <span class="stat-highlight" id="player-name-display">Trainer</span></div>
        <div style="display: flex; align-items: center; gap: 6px;">
            <span onclick="showLivePlayersModal()" style="cursor: pointer; color: #00ff88; background: #002211; border: 1px solid #00ff88; padding: 2px 6px; border-radius: 4px; font-weight: bold;" title="Click to view online players">
                🟢 Online: <span id="global-online-count">1</span>
            </span>
            <span onclick="showLeaderboardModal()" style="cursor: pointer; color: #ffff00; background: #222200; border: 1px solid #ffff00; padding: 2px 6px; border-radius: 4px; font-weight: bold;">🏆 Rank</span>
            ⭐ <span id="active-champ-display" style="color:#00ffff; font-weight:bold;">Astolfo</span> |
            🏰 Spire: <span id="spire-floor-display" style="color:#ffaa00; font-weight:bold;">F1</span> |
            💰 $<span class="stat-money" id="funds-display">5000</span> | Day <span id="day-display">1</span> | ⚡ <span id="stamina-display">100</span> | 🌌 <span id="dex-count-display">0/2000</span>
            <input type="range" id="master-volume" min="0" max="1" step="0.05" value="0.35" oninput="updateMasterVolume(this.value)" style="width: 55px; cursor: pointer;" title="Master Volume">
            <button onclick="toggleAudioMute()" style="background:#111; color:#00ffff; border:1px solid #00ffff; border-radius:3px; padding:2px 5px; font-size:10px; cursor:pointer;" id="audio-toggle-btn">🔊</button>
            <button onclick="toggleFullScreen()" style="background:#111; color:#00ffcc; border:1px solid #00ffcc; border-radius:3px; padding:2px 5px; font-size:10px; cursor:pointer;" title="Toggle Fullscreen">⛶</button>
        </div>
    </div>
    
    <div id="screen-wrapper">
        <div id="console"></div>
        <div class="touch-scroll-panel">
            <div class="touch-scroll-btn" onclick="scrollConsole(-140)" title="Scroll Up">▲</div>
            <div class="touch-scroll-btn" onclick="scrollConsole(140)" title="Scroll Down">▼</div>
        </div>
    </div>

    <div id="controls"></div>

<script>
    let socket = null;
    try { socket = io({ transports: ['websocket', 'polling'] }); } catch(e) {}

    let REAL_CHARACTERS_DB = [];
    let currentSaveSlot = 1;
    let currentRoomId = null;
    let onlineRoomPlayers = [];
    let globalActiveTrainers = [];
    let globalLeaderboard = [];
    let globalMarketListings = [];
    let activePvPSession = null;
    let serverRaidBoss = { name: "Void Titan Chronos", hp: 5000, maxHp: 5000 };
    
    let masterVolume = 0.35;
    let isAudioMuted = false;
    let lastActiveTrack = 'intro';
    let gamepadBtnIndex = 0;

    function scrollConsole(offset) {
        const consoleDiv = document.getElementById("console");
        if (consoleDiv) consoleDiv.scrollBy({ top: offset, behavior: 'smooth' });
    }

    function syncTrainerPresence() {
        if (socket && socket.connected) {
            const champ = getActiveChampion();
            socket.emit('registerTrainerPresence', {
                playerName: game.playerName || "Trainer",
                location: game.location || "Nexus HQ",
                funds: game.funds || 0,
                champion: champ.name,
                power: champ.power || 25
            });
            if (currentRoomId) {
                socket.emit('joinRoom', {
                    roomId: currentRoomId,
                    player: { name: game.playerName, location: game.location, champion: champ.name, power: champ.power }
                });
            }
        }
    }

    if (socket) {
        socket.on('globalOnlineUpdate', (data) => {
            const countEl = document.getElementById("global-online-count");
            if (countEl) countEl.innerText = data.totalOnline;
            globalActiveTrainers = data.activePlayers || [];
            globalLeaderboard = data.leaderboard || [];
            if (data.raidBoss) serverRaidBoss = data.raidBoss;
            if (data.marketListings) globalMarketListings = data.marketListings;
        });

        socket.on('marketUpdate', (listings) => { globalMarketListings = listings; });
        socket.on('itemSoldNotification', ({ item, price, buyer }) => {
            game.funds = (game.funds || 0) + price; saveGame(); updateUI();
            alert(`💰 [MARKET SALE]: Sold [${item}] to Trainer ${buyer} for $${price}!`);
        });
        socket.on('itemPurchasedSuccess', (itemObj) => {
            if (!game.inventory) game.inventory = [];
            game.inventory.push(itemObj.item); saveGame(); updateUI();
            alert(`🎉 [MARKET BOUGHT]: Purchased [${itemObj.item}] from ${itemObj.sellerName}!`);
            showLiveMarketBoard();
        });

        socket.on('raidBossUpdate', (boss) => { serverRaidBoss = boss; });
        socket.on('raidBossHit', (data) => {
            serverRaidBoss.hp = data.bossHp;
            let logEl = document.getElementById("raid-boss-combat-log");
            if (logEl) {
                document.getElementById("console").className = "mining-animation";
                setTimeout(() => document.getElementById("console").className = "", 250);
                logEl.innerHTML += `<div style="color:#00ffff; font-size:11px;">${data.log}</div>`;
                logEl.scrollTop = logEl.scrollHeight;
                let hpBar = document.getElementById("boss-hp-fill");
                if (hpBar) hpBar.style.width = `${Math.max(0, (data.bossHp / data.bossMaxHp) * 100)}%`;
                let hpText = document.getElementById("boss-hp-text");
                if (hpText) hpText.innerText = `${data.bossHp} / ${data.bossMaxHp}`;
            }
            if (data.isDefeated) {
                game.funds = (game.funds || 0) + (data.reward || 3000);
                if (!game.inventory) game.inventory = [];
                game.inventory.push("Diamond");
                saveGame(); updateUI();
                alert(`🏆 WORLD BOSS SLAIN by ${data.slayer}! Claimed $${data.reward || 3000} & 1x Diamond!`);
            }
        });

        socket.on('receiveTradeOffer', ({ senderId, senderName, item }) => {
            playBGM('trade');
            if (confirm(`🤝 [ITEM TRADE]: ${senderName} offered 1x [${item}]! Trade an item back?`)) {
                let tradeItem = prompt(`Enter item from bag:\n${game.inventory.join(', ')}`, game.inventory[0]);
                if (tradeItem && game.inventory.includes(tradeItem)) {
                    let idx = game.inventory.indexOf(tradeItem); game.inventory.splice(idx, 1); game.inventory.push(item);
                    saveGame(); updateUI();
                    socket.emit('acceptTradeOffer', { targetId: senderId, targetItem: item, myItem: tradeItem, senderName: game.playerName });
                    alert(`✅ Trade done! Received [${item}]!`);
                }
            }
            playBGM('hq');
        });

        socket.on('tradeCompleted', ({ receivedItem, partnerName }) => {
            if (!game.inventory) game.inventory = []; game.inventory.push(receivedItem);
            saveGame(); updateUI(); alert(`🎉 Received [${receivedItem}] from ${partnerName}!`); showInventoryMenu();
        });

        socket.on('receiveCharacterTradeOffer', ({ senderId, senderName, character }) => {
            playBGM('trade');
            if (confirm(`🎭 [HERO TRADE]: ${senderName} offered [${character.name}]! Trade back?`)) {
                if (game.staff.length <= 1) { alert("❌ Cannot trade your only hero!"); playBGM('hq'); return; }
                let charNames = game.staff.map((c, i) => `${i + 1}. ${c.name}`).join('\n');
                let sel = parseInt(prompt(`Enter hero number to trade:\n${charNames}`)) - 1;
                if (!isNaN(sel) && game.staff[sel] && !game.staff[sel].locked) {
                    let sent = game.staff.splice(sel, 1)[0]; game.staff.push(character); saveGame(); updateUI();
                    socket.emit('acceptCharacterTradeOffer', { targetId: senderId, targetCharacter: character, myCharacter: sent, senderName: game.playerName });
                    alert(`🎉 Sent [${sent.name}] & recruited [${character.name}]!`); showRosterMenu();
                } else { alert("❌ Hero is locked or invalid choice!"); }
            }
            playBGM('hq');
        });

        socket.on('characterTradeCompleted', ({ receivedCharacter, partnerName }) => {
            if (!game.staff) game.staff = []; game.staff.push(receivedCharacter);
            saveGame(); updateUI(); alert(`🎉 Recruited [${receivedCharacter.name}] from ${partnerName}!`); showRosterMenu();
        });

        socket.on('pvpChallengeReceived', ({ challengerId, challengerName, champion }) => {
            if (confirm(`⚔️ [LIVE DUEL]: ${challengerName} (${champion}) challenged you! Accept?`)) {
                const myChamp = getActiveChampion();
                socket.emit('acceptPvP', { challengerId, accepterName: game.playerName, champion: myChamp.name });
            }
        });

        socket.on('startLivePvP', (data) => {
            playBGM('battle');
            activePvPSession = { battleId: data.battleId, p1Id: data.p1Id, p2Id: data.p2Id, turn: data.p1Id, p1Hp: data.p1Max, p2Hp: data.p2Max, p1Max: data.p1Max, p2Max: data.p2Max, log: "⚔️ Live match started!" };
            renderLivePvPScreen();
        });

        socket.on('pvpRoundUpdate', (data) => {
            if (!activePvPSession) return;
            activePvPSession.turn = data.turn; activePvPSession.p1Hp = data.p1Hp; activePvPSession.p2Hp = data.p2Hp; activePvPSession.log = data.lastActionLog;
            document.getElementById("console").className = "mining-animation";
            setTimeout(() => document.getElementById("console").className = "", 250);

            if (data.isOver) {
                if (socket.id === data.winnerId) { game.funds = (game.funds || 0) + 1200; saveGame(); updateUI(); alert("🏆 VICTORY! Won duel and claimed $1200!"); } 
                else { alert("💀 DEFEAT! Knocked out in live duel!"); }
                activePvPSession = null; playBGM('hq'); renderActiveLobbyView();
            } else { renderLivePvPScreen(); }
        });
    }

    function showLivePlayersModal() {
        clearConsole("center", "radial-gradient(circle at 50% 30%, #001f3f 0%, #000814 85%)", "#00ffff");
        let html = `
            <h2 style="color: #00ffff; font-size: 18px; margin-bottom: 4px;">🌐 ACTIVE MULTIVERSE TRAINERS</h2>
            <p style="color: #aaa; font-size: 12px; margin-bottom: 8px;">Total Active Players Online: <strong>${globalActiveTrainers.length}</strong></p>
            <div style="width: 95%; max-width: 360px; max-height: 180px; overflow-y: auto; margin-bottom: 10px;">
        `;
        globalActiveTrainers.forEach(t => {
            html += `
                <div class="dex-card" style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-size: 12px;">
                    <span style="color: #fff;">👤 <strong>${t.name}</strong></span>
                    <span style="color: #ffaa00; font-size: 11px;">📍 ${t.location}</span>
                </div>
            `;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;

    function updateGamepadFocus() {
        const btns = Array.from(document.querySelectorAll("#controls .btn"));
        if (!btns.length) return;
        gamepadBtnIndex = Math.max(0, Math.min(gamepadBtnIndex, btns.length - 1));
        btns.forEach((b, idx) => {
            if (idx === gamepadBtnIndex) b.classList.add("gamepad-focused");
            else b.classList.remove("gamepad-focused");
        });
    }

    let gpLastNav = 0;
    function pollGamepads() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const now = Date.now();
        for (let i = 0; i < gamepads.length; i++) {
            let gp = gamepads[i];
            if (gp) {
                let dpadUp = gp.buttons[12] && gp.buttons[12].pressed;
                let dpadDown = gp.buttons[13] && gp.buttons[13].pressed;
                let dpadLeft = gp.buttons[14] && gp.buttons[14].pressed;
                let dpadRight = gp.buttons[15] && gp.buttons[15].pressed;
                let stickY = gp.axes[1] || 0;
                let stickX = gp.axes[0] || 0;

                const btns = Array.from(document.querySelectorAll("#controls .btn"));
                if (btns.length && (now - gpLastNav > 180)) {
                    if (dpadRight || stickX > 0.5) { gamepadBtnIndex = (gamepadBtnIndex + 1) % btns.length; gpLastNav = now; updateGamepadFocus(); }
                    else if (dpadLeft || stickX < -0.5) { gamepadBtnIndex = (gamepadBtnIndex - 1 + btns.length) % btns.length; gpLastNav = now; updateGamepadFocus(); }
                    else if (dpadDown || stickY > 0.5) { gamepadBtnIndex = Math.min(gamepadBtnIndex + 2, btns.length - 1); gpLastNav = now; updateGamepadFocus(); }
                    else if (dpadUp || stickY < -0.5) { gamepadBtnIndex = Math.max(gamepadBtnIndex - 2, 0); gpLastNav = now; updateGamepadFocus(); }
                }

                if (gp.buttons[0] && gp.buttons[0].pressed) {
                    if (!window._gpA_pressed) { window._gpA_pressed = true; if (btns[gamepadBtnIndex]) btns[gamepadBtnIndex].click(); }
                } else { window._gpA_pressed = false; }

                if (gp.buttons[1] && gp.buttons[1].pressed) {
                    if (!window._gpB_pressed) { window._gpB_pressed = true; let backBtn = document.querySelector(".btn-back"); if (backBtn) backBtn.click(); }
                } else { window._gpB_pressed = false; }
            }
        }
        requestAnimationFrame(pollGamepads);
    }
    requestAnimationFrame(pollGamepads);

    function sanitizeGameState(loadedState) {
        let clean = Object.assign(defaultGameState(), loadedState || {});
        if (!Array.isArray(clean.staff) || clean.staff.length === 0) {
            clean.staff = [{ name: "Astolfo", rawName: "Astolfo", dexId: 9001, origin: "Fate/Apocrypha", hearts: 20, power: 30, maxHp: 120, hp: 120, level: 1, locked: true, loyalty: 10, evolved: false }];
        } else {
            clean.staff = clean.staff.map(member => {
                if (typeof member === "string") return { name: member, origin: "Multiverse", power: 30, maxHp: 120, hp: 120, level: 1, locked: false, loyalty: 10, evolved: false };
                return {
                    name: member.name || "Companion", origin: member.origin || "Multiverse", power: member.power || 25,
                    maxHp: member.maxHp || 100, hp: member.hp !== undefined ? member.hp : (member.maxHp || 100),
                    level: member.level || 1, locked: !!member.locked, loyalty: member.loyalty || 10, evolved: !!member.evolved, dexId: member.dexId || 0
                };
            });
        }
        if (!Array.isArray(clean.inventory)) clean.inventory = ["Pokéball", "Copper Ore", "Diamond"];
        clean.activeChampionIndex = (clean.activeChampionIndex !== undefined && clean.activeChampionIndex < clean.staff.length) ? clean.activeChampionIndex : 0;
        return clean;
    }

    function executeSpireFight(floor, mobHp, mobDmg, reward) {
        const champ = getActiveChampion();
        let champHp = champ.maxHp || 120;
        document.getElementById("console").className = "mining-animation";
        setTimeout(() => document.getElementById("console").className = "", 300);

        while (mobHp > 0 && champHp > 0) {
            let dmg = Math.floor((champ.power || 25) + Math.random() * 10);
            mobHp -= dmg;
            if (mobHp <= 0) break;
            champHp -= Math.max(1, mobDmg - (game.equippedGear && game.equippedGear.armor && game.equippedGear.armor.includes("Aegis") ? 8 : 0));
        }

        if (champHp > 0) {
            game.spireFloor = floor + 1;
            game.funds = (game.funds || 0) + reward;
            if (!game.inventory) game.inventory = [];
            if (floor % 3 === 0) game.inventory.push("Diamond");
            saveGame(); updateUI();
            alert(`🎉 CLEARED FLOOR ${floor}! Claimed $${reward} and advanced to Floor ${game.spireFloor}!`);
            showSpireDungeonMenu();
        } else {
            alert(`💀 Champion was defeated on Floor ${floor}! Train your team or upgrade gear at the Forge!`);
            showMainMenu();
        }
    }

    function craftGear(gearName, slot, reqItem1, reqItem2, goldCost, atkBoost=0, hpBoost=0) {
        if (!game.inventory) game.inventory = [];
        if ((game.funds || 0) < goldCost || !game.inventory.includes(reqItem1) || !game.inventory.includes(reqItem2)) {
            alert(`❌ Missing materials! Need: 1x ${reqItem1}, 1x ${reqItem2}, and $${goldCost}!`);
            return;
        }
        game.funds -= goldCost;
        game.inventory.splice(game.inventory.indexOf(reqItem1), 1);
        game.inventory.splice(game.inventory.indexOf(reqItem2), 1);
        if (!game.equippedGear) game.equippedGear = {};
        game.equippedGear[slot] = gearName;

        if (game.staff) {
            game.staff.forEach(c => {
                c.power = (c.power || 25) + atkBoost;
                c.maxHp = (c.maxHp || 100) + hpBoost;
                c.hp = c.maxHp;
            });
        }
        saveGame(); updateUI();
        document.getElementById("console").className = "mining-animation";
        setTimeout(() => document.getElementById("console").className = "", 300);
        alert(`🔨 Successfully forged and equipped [${gearName}]!`);
        showBlacksmithForgeMenu();
    }

    function toggleLockCompanion(idx) { game.staff[idx].locked = !game.staff[idx].locked; saveGame(); showStaffMenu(); }

    function trainCompanion(idx, cost) {
        let member = game.staff[idx];
        if ((game.funds || 0) >= cost) {
            game.funds -= cost; member.level = (member.level || 1) + 1; member.power = (member.power || 25) + 6; member.maxHp = (member.maxHp || 100) + 15; member.hp = member.maxHp;
            saveGame(); updateUI(); alert(`🎉 ${member.name} reached Level ${member.level}! Power is now ${member.power}!`); showStaffMenu();
        } else { alert(`❌ Need $${cost} to train!`); }
    }

    function limitBreakEvolve(idx) {
        let member = game.staff[idx];
        if ((member.level || 1) < 5 || (member.loyalty || 0) < 50) { alert(`❌ Requirements: Level 5+ & 50+ Loyalty!`); return; }
        if (member.evolved) { alert("✨ This hero is already Ascended!"); return; }
        member.name = `Ascended ${member.name} ⚡`; member.power = (member.power || 25) * 2; member.maxHp = (member.maxHp || 100) * 2; member.hp = member.maxHp; member.evolved = true;
        saveGame(); updateUI(); alert(`🌟 EVOLUTION SUCCESS! ${member.name} base stats are DOUBLED!`); showStaffMenu();
    }

    function releaseCompanion(idx) {
        let member = game.staff[idx];
        if (game.staff.length <= 1) { alert("❌ Cannot release only companion!"); return; }
        if (member.locked) { alert("🔒 Unlock companion first!"); return; }
        if (confirm(`⚠️ Release ${member.name}?`)) {
            game.staff.splice(idx, 1); if (game.activeChampionIndex >= game.staff.length) game.activeChampionIndex = 0;
            game.funds = (game.funds || 0) + 150; saveGame(); updateUI(); showStaffMenu();
        }
    }

                <strong style="color:#ff66ff;">👥 Companions on Team:</strong> ${game.staff.length}
            </div>
        `;
        renderButtons([
            { text: "🎒 Trade an Item", class: "btn btn-mine", action: showItemTradeSelection },
            { text: "🎭 Trade a Companion", class: "btn btn-maid", action: showCompanionTradeSelection },
            { text: "⬅ Back to Lobby", class: "btn btn-back", action: renderActiveLobbyView }
        ]);
    }

    function showItemTradeSelection() {
        clearConsole("flex-start", "radial-gradient(circle at 50% 30%, #201a00 0%, #050400 85%)", "#ffaa00");
        let uniqueItems = [...new Set(game.inventory || [])];
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ffaa00; font-size:16px;">🎒 SELECT ITEM TO TRADE</h2>
            <p style="color:#aaa; font-size:12px;">Click any item below to broadcast an offer:</p>
        `;
        let btns = [];
        if (uniqueItems.length === 0) {
            btns.push({ text: "🎒 Backpack is Empty", class: "btn btn-sys", action: () => {} });
        } else {
            uniqueItems.forEach(itemName => {
                let count = game.inventory.filter(i => i === itemName).length;
                btns.push({
                    text: `📦 ${itemName} (x${count})`,
                    class: "btn btn-mine",
                    action: () => broadcastTradeOffer('item', itemName)
                });
            });
        }
        btns.push({ text: "⬅ Back", class: "btn btn-back", action: showMultiplayerTradeScreen });
        renderButtons(btns);
    }

    function showCompanionTradeSelection() {
        clearConsole("flex-start", "radial-gradient(circle at 50% 30%, #201a00 0%, #050400 85%)", "#ffaa00");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff66ff; font-size:16px;">🎭 SELECT COMPANION TO TRADE</h2>
            <p style="color:#aaa; font-size:12px;">Choose a character to trade to other trainers:</p>
        `;
        let btns = [];
        if (!game.staff || game.staff.length <= 1) {
            btns.push({ text: "❌ Need >1 Hero to Trade", class: "btn btn-sys", action: () => alert("You cannot trade your only companion!") });
        } else {
            game.staff.forEach((member, idx) => {
                btns.push({
                    text: `${member.name} (${member.origin || 'Hero'})`,
                    class: "btn btn-maid",
                    action: () => broadcastTradeOffer('character', member, idx)
                });
            });
        }
        btns.push({ text: "⬅ Back", class: "btn btn-back", action: showMultiplayerTradeScreen });
        renderButtons(btns);
    }

    function broadcastTradeOffer(type, tradeData, index = null) {
        if (type === 'item') {
            if (!game.inventory.includes(tradeData)) { alert("❌ Item not found!"); return; }
            if (socket && socket.connected) {
                socket.emit('offerTradeItem', { roomId: currentRoomId, item: tradeData, senderName: game.playerName });
                alert(`🤝 Broadcasted trade offer for 1x [${tradeData}] to Room ${currentRoomId}!`);
            } else { alert(`🤝 Selected [${tradeData}] for trade!`); }
        } else if (type === 'character') {
            if (socket && socket.connected) {
                socket.emit('offerTradeCharacter', { roomId: currentRoomId, character: tradeData, senderName: game.playerName });
                alert(`🎭 Broadcasted trade offer for [${tradeData.name}] to Room ${currentRoomId}!`);
            } else { alert(`🎭 Selected [${tradeData.name}] for trade!`); }
        }
        showMultiplayerTradeScreen();
    }

    function challengePlayerPvP(targetId, opponentName) {
        const champ = getActiveChampion();
        if (socket && socket.connected && targetId) {
            socket.emit('requestPvP', { roomId: currentRoomId, targetId: targetId, challengerName: game.playerName, champion: champ.name });
            alert(`⚔️ PvP challenge sent to ${opponentName}!`);
        } else {
            playBGM('battle');
            activeCombatSession = {
                enemyName: `${opponentName}'s Champion`, enemyHP: 160, enemyMaxHP: 160, enemyDmg: 18,
                rewardCash: 1500, regionKey: null, companionName: champ.name, companionHP: 100, companionMaxHP: 100, companionPower: champ.power || 35
            };
            renderPokemonCombatScreen();
        }
    }

    function renderLivePvPScreen() {
        const s = activePvPSession;
        if (!s) return;
        clearConsole("center", "#2b000f", "#ff0055");
        const isMyTurn = socket.id === s.turn;
        const champ = getActiveChampion();

        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0055; font-size:16px;">⚔️ LIVE PVP DUEL</h2>
            <div style="display:flex; justify-content:space-around; width:100%; margin: 6px 0;">
                <div class="dex-card" style="width:48%; display:block; text-align:center;">
                    <strong style="color:#00ffff;">${champ.name}</strong><br>
                    ❤️ HP: <span style="color:#33ff33;">${socket.id === s.p1Id ? s.p1Hp : s.p2Hp} / 120</span>
                </div>
                <div class="dex-card" style="width:48%; display:block; text-align:center;">
                    <strong style="color:#ff0055;">Opponent</strong><br>
                    ❤️ HP: <span style="color:#ff3333;">${socket.id === s.p1Id ? s.p2Hp : s.p1Hp} / 120</span>
                </div>
            </div>
            <p style="color:#ffff00; font-size:12px;">${s.log}</p>
        `;

        if (isMyTurn) {
            renderButtons([
                { text: "⚔️ Strike", class: "btn btn-combat", action: () => executePvPAction("strike") },
                { text: "🛡️ Guard (-50%)", class: "btn btn-sys", action: () => executePvPAction("guard") },
                { text: "⚡ Special (15 Stm)", class: "btn btn-dlc", action: () => executePvPAction("special") }
            ]);
        } else { renderButtons([]); }
    }

    function executePvPAction(actionType) {
        if (!activePvPSession) return;
        if (actionType === "special") {
            if ((game.stamina || 0) < 15) { alert("❌ Not enough stamina!"); return; }
            game.stamina -= 15; saveGame(); updateUI();
        }
        const champ = getActiveChampion();
        if (socket) {
            socket.emit('executeLivePvPAction', {
                battleId: activePvPSession.battleId, actionType: actionType, power: champ.power || 25, championName: champ.name
            });
        }
    }

    function showWorldBossRaidScreen() {
        playBGM('villain');
        clearConsole("flex-start", "#2b0008", "#ff0055");
        let percent = Math.max(0, (serverRaidBoss.hp / serverRaidBoss.maxHp) * 100);
        document.getElementById("console").innerHTML = `
            <h2 style="color:#ff0055; font-size:16px; margin: 2px 0;">👹 MULTIVERSE WORLD BOSS</h2>
            <strong style="color:#fff; font-size:13px;">${serverRaidBoss.name}</strong>
            <div style="width:90%; max-width:360px; height:12px; background:#111; border:1px solid #ff0055; border-radius:8px; margin:4px 0; overflow:hidden;">
                <div id="boss-hp-fill" style="width:${percent}%; height:100%; background:linear-gradient(90deg, #ff0033, #ff5500); transition: width 0.3s ease;"></div>
            </div>
            <p style="color:#aaa; font-size:11px;">Boss Health: <span id="boss-hp-text" style="color:#ff5555; font-weight:bold;">${serverRaidBoss.hp} / ${serverRaidBoss.maxHp}</span></p>
            <div id="raid-boss-combat-log" style="width:95%; max-width:380px; height:70px; background:#050005; border:1px solid #ff005555; border-radius:4px; padding:6px; overflow-y:auto; margin-bottom:4px;"></div>
        `;
        renderButtons([
            { text: "⚔️ Strike Boss", class: "btn btn-combat", action: () => raidBossAction("strike") },
            { text: "⚡ Burst Raid (15 Stm)", class: "btn btn-raid", action: () => raidBossAction("burst") },
            { text: "🐉 Netherfang Tier 2", class: "btn btn-dlc", action: () => { if(socket) socket.emit('selectRaidTier', 'dragon'); showWorldBossRaidScreen(); } },
            { text: "⬅ Back to Lobby", class: "btn btn-back", action: renderActiveLobbyView }
        ]);
    }

    function raidBossAction(type) {
        if (serverRaidBoss.hp <= 0) { alert("Boss defeated! Respawning soon..."); return; }
        const champ = getActiveChampion();
        let mult = type === "burst" ? 2.5 : 1.0;
        if (type === "burst") {
            if ((game.stamina || 0) < 15) { alert("Not enough stamina!"); return; }
            game.stamina -= 15; saveGame(); updateUI();
        }
        let dmg = Math.floor((champ.power || 25) * mult + Math.random() * 15);
        if (socket) socket.emit('attackRaidBoss', { damage: dmg, trainerName: game.playerName, championName: champ.name });
    }

    if (socket) {
        socket.on('roomUpdate', ({ roomId, players }) => { onlineRoomPlayers = players; if (currentRoomId === roomId) renderActiveLobbyView(); });
    }

    function showCreditsMenu() {
        playBGM('credits');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #151515 0%, #000 85%)", "#ffffff");
        document.getElementById("console").innerHTML = `
            <h2 style="color:#fff; font-size:18px;">📜 UNIDEX LEGENDS — CREDITS</h2>
            <div class="dex-card" style="display:block;line-height:1.5;font-size:12px;text-align:center;">
                <strong>UNIDEX LEGENDS</strong><br><br>
                <strong>Concept & Direction</strong><br>Bill<br><br>
                <strong>Beta Testing</strong><br>Fr3xi0us<br><br>
                <strong>Concepts & Ideas</strong><br>Doug & Don<br><br>
                <em style="color:#ffcc00; font-size:10.5px;">Disclaimer: This is a non-profit fangame. All characters, names, and intellectual properties belong to their respective copyright holders. No infringement intended.</em>
            </div>
        `;
        renderButtons([{ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }]);
    }

    function triggerRestCycleAnimation() {
        playBGM('rest');
        clearConsole("center", "radial-gradient(circle at 50% 30%, #000 0%, #080702 85%)", "#ffaa00");
        document.getElementById("console").innerHTML = `
            <div class="rest-scene">
                <h2 style="color: #00ffff; margin-bottom: 8px; font-size:18px;">💤 SLEEPING... (DAY CYCLE)</h2>
                <div>
                    <span class="zzz-1">Z</span>
                    <span class="zzz-2">Z</span>
                    <span class="zzz-3">Z</span>
                </div>
            </div>
        `;
        renderButtons([]);
        setTimeout(() => {
            game.stamina = 100;
            game.day++;
            let passive = (game.staff || []).length * 50;
            game.funds += passive;
            if (game.farm && game.farm.plots) game.farm.plots.forEach(p => { if (p.crop) p.ready = true; });
            saveGame(); showMainMenu();
        }, 3800);
    }

    function showDexMenu(page = 1, searchQuery = "") {
        playBGM('dex');
        clearConsole("flex-start", "radial-gradient(circle at 50% 20%, #1a1500 0%, #080702 85%)", "#ffff00");
        
        let entries = getAllDexEntries();
        if (searchQuery.trim() !== "") {
            let q = searchQuery.toLowerCase();
            entries = entries.filter(c => c.name.toLowerCase().includes(q) || (c.origin && c.origin.toLowerCase().includes(q)));
        }

        let perPage = 15;
        let totalPages = Math.ceil(entries.length / perPage) || 1;
        page = Math.max(1, Math.min(page, totalPages));
        let slice = entries.slice((page-1)*perPage, page*perPage);

        let html = `
            <h2 style="color:#ffff00; font-size:18px;">📖 UNIDEX (${page}/${totalPages})</h2>
            <div style="margin: 6px 0; width: 100%; display: flex; justify-content: center; gap: 4px;">
                <input type="text" id="dex-search-input" placeholder="Search name/origin..." value="${searchQuery}" style="background: #111; color: #0ff; border: 1px solid #0ff; padding: 5px; font-family: 'Courier New'; font-size: 11px; border-radius: 4px; width: 60%; max-width: 180px;" />
                <button class="btn btn-sys" style="padding: 4px 8px; font-size: 11px; min-height:28px;" onclick="filterDexSearch()">Search</button>
                ${searchQuery ? `<button class="btn btn-back" style="padding: 4px 6px; font-size: 11px; min-height:28px;" onclick="showDexMenu(1, '')">Reset</button>` : ''}
            </div>
            <div style="width:100%;">
        `;
        slice.forEach(e => {
            let caught = game.pokedex && game.pokedex[String(e.id)];
            let icon = caught ? `<img src="${getCharacterPortrait(e.name)}" style="width:26px;height:26px;object-fit:contain;border-radius:4px;border:1px solid #0ff;" onerror="this.style.display='none'"/>` : '⚪';
            html += `<div class="dex-card" style="font-size:11.5px;">${icon} <span>#${e.id} - ${caught ? e.name : '????????'}</span></div>`;
        });
        html += `</div>`;
        document.getElementById("console").innerHTML = html;

        let btns = [];
        if (page > 1) btns.push({ text: "⬅ Prev", action: () => showDexMenu(page - 1, searchQuery) });
        if (page < totalPages) btns.push({ text: "Next ➡", action: () => showDexMenu(page + 1, searchQuery) });
        btns.push({ text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu });
        renderButtons(btns);

        let searchInput = document.getElementById("dex-search-input");
        if (searchInput) {
            searchInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") filterDexSearch();
            });
        }
    }

    function filterDexSearch() {
        let input = document.getElementById("dex-search-input");
        let query = input ? input.value.trim() : "";
        showDexMenu(1, query);
    }

    // --- REGIONS & MONSTER ENCOUNTERS ---
    function showWorldMap() {
        playBGM('hq');
        clearConsole("center", "radial-gradient(circle at 50% 40%, #002244 0%, #02060a 85%)", "#00ffcc");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #00ffcc; font-size:18px;">🗺️ MIDNORIA REGIONS MAP</h2>
            <p style="color: #aaa; font-size:12px;">Explore diverse biomes and hunt regional monsters (Costs 5 Stamina):</p>
        `;
        renderButtons([
            { text: "🌲 Whispering Forest", class: "btn btn-farm", action: () => selectRegion('forest') },
            { text: "🏜️ Sunscorched Desert", class: "btn btn-mine", action: () => selectRegion('desert') },
            { text: "🌋 Obsidian Volcano", class: "btn btn-combat", action: () => selectRegion('volcano') },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function selectRegion(regionKey) {
        if (game.stamina < 5) { log("❌ Not enough stamina!", "color-red"); return; }
        game.stamina -= 5;
        let reg = REGIONS_DATA[regionKey];
        game.location = reg.name;
        updateUI(); saveGame();

        clearConsole("center", reg.bg, reg.color);
        let animDivClass = reg.animClass ? reg.animClass : '';
        document.getElementById("console").innerHTML = `
            <div class="${animDivClass}" style="width:100%; height:100%;">
                <div class="travel-animation">
                    <div style="font-size: 40px; margin-bottom: 8px;">${reg.icon || '🚀'}</div>
                    <h2 style="color: ${reg.color}; font-size:18px;">ARRIVED IN ${reg.name.toUpperCase()}</h2>
                </div>
            </div>
        `;
        renderButtons([]);
        setTimeout(() => { showRegionHub(regionKey); }, 1300);
    }

    function showRegionHub(regionKey) {
        let reg = REGIONS_DATA[regionKey];
        clearConsole("flex-start", reg.bg, reg.color);
        document.getElementById("console").innerHTML = `
            <h2 style="color: ${reg.color}; font-size:18px;">${reg.name.toUpperCase()}</h2>
            <p style="color: #aaa; font-size:12px;">Hunt regional monsters or gather rare materials.</p>
        `;
        renderButtons([
            { text: "⚔️ Hunt Regional Monster", class: "btn btn-combat", action: () => startRegionalMonsterEncounter(regionKey) },
            { text: "🗺️ Switch Region", class: "btn btn-map", action: showWorldMap },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function startRegionalMonsterEncounter(regionKey) {
        playBGM('battle');
        let reg = REGIONS_DATA[regionKey];
        let randomMob = reg.monsters[Math.floor(Math.random() * reg.monsters.length)];
        let leadCompanion = (game.staff && game.staff.length > 0) ? game.staff[0] : { name: "Trainer Partner", power: 35 };

        activeCombatSession = {
            enemyName: randomMob.name, enemyHP: randomMob.hp, enemyMaxHP: randomMob.hp, enemyDmg: randomMob.dmg,
            rewardCash: randomMob.reward, regionKey: regionKey, companionName: leadCompanion.name, companionHP: 100, companionMaxHP: 100, companionPower: leadCompanion.power || 35
        };
        renderPokemonCombatScreen();
    }

    function showMiningHub() {
        playBGM('horror');
        clearConsole("flex-start", "radial-gradient(circle at 50% 35%, #1a0f00 0%, #050200 85%)", "#ff8800");
        let inventoryHTML = `<div style="width:98%; max-width:380px; background:#0b0800; border:1px dashed #ffaa0088; border-radius:6px; padding:6px; margin:6px 0; text-align:left;">
            <strong style="color:#ffaa00; font-size:12px;">🎒 Bag Minerals (${game.inventory.filter(i => ['Copper Ore','Diamond'].includes(i)).length}):</strong><br>
            <span style="font-size:11px; color:#aaa;">${game.inventory.filter(i => ['Copper Ore','Diamond'].includes(i)).join(', ') || 'No ores or gems in backpack yet.'}</span>
        </div>`;

        document.getElementById("console").innerHTML = `
            <div class="mining-scene" style="width:100%; height:100%;">
                <h2 style="color: #ffaa00; font-size:18px;">⛏️ STARDEW VALLEY MINES</h2>
                <p style="color: #aaa; font-size:12px;">Smash rocks, mine ores, and fight monsters.</p>
                ${inventoryHTML}
            </div>
        `;
        renderButtons([
            { text: "⛏️ Mine Rocks (15 Stm)", class: "btn btn-mine", action: performMiningAction },
            { text: "🦇 Hunt Cave Monster", class: "btn btn-combat", action: () => startCombatEncounter("Cave Monster") },
            { text: "⬅ Back to HQ", class: "btn btn-back", action: showMainMenu }
        ]);
    }

    function performMiningAction() {
        if (game.stamina < 15) { log("❌ Not enough stamina!", "color-red"); return; }
        game.stamina -= 15;

        clearConsole("center", "radial-gradient(circle at 50% 35%, #1a0f00 0%, #050200 85%)", "#ff8800");
        document.getElementById("console").innerHTML = `
            <div class="mining-animation" style="width:100%; height:100%;">
                <h2 style="color: #ffaa00; font-size:18px;">⛏️ MINING IN PROGRESS...</h2>
                <p style="color: #fff; font-size: 14px;">*Whack* *Whack* Smashing rocks!</p>
            </div>
        `;
        renderButtons([]);

        setTimeout(() => {
            let foundGem = Math.random() < 0.25;
            let rewardedItem = foundGem ? "Diamond" : "Copper Ore";
            game.funds += 250;
            game.inventory.push(rewardedItem);
            updateUI(); saveGame();
            log(`✨ Added to Inventory: 1x ${rewardedItem}! Found $250!`, "color-cyan");
            showMiningHub();
        }, 1500);
    }

    function startCombatEncounter(enemyName) {
        playBGM('battle');
        let leadCompanion = (game.staff && game.staff.length > 0) ? game.staff[0] : { name: "Trainer Partner", power: 35 };
        activeCombatSession = {
            enemyName: enemyName, enemyHP: 100, enemyMaxHP: 100, enemyDmg: 12, rewardCash: 1000, regionKey: null,
            companionName: leadCompanion.name, companionHP: 100, companionMaxHP: 100, companionPower: leadCompanion.power || 35
        };
        renderPokemonCombatScreen();
    }

    function renderPokemonCombatScreen() {
        let s = activeCombatSession;
        clearConsole("center", "radial-gradient(circle at 50% 30%, #33000a 0%, #080002 85%)", "#ff0044");
        document.getElementById("console").innerHTML = `
            <h2 style="color: #ff0033; font-size:16px;">⚔️ BATTLE vs ${s.enemyName.toUpperCase()}</h2>
            <div style="display: flex; justify-content: space-around; width: 100%; margin: 8px 0;">
                <div class="dex-card" style="text-align: center; width: 48%; display: block; border-color: #00ff66; padding:6px;">
                    ${portrait(getCharacterPortrait(s.companionName), s.companionName, 75)}
                    <strong style="color: #00ffff; font-size:12px;">${s.companionName}</strong><br>
                    ❤️ <span style="color:#33ff33; font-size:11px;" id="comp-hp">${s.companionHP} / ${s.companionMaxHP}</span>
                </div>
                <div class="dex-card" style="text-align: center; width: 48%; display: block; border-color: #ff0055; padding:6px;">
                    <strong style="color: #ff0055; font-size:12px;">${s.enemyName}</strong><br>
                    ❤️ <span style="color:#ff3333; font-size:11px;" id="enemy-hp">${s.enemyHP} / ${s.enemyMaxHP}</span>
                </div>
            </div>
            <p style="color: #ffff00; font-size: 12px; margin:2px 0;" id="combat-log">What will ${s.companionName} do?</p>
        `;
        renderButtons([
            { text: "⚔️ Strike", class: "btn btn-combat", action: () => executePokemonAction('strike') },
            { text: "🏃 Run Away", class: "btn btn-back", action: s.regionKey ? () => showRegionHub(s.regionKey) : showMiningHub }
        ]);
    }

    function executePokemonAction(actionType) {
        let s = activeCombatSession;
        let dmg = s.companionPower + Math.floor(Math.random() * 12);
        s.enemyHP = Math.max(0, s.enemyHP - dmg);
        document.getElementById("enemy-hp").innerText = `${s.enemyHP} / ${s.enemyMaxHP}`;
        document.getElementById("combat-log").innerHTML = `<span style="color:#00ffff;">${s.companionName} dealt ${dmg} damage!</span>`;

        if (s.enemyHP <= 0) {
            setTimeout(() => {
                game.funds += (s.rewardCash || 1000);
                updateUI(); saveGame();
                clearConsole("center", "radial-gradient(circle,#003300,#000)", "#00ff88");
                document.getElementById("console").innerHTML = `<h2 style="font-size:18px;">🎉 BATTLE WON!</h2><p style="font-size:12px;">Earned $${s.rewardCash || 1000}!</p>`;
                renderButtons([{ text: "Return to HQ", class: "btn btn-back", action: showMainMenu }]);
            }, 1200);
        } else {
            setTimeout(() => {
                s.companionHP = Math.max(0, s.companionHP - s.enemyDmg);
                document.getElementById("comp-hp").innerText = `${s.companionHP} / ${s.companionMaxHP}`;
                if (s.companionHP <= 0) {
                    clearConsole("center", "radial-gradient(circle,#330000,#000)", "#ff3333");
                    document.getElementById("console").innerHTML = `<h2 style="font-size:18px;">💀 DEFEATED...</h2><p style="font-size:12px;">Fled back to HQ.</p>`;
                    renderButtons([{ text: "Return to HQ", class: "btn btn-back", action: showMainMenu }]);
                }
            }, 1000);
        }
    }

    window.onload = async () => { await loadCharacterDatabase(); showIntroScreen(); };
</script>
